# Staging Docker Compose
# Deployed automatically by CI — changes here are synced to ~/staging/docker-compose.yml on the server.
# Uses pre-built images from GHCR (pushed by CI build step).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Loopback only: read-only developer access via SSH tunnel (see /root/README.md on the server).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - staging-postgres:/var/lib/postgresql/data
    env_file:
      - .env
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 1s
      retries: 5
    logging:
      driver: journald
      options:
        tag: staging-postgres
    networks:
      - staging

  server:
    image: ghcr.io/moto-nrw/phoenix-server:staging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./main", "serve"]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - staging-avatar-uploads:/app/public/uploads
    env_file:
      - .env
    logging:
      driver: journald
      options:
        tag: staging-server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - staging

  frontend:
    image: ghcr.io/moto-nrw/phoenix-frontend:staging
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      # Frontend-specific: internal API URL (not exposed via .env)
      API_URL: http://server:8080
      # Override PORT from shared .env (8080 is for the backend; Next.js must listen on 3000)
      PORT: 3000
      # Bind Next.js standalone to IPv4 so Docker healthchecks can reach it inside Alpine.
      HOSTNAME: 0.0.0.0
    logging:
      driver: journald
      options:
        tag: staging-frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - staging

networks:
  staging:
    driver: bridge

volumes:
  staging-postgres:
  staging-avatar-uploads:
    name: phoenix-staging-uploads
