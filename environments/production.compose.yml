# Production Docker Compose
# Deployed automatically by CI — changes here are synced to ~/production/docker-compose.yml on the server.
# Uses pre-built images from GHCR (pushed by CI build step).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Loopback only: read-only developer access via SSH tunnel (see /root/README.md on the server).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - /etc/docker/postgres/ssl/certs:/var/lib/postgresql/ssl/certs:ro
    env_file:
      - .env
    command:
      [
        "postgres",
        "-c",
        "ssl=on",
        "-c",
        "ssl_cert_file=/var/lib/postgresql/ssl/certs/server.crt",
        "-c",
        "ssl_key_file=/var/lib/postgresql/ssl/certs/server.key",
        "-c",
        "ssl_ca_file=/var/lib/postgresql/ssl/certs/ca.crt",
        "-c",
        "ssl_min_protocol_version=TLSv1.2",
        "-c",
        "password_encryption=scram-sha-256",
        "-c",
        "listen_addresses=*",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
        "-c",
        "shared_buffers=1GB",
        "-c",
        "effective_cache_size=3GB",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 1s
      retries: 5
    logging:
      driver: journald
      options:
        tag: prod-postgres
    networks:
      - production

  server:
    image: ghcr.io/moto-nrw/phoenix-server:main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./main", "serve"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - production-avatar-uploads:/app/public/uploads
    env_file:
      - .env
    logging:
      driver: journald
      options:
        tag: prod-server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - production

  frontend:
    image: ghcr.io/moto-nrw/phoenix-frontend:main
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      # Frontend-specific: internal API URL (not exposed via .env)
      API_URL: http://server:8080
      # Override PORT from shared .env (8080 is for the backend; Next.js must listen on 3000)
      PORT: 3000
      # Bind Next.js standalone to IPv4 so Docker healthchecks can reach it inside Alpine.
      HOSTNAME: 0.0.0.0
    logging:
      driver: journald
      options:
        tag: prod-frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - production

networks:
  production:
    driver: bridge

volumes:
  postgres:
  production-avatar-uploads:
    name: phoenix-production-uploads
