# Host, backup and database-pool alerting. Created in the Grafana UI and
# moved to file provisioning on 2026-10-23 with unchanged UIDs, queries and
# thresholds. Notifications use the default notification policy; contact
# points stay on the monitoring host because they name recipients.

apiVersion: 1
groups:
  - orgId: 1
    name: Phoenix Infrastructure
    folder: Phoenix Alerts
    interval: 1m
    rules:
      - uid: dfsla2b54bgg0a
        title: Production Backup Missing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: P8E80F9AEF21F6940
            model:
              expr: count_over_time({env="prod", service="backup"} |= "Backup complete"
                [26h])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: No successful production DB backup in the last 26 hours. Check
            /var/log/phoenix-backup.log and cron on the server.
        labels:
          severity: critical
        isPaused: false
      - uid: dfsla2b8noa2od
        title: Backup Failed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: P8E80F9AEF21F6940
            model:
              expr: count_over_time({service="backup"} |= "Backup FAILED" [30m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        annotations:
          summary: A DB backup run reported failure. Check /var/log/phoenix-backup*.log
            on the server.
        labels:
          severity: high
        isPaused: false
      - uid: ffsla2bbkk0lcb
        title: Host Disk Space Low
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 * node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
                / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 15
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 15m
        annotations:
          summary: Less than 15% disk space left on / of the monitoring/app host.
            Loki and Prometheus retention will start failing soon.
        labels:
          severity: critical
        isPaused: false
      - uid: cfsla2bf8wmwwc
        title: Scrape Target Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: up
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: A Prometheus scrape target is down (backend, frontend, node-exporter,
            cadvisor or prometheus itself).
        labels:
          severity: high
        isPaused: false
      - uid: afsla2bjoq51ce
        title: Host Memory Low
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          summary: Less than 10% of host RAM available for more than 10 minutes.
        labels:
          severity: high
        isPaused: false
      - uid: efslb2po2iry8c
        title: Host CPU High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 15m
        annotations:
          summary: Host CPU above 80% for 15 minutes. Sustained load — check dashboards,
            consider scaling.
        labels:
          severity: high
        isPaused: false
      - uid: dfslb2ps8coowf
        title: DB Pool Saturation
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum by (env) (rate(phoenix_db_wait_duration_seconds_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          summary: Requests spend over 50ms per second waiting for a free DB connection,
            sustained for 10+ minutes. The pool is under real pressure — earliest
            hard scaling signal. (Brief per-request waits from refetch bursts are
            expected and no longer alert.)
        labels:
          severity: critical
        isPaused: false
      - uid: bfslb2pv7qbk0c
        title: Frontend Event Loop Lag
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: phoenix_frontend_nodejs_eventloop_lag_p99_seconds
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.2
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          summary: Node.js event loop lag p99 above 200ms for 10 minutes. The frontend
            process is saturated.
        labels:
          severity: high
        isPaused: false
      - uid: dfslb2pyr356ob
        # Backend connection pool, not the PostgreSQL cluster: the stack runs no
        # postgres_exporter (#6465). The left side is the 5-minute mean of
        # connections in use against DB_MAX_OPEN_CONNS. The right side keeps a
        # scraped backend without these gauges from passing as OK: it yields
        # 100 with reason="pool_metric_missing" for every env whose backend is
        # up but exports no pool limit. A backend that is down already fires
        # Scrape Target Down; no data at all fires through noDataState.
        title: DB Pool Utilization High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '100 * max by (env) (avg_over_time(phoenix_db_in_use_connections[5m]) / phoenix_db_max_open_connections) or on (env) label_replace(100 * max by (env) (up{service="server"}), "reason", "pool_metric_missing", "", "")'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        annotations:
          summary: '{{ if $labels.reason }}The {{ $labels.env }} backend is scraped but
            exports no DB pool gauges (phoenix_db_max_open_connections, phoenix_db_in_use_connections),
            so its pool is unmonitored. Check the deployed backend version and /internal/metrics.{{
            else }}The {{ $labels.env }} backend kept more than 80% of its DB pool (DB_MAX_OPEN_CONNS)
            in use on average for 10+ minutes. Waits for a free connection follow; see
            DB Pool Saturation and monitoring/README.md "DB pool utilization".{{ end }}'
        labels:
          severity: critical
        isPaused: false
