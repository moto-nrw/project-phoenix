# Lefthook - Git hooks manager
# https://github.com/evilmartians/lefthook

# Pre-commit: Quick checks on staged files
pre-commit:
  parallel: true
  commands:
    # Git secrets check (if installed)
    git-secrets:
      run: git secrets --pre_commit_hook 2>/dev/null || true

    # Frontend lint-staged (prettier + oxlint with auto-fix)
    frontend-lint:
      glob: "frontend/**/*.{ts,tsx,js,jsx,mdx}"
      run: cd frontend && npx lint-staged
      stage_fixed: true

    # Environment key sync check (no decryption needed)
    env-sync:
      glob: "environments/*.sops.env"
      run: ./scripts/env-check.sh

    # Guard against committing unencrypted secrets in .sops.env files
    sops-encryption-check:
      glob: "environments/*.sops.env"
      run: |
        failed=false
        for f in environments/*.sops.env; do
          [ -f "$f" ] || continue
          if ! grep -q '^sops_version=' "$f"; then
            echo "❌ UNENCRYPTED file: $f"
            echo "   Run: sops encrypt --in-place $f"
            failed=true
            continue
          fi
          plaintext=$(grep -E '^[A-Za-z_][A-Za-z0-9_]*=.+' "$f" | grep -v 'ENC\[' | grep -v '^sops_' || true)
          if [ -n "$plaintext" ]; then
            echo "❌ Plaintext value in $f: ${plaintext%%=*}="
            echo "   Re-encrypt: sops encrypt --in-place $f"
            failed=true
          fi
        done
        if [ "$failed" = true ]; then
          exit 1
        fi

    # Go imports check (formatting and organization)
    go-imports:
      glob: "backend/**/*.go"
      run: |
        cd backend
        DIFF=$(../scripts/run-go-toolchain.sh go tool goimports -d . 2>&1)
        if [ -n "$DIFF" ]; then
          echo "❌ Go imports not organized. Run: cd backend && ../scripts/run-go-toolchain.sh go tool goimports -w ."
          echo "$DIFF"
          exit 1
        fi

# Pre-push: Full quality checks (runs before pushing to remote)
pre-push:
  parallel: true
  commands:
    git-secrets:
      run: git secrets --pre_commit_hook 2>/dev/null || true

    go-vet:
      glob: "backend/**/*.go"
      run: cd backend && ../scripts/run-go-toolchain.sh go vet ./...

    golangci-lint:
      glob: "backend/**/*.go"
      run: cd backend && ../scripts/run-go-toolchain.sh golangci-lint run --timeout 5m

    go-toolchain-pins:
      glob: "{backend/go.mod,backend/tools/go.mod,backend/Dockerfile,backend/Dockerfile.dev,devbox.json,devbox.lock,lefthook.yml,scripts/backend-architecture/go.mod,scripts/run-go-toolchain.sh,.github/workflows/*.yml}"
      run: cd backend && ../scripts/run-go-toolchain.sh go test ./test -run '^TestGoToolchainPinsRatchet$' -count=1

    backend-architecture:
      glob: "{backend/**/*.go,backend/architecture/**,backend/internal/architecture/**,scripts/backend-architecture.sh}"
      run: scripts/run-go-toolchain.sh scripts/backend-architecture.sh check

    # Dead code detection (matches CI)
    go-deadcode:
      glob: "backend/**/*.go"
      run: scripts/run-go-toolchain.sh scripts/check-deadcode.sh

    # Security vulnerability detection
    go-vulncheck:
      glob: "backend/**/*.go"
      run: cd backend && ../scripts/run-go-toolchain.sh govulncheck ./...

    # Frontend lint + typecheck (pnpm check = oxlint + tsc --noEmit)
    frontend-check:
      glob: "frontend/**/*.{ts,tsx}"
      run: cd frontend && pnpm run check

    # Frontend dependency graph validation (matches CI)
    frontend-depcruise:
      glob: "frontend/**/*.{ts,tsx,js,jsx}"
      run: cd frontend && pnpm depcruise

    # Frontend unused code detection (matches CI)
    frontend-knip:
      glob: "frontend/**/*.{ts,tsx,js,jsx}"
      run: cd frontend && pnpm knip && pnpm knip:production

# Post-merge: Check env sync after git pull
post-merge:
  commands:
    env-sync-check:
      run: |
        dotenv-linter diff .env .env.example 2>/dev/null | grep "missing" || true
        dotenv-linter diff backend/dev.env backend/dev.env.example 2>/dev/null | grep "missing" || true
        dotenv-linter diff frontend/.env.local frontend/.env.example 2>/dev/null | grep "missing" || true

    docker-compose-sync:
      run: |
        if [ -f docker-compose.yml ] && [ -f docker-compose.example.yml ]; then
          dyff between --omit-header docker-compose.example.yml docker-compose.yml 2>/dev/null || true
        elif [ ! -f docker-compose.yml ] && [ -f docker-compose.example.yml ]; then
          echo "docker-compose.yml missing - copy from docker-compose.example.yml"
        fi
