name: TEMP dom runner benchmark

# Temporary measurement for the DOM test shard checkout. Removed before merge.
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-dom-bench.yml'

permissions:
  contents: read

jobs:
  bench:
    name: dom depth ${{ matrix.depth }} shard ${{ matrix.shard }} rep ${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
        depth: [0, 1]
        shard: ['1/2', '2/2']
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.depth }}
          filter: blob:none

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm vitest run --disableConsoleIntercept --project app-dom --project school-date-dom --shard "$SHARD"
