name: Build and Push Docker Images
run-name: Build ${{ github.sha }}

on:
  # Production: Build and deploy on push to main
  # Staging: Build and deploy on push to development
  push:
    branches:
      - main
      - development
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'environments/**'
      - '.github/workflows/build.yml'
      - '!**.md'
      - '!docs/**'
      - '!.vscode/**'

  # Manual trigger for emergencies
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions: {}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/moto-nrw/phoenix-server
  FRONTEND_IMAGE: ghcr.io/moto-nrw/phoenix-frontend

jobs:
  # Determine target environment and whether to proceed
  check-environment:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      is_staging: ${{ steps.check.outputs.is_staging }}
    steps:
      - name: Determine environment
        id: check
        run: |
          # Production: Push to main
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "is_staging=false" >> "$GITHUB_OUTPUT"
            echo "✅ Push to main - will build and deploy to production"

          # Staging: Push to development
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/development" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "is_staging=true" >> "$GITHUB_OUTPUT"
            echo "✅ Push to development - will build and deploy to staging"

          # Manual dispatch
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event.inputs.environment }}" == "staging" ]]; then
              echo "is_staging=true" >> "$GITHUB_OUTPUT"
            else
              if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
                echo "❌ Production manual deploys must run from main (current ref: ${{ github.ref }})"
                exit 1
              fi
              echo "is_staging=false" >> "$GITHUB_OUTPUT"
            fi
            echo "✅ Manual trigger for ${{ github.event.inputs.environment }}"
          fi

  validate-migrations:
    runs-on: ubuntu-latest
    needs: [check-environment]
    if: needs.check-environment.outputs.should_deploy == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go with cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Validate migration registry
        working-directory: backend
        run: go run main.go migrate validate

      - name: Check migration version collisions
        working-directory: backend
        run: go test ./database/migrations/ -run TestNoDuplicateMigrationVersions -v

  # Build and push backend image
  build-backend:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [check-environment, validate-migrations]
    if: needs.check-environment.outputs.should_deploy == 'true'
    # Cancel superseded builds on rapid pushes to the same ref. Deploy jobs
    # have their own concurrency groups, so they are NOT affected.
    concurrency:
      group: build-backend-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@33803e640bd9d674f2843a8c323aa2a7da478d23 # v2.0.0
        with:
          # Required since v2. Scopes the sticky-disk layer cache to this
          # Dockerfile; must differ from the frontend job to avoid cache thrash.
          cache-key: backend/Dockerfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            # Branch name (main for production)
            type=ref,event=branch
            # Short SHA for traceability
            type=sha,prefix=,format=short
            # 'staging' tag for staging deployments
            type=raw,value=staging,enable=${{ needs.check-environment.outputs.is_staging == 'true' }}
            # 'latest' tag for production (main branch)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2.2.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Layer cache is mounted automatically via Blacksmith sticky disks (per repo + Dockerfile)
          provenance: false

      - name: Image digest
        run: echo "Backend image pushed with digest ${{ steps.meta.outputs.digest }}"

  # Build and push frontend image
  build-frontend:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [check-environment, validate-migrations]
    if: needs.check-environment.outputs.should_deploy == 'true'
    # Cancel superseded builds on rapid pushes to the same ref. Deploy jobs
    # have their own concurrency groups, so they are NOT affected.
    concurrency:
      group: build-frontend-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@33803e640bd9d674f2843a8c323aa2a7da478d23 # v2.0.0
        with:
          # Required since v2. Scopes the sticky-disk layer cache to this
          # Dockerfile; must differ from the backend job to avoid cache thrash.
          cache-key: frontend/Dockerfile.prod

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for frontend
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            # Branch name (main for production)
            type=ref,event=branch
            # Short SHA for traceability
            type=sha,prefix=,format=short
            # 'staging' tag for staging deployments
            type=raw,value=staging,enable=${{ needs.check-environment.outputs.is_staging == 'true' }}
            # 'latest' tag for production (main branch)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Determine API URL
        id: api_url
        run: |
          if [[ "${{ needs.check-environment.outputs.is_staging }}" == "true" ]]; then
            echo "url=https://api-staging.moto-app.de" >> $GITHUB_OUTPUT
          else
            echo "url=https://api.moto-app.de" >> $GITHUB_OUTPUT
          fi

      - name: Determine operator hostname
        id: operator_hostname
        run: |
          if [[ "${{ needs.check-environment.outputs.is_staging }}" == "true" ]]; then
            echo "hostname=operator.staging.moto-app.de" >> $GITHUB_OUTPUT
          else
            echo "hostname=operator.moto-app.de" >> $GITHUB_OUTPUT
          fi

      - name: Determine parents hostname
        id: parents_hostname
        run: |
          if [[ "${{ needs.check-environment.outputs.is_staging }}" == "true" ]]; then
            echo "hostname=eltern.staging.moto-app.de" >> $GITHUB_OUTPUT
          else
            echo "hostname=eltern.moto-app.de" >> $GITHUB_OUTPUT
          fi

      - name: Determine tenant domain
        id: tenant_domain
        run: |
          if [[ "${{ needs.check-environment.outputs.is_staging }}" == "true" ]]; then
            echo "domain=staging.moto-app.de" >> $GITHUB_OUTPUT
          else
            echo "domain=moto-app.de" >> $GITHUB_OUTPUT
          fi

      # Generate clean guide PDFs from the public /help HTML pages before the
      # Docker build, so they ship inside the image (served as static
      # downloads) and never drift from the live guide content. Done here on
      # the Ubuntu runner rather than inside the Alpine Dockerfile to keep the
      # runtime image free of Chromium. The PDFs land in frontend/public/help/
      # pdfs/ and are picked up by the build context below; they are gitignored.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        # --ignore-scripts: this install only feeds the guide-PDF render
        # (next build + playwright). pnpm 10 already gates dependency lifecycle
        # scripts to the onlyBuiltDependencies allowlist (esbuild/sharp/unrs-
        # resolver), and of those only sharp matters here , it loads its
        # prebuilt @img/sharp-* binary at runtime, no install script needed.
        # Verified: install + full next build (incl. /help pages) pass without
        # scripts. Satisfies sonar githubactions:S6505.
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Cache the downloaded browser binary (~150 MB) keyed on the lockfile, so
      # a Playwright version bump invalidates it automatically. The runner is
      # ephemeral, so OS libs (--with-deps, apt) still install every run; only
      # the binary download is skipped on a cache hit.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Generate guide PDFs
        working-directory: frontend
        # The /help pages are public and host-agnostic, but this command boots a
        # production Next server (`next build && next start`). Build-time env
        # validation is skipped, while runtime instrumentation still validates a
        # complete server env on `next start`, so CI must provide harmless
        # throwaway values for vars the guide pages do not use.
        env:
          SKIP_ENV_VALIDATION: "true"
          METRICS_BEARER_TOKEN: "ci-guide-render-throwaway-token"
          API_URL: "http://server:8080"
          AUTH_JWT_EXPIRY: "15m"
          AUTH_JWT_REFRESH_EXPIRY: "7d"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXTAUTH_SECRET: "ci-guide-render-throwaway-secret"
          NEXT_PUBLIC_API_URL: ${{ steps.api_url.outputs.url }}
          NEXT_PUBLIC_OPERATOR_HOSTNAME: "operator.localhost:3000"
          NEXT_PUBLIC_PARENTS_HOSTNAME: "parents.localhost:3000"
          TENANT_DOMAIN: "localhost"
          NEXT_PUBLIC_TENANT_DOMAIN: "localhost"
        run: pnpm run generate:guides

      - name: Build and push frontend
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2.2.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # NEXT_PUBLIC_* values below are build-time-inlined into the client
          # bundle — THIS is the authoritative source for deployed builds. The
          # same-named keys in environments/*.sops.env are inert for the
          # client (kept only for env-check key sync + server-side env
          # validation); editing them there does NOT change the shipped host.
          build-args: |
            API_URL=http://server:8080
            NEXT_PUBLIC_API_URL=${{ steps.api_url.outputs.url }}
            NEXT_PUBLIC_OPERATOR_HOSTNAME=${{ steps.operator_hostname.outputs.hostname }}
            NEXT_PUBLIC_PARENTS_HOSTNAME=${{ steps.parents_hostname.outputs.hostname }}
            TENANT_DOMAIN=${{ steps.tenant_domain.outputs.domain }}
            NEXT_PUBLIC_TENANT_DOMAIN=${{ steps.tenant_domain.outputs.domain }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ needs.check-environment.outputs.is_staging == 'true' && 'staging' || 'production' }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=https://eu.i.posthog.com
          # Layer cache is mounted automatically via Blacksmith sticky disks (per repo + Dockerfile)
          provenance: false

      - name: Image digest
        run: echo "Frontend image pushed with digest ${{ steps.meta.outputs.digest }}"

  # Deploy to staging with automatic rollback on failure
  # Note: Currently staging runs on same server as production (different ports/dirs)
  # Using separate secrets allows easy migration to dedicated staging server later
  # Exit codes from deploy-remote.sh: 0=success, 1=pre-deploy abort, 10=rollback ok, 11=rollback failed
  deploy-staging:
    needs: [check-environment, build-backend, build-frontend]
    if: needs.check-environment.outputs.should_deploy == 'true' && needs.check-environment.outputs.is_staging == 'true'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install SOPS
        run: |
          curl -LsS https://github.com/getsops/sops/releases/download/v3.12.1/sops-v3.12.1.linux.amd64 -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops

      - name: Decrypt staging environment
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops decrypt environments/staging.sops.env > /tmp/staging.env

      - name: Deploy to staging
        id: deploy
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          ssh -i ~/.ssh/deploy_key root@$SSH_HOST "mkdir -p ~/scripts"
          scp -i ~/.ssh/deploy_key /tmp/staging.env root@$SSH_HOST:~/staging/.env.new
          scp -i ~/.ssh/deploy_key environments/staging.compose.yml root@$SSH_HOST:~/staging/docker-compose.yml.new
          scp -i ~/.ssh/deploy_key scripts/deploy-remote.sh root@$SSH_HOST:~/scripts/deploy-remote.sh
          scp -i ~/.ssh/deploy_key scripts/restore-db.sh root@$SSH_HOST:~/scripts/restore-db.sh

          set +e
          ssh -i ~/.ssh/deploy_key root@$SSH_HOST \
            "DEPLOY_DIR=staging DEPLOY_SHA=$SHORT_SHA BACKUP_RETENTION=3 bash ~/scripts/deploy-remote.sh"
          DEPLOY_EXIT=$?
          set -e

          echo "deploy_exit=$DEPLOY_EXIT" >> $GITHUB_OUTPUT

          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            exit 1
          fi

      - name: Cleanup secrets
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/staging.env

      - name: Notify on deploy failure
        if: always() && steps.deploy.outputs.deploy_exit != '' && steps.deploy.outputs.deploy_exit != '0'
        uses: ./.github/actions/notify-deploy-failure
        with:
          exit_code: ${{ steps.deploy.outputs.deploy_exit }}
          environment: staging
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          notify_emails: ${{ vars.DEPLOY_NOTIFY_EMAILS }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit_url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          sha: ${{ github.sha }}
          actor: ${{ github.actor }}

      - name: Notify Slack
        if: always()
        uses: ./.github/actions/notify-deploy-slack
        with:
          webhook_url: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          job_status: ${{ job.status }}
          environment: staging
          app_name: Phoenix
          exit_code: ${{ steps.deploy.outputs.deploy_exit }}
          github_token: ${{ github.token }}
          repository: ${{ github.repository }}
          commit_url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          sha: ${{ github.sha }}

  # Deploy to production with automatic rollback on failure
  # Exit codes from deploy-remote.sh: 0=success, 1=pre-deploy abort, 10=rollback ok, 11=rollback failed
  deploy-production:
    needs: [check-environment, build-backend, build-frontend]
    if: needs.check-environment.outputs.should_deploy == 'true' && needs.check-environment.outputs.is_staging == 'false'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Guard production source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [[ "$REF_NAME" != "refs/heads/main" ]]; then
            echo "Production deploys must run from refs/heads/main, got $REF_NAME"
            exit 1
          fi
          if [[ "$EVENT_NAME" != "push" && "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Production deploys only allow push or workflow_dispatch, got $EVENT_NAME"
            exit 1
          fi

      - name: Install SOPS
        run: |
          curl -LsS https://github.com/getsops/sops/releases/download/v3.12.1/sops-v3.12.1.linux.amd64 -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops

      - name: Decrypt production environment
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops decrypt environments/production.sops.env > /tmp/production.env

      - name: Deploy to production
        id: deploy
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          ssh -i ~/.ssh/deploy_key root@$SSH_HOST "mkdir -p ~/scripts"
          scp -i ~/.ssh/deploy_key /tmp/production.env root@$SSH_HOST:~/production/.env.new
          scp -i ~/.ssh/deploy_key environments/production.compose.yml root@$SSH_HOST:~/production/docker-compose.yml.new
          scp -i ~/.ssh/deploy_key scripts/deploy-remote.sh root@$SSH_HOST:~/scripts/deploy-remote.sh
          scp -i ~/.ssh/deploy_key scripts/restore-db.sh root@$SSH_HOST:~/scripts/restore-db.sh

          set +e
          ssh -i ~/.ssh/deploy_key root@$SSH_HOST \
            "DEPLOY_DIR=production DEPLOY_SHA=$SHORT_SHA BACKUP_RETENTION=7 bash ~/scripts/deploy-remote.sh"
          DEPLOY_EXIT=$?
          set -e

          echo "deploy_exit=$DEPLOY_EXIT" >> $GITHUB_OUTPUT

          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            exit 1
          fi

      - name: Cleanup secrets
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/production.env

      - name: Notify on deploy failure
        if: always() && steps.deploy.outputs.deploy_exit != '' && steps.deploy.outputs.deploy_exit != '0'
        uses: ./.github/actions/notify-deploy-failure
        with:
          exit_code: ${{ steps.deploy.outputs.deploy_exit }}
          environment: production
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          notify_emails: ${{ vars.DEPLOY_NOTIFY_EMAILS }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit_url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          sha: ${{ github.sha }}
          actor: ${{ github.actor }}

      - name: Notify Slack
        if: always()
        uses: ./.github/actions/notify-deploy-slack
        with:
          webhook_url: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          job_status: ${{ job.status }}
          environment: production
          app_name: Phoenix
          exit_code: ${{ steps.deploy.outputs.deploy_exit }}
          github_token: ${{ github.token }}
          repository: ${{ github.repository }}
          commit_url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          sha: ${{ github.sha }}

  # Summary job for branch protection
  build-status:
    runs-on: ubuntu-latest
    needs: [check-environment, validate-migrations, build-backend, build-frontend]
    if: always() && needs.check-environment.outputs.should_deploy == 'true'
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.validate-migrations.result }}" == "success" && "${{ needs.build-backend.result }}" == "success" && "${{ needs.build-frontend.result }}" == "success" ]]; then
            echo "✅ All images built and pushed successfully"
            echo "Backend: ${{ env.BACKEND_IMAGE }}"
            echo "Frontend: ${{ env.FRONTEND_IMAGE }}"
          else
            echo "❌ Build failed"
            echo "Migrations: ${{ needs.validate-migrations.result }}"
            echo "Backend: ${{ needs.build-backend.result }}"
            echo "Frontend: ${{ needs.build-frontend.result }}"
            exit 1
          fi
