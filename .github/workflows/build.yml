name: Build and Push Docker Images
run-name: Build ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

on:
  # Production: Build and deploy on push to main
  # Staging: Build and deploy on push to development
  push:
    branches:
      - main
      - development
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'environments/**'
      - '.github/workflows/build.yml'
      - '!**.md'
      - '!docs/**'
      - '!.vscode/**'

  # Demo: Build and deploy when PR with 'deploy-demo' label is merged
  pull_request:
    types: [closed]
    branches:
      - development

  # Manual trigger for emergencies
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - demo
          - production

  # Build on release for version tags
  release:
    types: [published]

permissions: {}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/moto-nrw/phoenix-server
  FRONTEND_IMAGE: ghcr.io/moto-nrw/phoenix-frontend

jobs:
  # Determine target environment and whether to proceed
  check-environment:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      is_staging: ${{ steps.check.outputs.is_staging }}
      is_demo: ${{ steps.check.outputs.is_demo }}
    steps:
      - name: Determine environment
        id: check
        run: |
          # Production: Push to main
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "is_staging=false" >> $GITHUB_OUTPUT
            echo "is_demo=false" >> $GITHUB_OUTPUT
            echo "✅ Push to main - will build and deploy to production"

          # Staging: Push to development
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/development" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "is_staging=true" >> $GITHUB_OUTPUT
            echo "is_demo=false" >> $GITHUB_OUTPUT
            echo "✅ Push to development - will build and deploy to staging"

          # Demo: PR merged with 'deploy-demo' label
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.event.pull_request.merged }}" == "true" ]]; then
              if [[ "${{ contains(github.event.pull_request.labels.*.name, 'deploy-demo') }}" == "true" ]]; then
                echo "should_deploy=true" >> $GITHUB_OUTPUT
                echo "is_staging=false" >> $GITHUB_OUTPUT
                echo "is_demo=true" >> $GITHUB_OUTPUT
                echo "✅ PR #${{ github.event.pull_request.number }} merged with 'deploy-demo' label - will build and deploy to demo"
              else
                echo "should_deploy=false" >> $GITHUB_OUTPUT
                echo "is_staging=false" >> $GITHUB_OUTPUT
                echo "is_demo=false" >> $GITHUB_OUTPUT
                echo "⏭️ PR #${{ github.event.pull_request.number }} merged without deploy label - skipping deployment"
              fi
            else
              echo "should_deploy=false" >> $GITHUB_OUTPUT
              echo "is_staging=false" >> $GITHUB_OUTPUT
              echo "is_demo=false" >> $GITHUB_OUTPUT
              echo "⏭️ PR #${{ github.event.pull_request.number }} closed without merge - skipping"
            fi

          # Manual dispatch
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            if [[ "${{ github.event.inputs.environment }}" == "staging" ]]; then
              echo "is_staging=true" >> $GITHUB_OUTPUT
              echo "is_demo=false" >> $GITHUB_OUTPUT
            elif [[ "${{ github.event.inputs.environment }}" == "demo" ]]; then
              echo "is_staging=false" >> $GITHUB_OUTPUT
              echo "is_demo=true" >> $GITHUB_OUTPUT
            else
              echo "is_staging=false" >> $GITHUB_OUTPUT
              echo "is_demo=false" >> $GITHUB_OUTPUT
            fi
            echo "✅ Manual trigger for ${{ github.event.inputs.environment }}"

          # Release: Deploy to production
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "is_staging=false" >> $GITHUB_OUTPUT
            echo "is_demo=false" >> $GITHUB_OUTPUT
            echo "✅ Release - will build and deploy to production"
          fi

  # Build and push backend image
  build-backend:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [check-environment]
    if: needs.check-environment.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # For merged PRs, checkout the merge commit on development
          ref: ${{ github.event_name == 'pull_request' && 'development' || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            # Branch name (main for production)
            type=ref,event=branch
            # Short SHA for traceability
            type=sha,prefix=,format=short
            # 'staging' tag for staging deployments (merged PRs with label)
            type=raw,value=staging,enable=${{ needs.check-environment.outputs.is_staging == 'true' }}
            # 'demo' tag for demo deployments (merged PRs with label)
            type=raw,value=demo,enable=${{ needs.check-environment.outputs.is_demo == 'true' }}
            # 'latest' tag for production (main branch)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Semantic version from release tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push backend
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Use separate cache scope to prevent frontend overwriting backend cache
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: false

      - name: Image digest
        run: echo "Backend image pushed with digest ${{ steps.meta.outputs.digest }}"

  # Build and push frontend image
  build-frontend:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [check-environment]
    if: needs.check-environment.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # For merged PRs, checkout the merge commit on development
          ref: ${{ github.event_name == 'pull_request' && 'development' || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for frontend
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            # Branch name (main for production)
            type=ref,event=branch
            # Short SHA for traceability
            type=sha,prefix=,format=short
            # 'staging' tag for staging deployments (merged PRs with label)
            type=raw,value=staging,enable=${{ needs.check-environment.outputs.is_staging == 'true' }}
            # 'demo' tag for demo deployments (merged PRs with label)
            type=raw,value=demo,enable=${{ needs.check-environment.outputs.is_demo == 'true' }}
            # 'latest' tag for production (main branch)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Semantic version from release tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Determine API URL
        id: api_url
        run: |
          if [[ "${{ needs.check-environment.outputs.is_staging }}" == "true" ]]; then
            echo "url=https://api-staging.moto-app.de" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.check-environment.outputs.is_demo }}" == "true" ]]; then
            echo "url=https://api-demo.moto-app.de" >> $GITHUB_OUTPUT
          else
            echo "url=https://api.moto-app.de" >> $GITHUB_OUTPUT
          fi

      - name: Determine operator hostname
        id: operator_hostname
        run: |
          if [[ "${{ needs.check-environment.outputs.is_staging }}" == "true" ]]; then
            echo "hostname=operator.staging.moto-app.de" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.check-environment.outputs.is_demo }}" == "true" ]]; then
            echo "hostname=operator.demo.moto-app.de" >> $GITHUB_OUTPUT
          else
            echo "hostname=operator.moto-app.de" >> $GITHUB_OUTPUT
          fi

      - name: Build and push frontend
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.api_url.outputs.url }}
            NEXT_PUBLIC_OPERATOR_HOSTNAME=${{ steps.operator_hostname.outputs.hostname }}
          # Use separate cache scope to prevent backend overwriting frontend cache
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false

      - name: Image digest
        run: echo "Frontend image pushed with digest ${{ steps.meta.outputs.digest }}"

  # Deploy to staging with automatic rollback on failure
  # Note: Currently staging runs on same server as production (different ports/dirs)
  # Using separate secrets allows easy migration to dedicated staging server later
  # Exit codes from SSH: 0=success, 10=deploy failed/rollback ok, 11=rollback also failed
  deploy-staging:
    needs: [check-environment, build-backend, build-frontend]
    if: needs.check-environment.outputs.should_deploy == 'true' && needs.check-environment.outputs.is_staging == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Install SOPS
        run: |
          curl -LsS https://github.com/getsops/sops/releases/download/v3.12.1/sops-v3.12.1.linux.amd64 -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops

      - name: Decrypt staging environment
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops decrypt environments/staging.sops.env > /tmp/staging.env

      - name: Deploy to staging
        id: deploy
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # SCP new files with .new suffix (preserves old files for rollback)
          scp -i ~/.ssh/deploy_key /tmp/staging.env root@$SSH_HOST:~/staging/.env.new
          scp -i ~/.ssh/deploy_key environments/staging.compose.yml root@$SSH_HOST:~/staging/docker-compose.yml.new

          set +e
          ssh -i ~/.ssh/deploy_key root@$SSH_HOST "DEPLOY_SHA=$SHORT_SHA bash -s" << 'DEPLOY_SCRIPT'
            cd ~/staging
            echo "Starting staging deployment..."

            # ── Save rollback copies of current config ──
            cp .env .env.rollback 2>/dev/null || true
            cp docker-compose.yml docker-compose.yml.rollback 2>/dev/null || true

            # ── Swap in new config ──
            mv .env.new .env
            mv docker-compose.yml.new docker-compose.yml

            # ── Pull new images ──
            if ! docker compose pull; then
              echo "Pull failed, restoring old config"
              cp .env.rollback .env 2>/dev/null || true
              cp docker-compose.yml.rollback docker-compose.yml 2>/dev/null || true
              docker compose up -d --wait 2>/dev/null || true
              exit 1
            fi

            # ── Stop app containers (postgres stays for backup) ──
            docker compose stop server frontend

            # ── Backup database (DB frozen — no app writing) ──
            mkdir -p ~/backups/staging
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_FILE=~/backups/staging/backup-${TIMESTAMP}.dump
            docker compose exec -T postgres pg_dump -U postgres -d postgres -Fc > "$BACKUP_FILE"
            if [ ! -s "$BACKUP_FILE" ]; then
              echo "Backup failed or empty, aborting deploy"
              rm -f "$BACKUP_FILE"
              cp .env.rollback .env 2>/dev/null || true
              cp docker-compose.yml.rollback docker-compose.yml 2>/dev/null || true
              docker compose pull 2>/dev/null || true
              docker compose up -d --wait 2>/dev/null || true
              exit 1
            fi
            echo "Backup: $(basename $BACKUP_FILE) ($(du -h $BACKUP_FILE | cut -f1))"

            # ── Read previous deploy state ──
            PREVIOUS_SHA=""
            if [ -f .deploy-state ]; then
              PREVIOUS_SHA=$(grep '^CURRENT_SHA=' .deploy-state | cut -d= -f2)
            fi

            # ── Run migration ──
            DEPLOY_FAILED=false
            if ! docker compose run --rm server ./main migrate; then
              echo "Migration FAILED"
              DEPLOY_FAILED=true
            fi

            # ── Start services (skip if migration failed) ──
            if [ "$DEPLOY_FAILED" = "false" ]; then
              if ! docker compose up -d --wait; then
                echo "Healthcheck FAILED"
                DEPLOY_FAILED=true
              fi
            fi

            # ── SUCCESS ──
            if [ "$DEPLOY_FAILED" = "false" ]; then
              echo "CURRENT_SHA=${DEPLOY_SHA}" > .deploy-state
              echo "PREVIOUS_SHA=${PREVIOUS_SHA}" >> .deploy-state
              echo "DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .deploy-state
              echo "BACKUP_FILE=${BACKUP_FILE}" >> .deploy-state
              rm -f .env.rollback docker-compose.yml.rollback
              ls -t ~/backups/staging/backup-*.dump 2>/dev/null | tail -n +4 | xargs -r rm -v
              echo "Staging deployment complete"
              exit 0
            fi

            # ── ROLLBACK ──
            echo "Deploy failed, initiating rollback..."
            docker compose stop server frontend 2>/dev/null || true

            echo "Restoring database from backup..."
            docker compose exec -T postgres psql -U postgres -d template1 -c "DROP DATABASE IF EXISTS postgres WITH (FORCE);" 2>/dev/null || true
            docker compose exec -T postgres psql -U postgres -d template1 -c "CREATE DATABASE postgres OWNER postgres;"
            docker compose exec -T postgres pg_restore -U postgres -d postgres --no-owner --no-acl "$BACKUP_FILE" || true

            # Verify DB is usable after restore (pg_restore returns non-zero on harmless warnings)
            if ! docker compose exec -T postgres psql -U postgres -d postgres -c "SELECT 1;" > /dev/null 2>&1; then
              echo "CRITICAL: Database restore verification failed — DB may be corrupt"
              exit 11
            fi

            cp .env.rollback .env 2>/dev/null || true
            cp docker-compose.yml.rollback docker-compose.yml 2>/dev/null || true

            if docker compose pull && docker compose up -d --wait; then
              echo "Rollback successful — restored previous version"
              exit 10
            else
              echo "CRITICAL: Rollback also failed!"
              exit 11
            fi
          DEPLOY_SCRIPT
          DEPLOY_EXIT=$?
          set -e

          echo "deploy_exit=$DEPLOY_EXIT" >> $GITHUB_OUTPUT

          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            exit 1
          fi

      - name: Cleanup secrets
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/staging.env

      - name: Send deploy failure notification
        if: always() && steps.deploy.outputs.deploy_exit != '' && steps.deploy.outputs.deploy_exit != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          DEPLOY_EXIT="${{ steps.deploy.outputs.deploy_exit }}"
          if [ "$DEPLOY_EXIT" = "11" ]; then
            SUBJECT="[CRITICAL] Staging deploy + rollback FAILED"
            BODY="Deployment to staging failed AND automatic rollback also failed.\nThe staging environment may be DOWN.\nImmediate manual intervention required.\n\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.actor }}\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            SUBJECT="[WARNING] Staging deploy failed — rolled back"
            BODY="Deployment to staging failed but was automatically rolled back to the previous version.\nStaging is operational.\n\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.actor }}\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Phoenix CI <ci@ci.moto-app.de>\",\"to\":[\"mail@yannickwenger.de\"],\"subject\":\"${SUBJECT}\",\"text\":\"${BODY}\"}"

  # Deploy to demo with automatic rollback on failure
  # Exit codes from SSH: 0=success, 10=deploy failed/rollback ok, 11=rollback also failed
  deploy-demo:
    needs: [check-environment, build-backend, build-frontend]
    if: needs.check-environment.outputs.should_deploy == 'true' && needs.check-environment.outputs.is_demo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Install SOPS
        run: |
          curl -LsS https://github.com/getsops/sops/releases/download/v3.12.1/sops-v3.12.1.linux.amd64 -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops

      - name: Decrypt demo environment
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops decrypt environments/demo.sops.env > /tmp/demo.env

      - name: Deploy to demo
        id: deploy
        env:
          SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEMO_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # SCP new files with .new suffix (preserves old files for rollback)
          scp -i ~/.ssh/deploy_key /tmp/demo.env root@$SSH_HOST:~/demo/.env.new
          scp -i ~/.ssh/deploy_key environments/demo.compose.yml root@$SSH_HOST:~/demo/docker-compose.yml.new

          set +e
          ssh -i ~/.ssh/deploy_key root@$SSH_HOST "DEPLOY_SHA=$SHORT_SHA bash -s" << 'DEPLOY_SCRIPT'
            cd ~/demo
            echo "Starting demo deployment..."

            # ── Save rollback copies of current config ──
            cp .env .env.rollback 2>/dev/null || true
            cp docker-compose.yml docker-compose.yml.rollback 2>/dev/null || true

            # ── Swap in new config ──
            mv .env.new .env
            mv docker-compose.yml.new docker-compose.yml

            # ── Pull new images ──
            if ! docker compose pull; then
              echo "Pull failed, restoring old config"
              cp .env.rollback .env 2>/dev/null || true
              cp docker-compose.yml.rollback docker-compose.yml 2>/dev/null || true
              docker compose up -d --wait 2>/dev/null || true
              exit 1
            fi

            # ── Stop app containers (postgres stays for backup) ──
            docker compose stop server frontend

            # ── Backup database (DB frozen — no app writing) ──
            mkdir -p ~/backups/demo
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_FILE=~/backups/demo/backup-${TIMESTAMP}.dump
            docker compose exec -T postgres pg_dump -U postgres -d postgres -Fc > "$BACKUP_FILE"
            if [ ! -s "$BACKUP_FILE" ]; then
              echo "Backup failed or empty, aborting deploy"
              rm -f "$BACKUP_FILE"
              cp .env.rollback .env 2>/dev/null || true
              cp docker-compose.yml.rollback docker-compose.yml 2>/dev/null || true
              docker compose pull 2>/dev/null || true
              docker compose up -d --wait 2>/dev/null || true
              exit 1
            fi
            echo "Backup: $(basename $BACKUP_FILE) ($(du -h $BACKUP_FILE | cut -f1))"

            # ── Read previous deploy state ──
            PREVIOUS_SHA=""
            if [ -f .deploy-state ]; then
              PREVIOUS_SHA=$(grep '^CURRENT_SHA=' .deploy-state | cut -d= -f2)
            fi

            # ── Run migration ──
            DEPLOY_FAILED=false
            if ! docker compose run --rm server ./main migrate; then
              echo "Migration FAILED"
              DEPLOY_FAILED=true
            fi

            # ── Start services (skip if migration failed) ──
            if [ "$DEPLOY_FAILED" = "false" ]; then
              if ! docker compose up -d --wait; then
                echo "Healthcheck FAILED"
                DEPLOY_FAILED=true
              fi
            fi

            # ── SUCCESS ──
            if [ "$DEPLOY_FAILED" = "false" ]; then
              echo "CURRENT_SHA=${DEPLOY_SHA}" > .deploy-state
              echo "PREVIOUS_SHA=${PREVIOUS_SHA}" >> .deploy-state
              echo "DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .deploy-state
              echo "BACKUP_FILE=${BACKUP_FILE}" >> .deploy-state
              rm -f .env.rollback docker-compose.yml.rollback
              ls -t ~/backups/demo/backup-*.dump 2>/dev/null | tail -n +4 | xargs -r rm -v
              echo "Demo deployment complete"
              exit 0
            fi

            # ── ROLLBACK ──
            echo "Deploy failed, initiating rollback..."
            docker compose stop server frontend 2>/dev/null || true

            echo "Restoring database from backup..."
            docker compose exec -T postgres psql -U postgres -d template1 -c "DROP DATABASE IF EXISTS postgres WITH (FORCE);" 2>/dev/null || true
            docker compose exec -T postgres psql -U postgres -d template1 -c "CREATE DATABASE postgres OWNER postgres;"
            docker compose exec -T postgres pg_restore -U postgres -d postgres --no-owner --no-acl "$BACKUP_FILE" || true

            # Verify DB is usable after restore (pg_restore returns non-zero on harmless warnings)
            if ! docker compose exec -T postgres psql -U postgres -d postgres -c "SELECT 1;" > /dev/null 2>&1; then
              echo "CRITICAL: Database restore verification failed — DB may be corrupt"
              exit 11
            fi

            cp .env.rollback .env 2>/dev/null || true
            cp docker-compose.yml.rollback docker-compose.yml 2>/dev/null || true

            if docker compose pull && docker compose up -d --wait; then
              echo "Rollback successful — restored previous version"
              exit 10
            else
              echo "CRITICAL: Rollback also failed!"
              exit 11
            fi
          DEPLOY_SCRIPT
          DEPLOY_EXIT=$?
          set -e

          echo "deploy_exit=$DEPLOY_EXIT" >> $GITHUB_OUTPUT

          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            exit 1
          fi

      - name: Cleanup secrets
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/demo.env

      - name: Send deploy failure notification
        if: always() && steps.deploy.outputs.deploy_exit != '' && steps.deploy.outputs.deploy_exit != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          DEPLOY_EXIT="${{ steps.deploy.outputs.deploy_exit }}"
          if [ "$DEPLOY_EXIT" = "11" ]; then
            SUBJECT="[CRITICAL] Demo deploy + rollback FAILED"
            BODY="Deployment to demo failed AND automatic rollback also failed.\nThe demo environment may be DOWN.\nImmediate manual intervention required.\n\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.actor }}\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            SUBJECT="[WARNING] Demo deploy failed — rolled back"
            BODY="Deployment to demo failed but was automatically rolled back to the previous version.\nDemo is operational.\n\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.actor }}\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Phoenix CI <ci@ci.moto-app.de>\",\"to\":[\"mail@yannickwenger.de\"],\"subject\":\"${SUBJECT}\",\"text\":\"${BODY}\"}"

  # Deploy to production with automatic rollback on failure
  # Exit codes from SSH: 0=success, 10=deploy failed/rollback ok, 11=rollback also failed
  deploy-production:
    needs: [check-environment, build-backend, build-frontend]
    if: needs.check-environment.outputs.should_deploy == 'true' && needs.check-environment.outputs.is_staging == 'false' && needs.check-environment.outputs.is_demo == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Install SOPS
        run: |
          curl -LsS https://github.com/getsops/sops/releases/download/v3.12.1/sops-v3.12.1.linux.amd64 -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops

      - name: Decrypt production environment
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops decrypt environments/production.sops.env > /tmp/production.env

      - name: Deploy to production
        id: deploy
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # SCP new files with .new suffix (preserves old files for rollback)
          scp -i ~/.ssh/deploy_key /tmp/production.env root@$SSH_HOST:~/production/.env.new
          scp -i ~/.ssh/deploy_key environments/production.compose.yml root@$SSH_HOST:~/production/docker-compose.yml.new

          set +e
          ssh -i ~/.ssh/deploy_key root@$SSH_HOST "DEPLOY_SHA=$SHORT_SHA bash -s" << 'DEPLOY_SCRIPT'
            cd ~/production
            echo "Starting production deployment..."

            # ── Save rollback copies of current config ──
            cp .env .env.rollback 2>/dev/null || true
            cp docker-compose.yml docker-compose.yml.rollback 2>/dev/null || true

            # ── Swap in new config ──
            mv .env.new .env
            mv docker-compose.yml.new docker-compose.yml

            # ── Pull new images ──
            if ! docker compose pull; then
              echo "Pull failed, restoring old config"
              cp .env.rollback .env 2>/dev/null || true
              cp docker-compose.yml.rollback docker-compose.yml 2>/dev/null || true
              docker compose up -d --wait 2>/dev/null || true
              exit 1
            fi

            # ── Stop app containers (postgres stays for backup) ──
            docker compose stop server frontend

            # ── Backup database (DB frozen — no app writing) ──
            mkdir -p ~/backups/production
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_FILE=~/backups/production/backup-${TIMESTAMP}.dump
            docker compose exec -T postgres pg_dump -U postgres -d postgres -Fc > "$BACKUP_FILE"
            if [ ! -s "$BACKUP_FILE" ]; then
              echo "Backup failed or empty, aborting deploy"
              rm -f "$BACKUP_FILE"
              cp .env.rollback .env 2>/dev/null || true
              cp docker-compose.yml.rollback docker-compose.yml 2>/dev/null || true
              docker compose pull 2>/dev/null || true
              docker compose up -d --wait 2>/dev/null || true
              exit 1
            fi
            echo "Backup: $(basename $BACKUP_FILE) ($(du -h $BACKUP_FILE | cut -f1))"

            # ── Read previous deploy state ──
            PREVIOUS_SHA=""
            if [ -f .deploy-state ]; then
              PREVIOUS_SHA=$(grep '^CURRENT_SHA=' .deploy-state | cut -d= -f2)
            fi

            # ── Run migration ──
            DEPLOY_FAILED=false
            if ! docker compose run --rm server ./main migrate; then
              echo "Migration FAILED"
              DEPLOY_FAILED=true
            fi

            # ── Start services (skip if migration failed) ──
            if [ "$DEPLOY_FAILED" = "false" ]; then
              if ! docker compose up -d --wait; then
                echo "Healthcheck FAILED"
                DEPLOY_FAILED=true
              fi
            fi

            # ── SUCCESS ──
            if [ "$DEPLOY_FAILED" = "false" ]; then
              echo "CURRENT_SHA=${DEPLOY_SHA}" > .deploy-state
              echo "PREVIOUS_SHA=${PREVIOUS_SHA}" >> .deploy-state
              echo "DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .deploy-state
              echo "BACKUP_FILE=${BACKUP_FILE}" >> .deploy-state
              rm -f .env.rollback docker-compose.yml.rollback
              ls -t ~/backups/production/backup-*.dump 2>/dev/null | tail -n +8 | xargs -r rm -v
              echo "Production deployment complete"
              exit 0
            fi

            # ── ROLLBACK ──
            echo "Deploy failed, initiating rollback..."
            docker compose stop server frontend 2>/dev/null || true

            echo "Restoring database from backup..."
            docker compose exec -T postgres psql -U postgres -d template1 -c "DROP DATABASE IF EXISTS postgres WITH (FORCE);" 2>/dev/null || true
            docker compose exec -T postgres psql -U postgres -d template1 -c "CREATE DATABASE postgres OWNER postgres;"
            docker compose exec -T postgres pg_restore -U postgres -d postgres --no-owner --no-acl "$BACKUP_FILE" || true

            # Verify DB is usable after restore (pg_restore returns non-zero on harmless warnings)
            if ! docker compose exec -T postgres psql -U postgres -d postgres -c "SELECT 1;" > /dev/null 2>&1; then
              echo "CRITICAL: Database restore verification failed — DB may be corrupt"
              exit 11
            fi

            cp .env.rollback .env 2>/dev/null || true
            cp docker-compose.yml.rollback docker-compose.yml 2>/dev/null || true

            if docker compose pull && docker compose up -d --wait; then
              echo "Rollback successful — restored previous version"
              exit 10
            else
              echo "CRITICAL: Rollback also failed!"
              exit 11
            fi
          DEPLOY_SCRIPT
          DEPLOY_EXIT=$?
          set -e

          echo "deploy_exit=$DEPLOY_EXIT" >> $GITHUB_OUTPUT

          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            exit 1
          fi

      - name: Cleanup secrets
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/production.env

      - name: Send deploy failure notification
        if: always() && steps.deploy.outputs.deploy_exit != '' && steps.deploy.outputs.deploy_exit != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          DEPLOY_EXIT="${{ steps.deploy.outputs.deploy_exit }}"
          if [ "$DEPLOY_EXIT" = "11" ]; then
            SUBJECT="[CRITICAL] Production deploy + rollback FAILED"
            BODY="Deployment to PRODUCTION failed AND automatic rollback also failed.\nThe production environment may be DOWN.\nImmediate manual intervention required.\n\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.actor }}\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            SUBJECT="[WARNING] Production deploy failed — rolled back"
            BODY="Deployment to PRODUCTION failed but was automatically rolled back to the previous version.\nProduction is operational.\n\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.actor }}\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Phoenix CI <ci@ci.moto-app.de>\",\"to\":[\"mail@yannickwenger.de\"],\"subject\":\"${SUBJECT}\",\"text\":\"${BODY}\"}"

  # Summary job for branch protection
  build-status:
    runs-on: ubuntu-latest
    needs: [check-environment, build-backend, build-frontend]
    if: always() && needs.check-environment.outputs.should_deploy == 'true'
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.build-backend.result }}" == "success" && "${{ needs.build-frontend.result }}" == "success" ]]; then
            echo "✅ All images built and pushed successfully"
            echo "Backend: ${{ env.BACKEND_IMAGE }}"
            echo "Frontend: ${{ env.FRONTEND_IMAGE }}"
          else
            echo "❌ Build failed"
            echo "Backend: ${{ needs.build-backend.result }}"
            echo "Frontend: ${{ needs.build-frontend.result }}"
            exit 1
          fi
