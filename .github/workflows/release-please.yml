name: Release

# Releases kommen aus release-please (ADR 0042). Jeder Push auf main pflegt
# einen Release-PR mit der nächsten semantischen Version und dem Changelog aus
# den Conventional Commits; sein Merge erzeugt den Tag vX.Y.Z und das
# GitHub-Release. Deploys hängen nicht daran (build.yml läuft auf jedem Push
# auf main; der Release-PR ändert nur CHANGELOG.md, version.txt und das
# Manifest, die build.yml nicht auslösen).
#
# Konfiguration: release-please-config.json und .release-please-manifest.json.
#
# Ein Release, das dieser Workflow mit GITHUB_TOKEN anlegt, löst keine anderen
# Workflows aus (GitHub verhindert so Endlosschleifen). Deshalb ruft der Job
# product-screenshots die Produkt-Screenshot-Pipeline direkt auf, statt auf
# das release-Event zu warten. Aus demselben Grund laufen auf dem Release-PR
# keine PR-Checks; main verlangt keine.

on:
  push:
    branches:
      - main

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release-PR und Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  product-screenshots:
    name: Produkt-Screenshots
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/product-screenshots.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
