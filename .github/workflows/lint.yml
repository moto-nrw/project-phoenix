name: Lint

on:
  workflow_call:
    inputs:
      run-backend:
        type: boolean
        default: true
      run-frontend:
        type: boolean
        default: true

defaults:
  run:
    shell: bash

jobs:
  backend-format:
    if: ${{ inputs.run-backend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Go with cache
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Check Go formatting
        working-directory: backend
        run: |
          UNFORMATTED=$(gofmt -l . 2>&1 || true)
          if [[ -n "$UNFORMATTED" ]]; then
            echo "❌ The following files are not formatted with gofmt:"
            echo ""
            echo "$UNFORMATTED" | while IFS= read -r file; do
              echo "  $file"
            done
            echo ""
            echo "Run 'gofmt -w .' or 'go fmt ./...' to fix."
            exit 1
          else
            echo "All Go files are properly formatted"
          fi

  backend-deadcode:
    if: ${{ inputs.run-backend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Go with cache
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@latest
      - name: Run dead code detection
        working-directory: backend
        run: |
          echo "🔍 Running dead code detection..."

          # Run deadcode and capture output
          DEADCODE_OUTPUT=$(deadcode -test ./... 2>&1 || true)

          # Define exclusion patterns (false positives or planned-but-unwired code)
          # cmd/root.go:Execute is the Cobra CLI entry point called by main()
          # Multi-tenancy Phase 1 foundation primitives — wired in Phases 2-3
          EXCLUSIONS=(
            "cmd/root.go:.*Execute"
            "tenant/context.go:.*IsOrgScope"
            "tenant/context.go:.*NewContext"
            "tenant/tx.go:.*WithAdminTx"
            "database/repositories/base/helpers.go:.*AssertRowsAffected"
            "database/repositories/base/tenant_db.go:.*GetDB"
            "models/base/tenant.go:.*TenantModel"
            "models/platform/organization.go:.*Organization"
            "models/platform/school.go:.*School"
            "models/auth/account_tenant.go:.*AccountTenant"
            "test/fixtures.go:.*CreateTestOrganization"
            "test/fixtures.go:.*CreateTestSchool"
            "test/fixtures.go:.*CreateTestSchoolForOrg"
            "test/fixtures.go:.*CreateTestAccountTenant"
            "test/fixtures.go:.*CleanupTenantFixtures"
          )

          # Build grep exclusion pattern
          EXCLUDE_PATTERN=""
          for pattern in "${EXCLUSIONS[@]}"; do
            if [[ -n "$EXCLUDE_PATTERN" ]]; then
              EXCLUDE_PATTERN="$EXCLUDE_PATTERN|$pattern"
            else
              EXCLUDE_PATTERN="$pattern"
            fi
          done

          # Filter out exclusions
          if [[ -n "$EXCLUDE_PATTERN" ]]; then
            FILTERED_OUTPUT=$(echo "$DEADCODE_OUTPUT" | grep -vE "$EXCLUDE_PATTERN" || true)
          else
            FILTERED_OUTPUT="$DEADCODE_OUTPUT"
          fi

          # Check if any dead code remains
          if [[ -n "$FILTERED_OUTPUT" ]]; then
            echo ""
            echo "❌ Dead code detected:"
            echo ""
            echo "$FILTERED_OUTPUT" | while IFS= read -r line; do
              if [[ -n "$line" ]]; then
                echo "  $line"
              fi
            done
            echo ""
            echo "Please remove dead code or document why it should be kept."
            echo "To add an exclusion, edit .github/workflows/lint.yml"
            exit 1
          else
            echo "No dead code detected"
          fi

  backend-lint:
    if: ${{ inputs.run-backend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Go with cache
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: golang ci lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v6
        with:
          version: latest
          args: --timeout 10m
          working-directory: backend

  backend-migration-validate:
    if: ${{ inputs.run-backend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Go with cache
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Validate migration dependencies
        working-directory: backend
        run: go run main.go migrate validate

  backend-licenses:
    if: ${{ inputs.run-backend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Go with cache
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: Check Go dependency licenses
        working-directory: backend
        run: |
          echo "🔍 Checking Go dependency licenses..."

          # Disallowed licenses for a source-available project (copyleft / network-copyleft)
          DISALLOWED="AGPL-3.0,GPL-3.0,LGPL-3.0,SSPL-1.0,EUPL-1.2"

          # go-licenses check exits non-zero if disallowed licenses are found
          go-licenses check ./... --disallowed_types=restricted,reciprocal 2>&1 || {
            echo ""
            echo "❌ Disallowed licenses found in Go dependencies."
            echo "Source-available project cannot use restricted or reciprocal licenses."
            echo "Review the output above and replace the offending dependency."
            exit 1
          }

          echo "All Go dependency licenses are compatible"

  frontend-licenses:
    if: ${{ inputs.run-frontend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check npm dependency licenses
        working-directory: frontend
        run: |
          echo "🔍 Checking npm dependency licenses..."

          npx license-checker --production --failOn \
            "AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;LGPL-2.0-only;LGPL-2.0-or-later;LGPL-2.1-only;LGPL-2.1-or-later;LGPL-3.0-only;LGPL-3.0-or-later;SSPL-1.0;EUPL-1.2" \
            --summary || {
            echo ""
            echo "❌ Disallowed licenses found in npm dependencies."
            echo "Source-available project cannot use restricted or reciprocal licenses."
            echo "Review the output above and replace the offending dependency."
            exit 1
          }

          echo "All npm dependency licenses are compatible"

  frontend-lint:
    if: ${{ inputs.run-frontend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8080" # Default API URL for linting
      SKIP_ENV_VALIDATION: "true" # Skip validation during linting
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: frontend
        run: pnpm run lint --max-warnings 0

  frontend-typecheck:
    if: ${{ inputs.run-frontend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8080" # Default API URL for linting
      SKIP_ENV_VALIDATION: "true" # Skip validation during linting
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        working-directory: frontend
        run: pnpm run typecheck

  frontend-knip:
    if: ${{ inputs.run-frontend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8080" # Default API URL for linting
      SKIP_ENV_VALIDATION: "true" # Skip validation during linting
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check for unused code
        working-directory: frontend
        run: pnpm knip

  frontend-build:
    if: ${{ inputs.run-frontend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

