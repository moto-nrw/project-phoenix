name: Lint

on:
  workflow_call:
    inputs:
      run-backend:
        type: boolean
        default: true
      full-backend:
        type: boolean
        default: true
      run-frontend:
        type: boolean
        default: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local

jobs:
  error-code-registry:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - name: Check error code registry and generated files
        run: |
          node --test scripts/generate-error-codes.test.mjs
          node scripts/generate-error-codes.mjs
          git diff --exit-code -- backend/api/common/error_codes.generated.go frontend/src/lib/error-codes.generated.ts

  backend-quality:
    if: ${{ inputs.run-backend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go with cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum

      - name: Backend quality (shared with pre-push)
        run: bash scripts/check-quality.sh backend

  backend-lint:
    if: ${{ inputs.run-backend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go with cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Select backend packages
        id: packages
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_BACKEND: ${{ inputs.full-backend }}
        run: |
          packages_output=$(scripts/backend-lint-packages.sh)
          mapfile -t packages <<< "$packages_output"
          echo "Linting ${#packages[@]} backend package target(s): ${packages[*]}"
          printf 'args=%s\n' "${packages[*]}" >> "$GITHUB_OUTPUT"
      - name: golang ci lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v6
        with:
          version: v2.13.1
          args: --timeout 10m ${{ steps.packages.outputs.args }}
          working-directory: backend

  frontend-quality:
    if: ${{ inputs.run-frontend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend quality (shared with pre-push)
        run: bash scripts/check-quality.sh frontend

  frontend-react-doctor:
    # Changed-scope only: the existing codebase has ~1000 findings, so a full
    # scan would always fail. This gates only issues introduced by the PR
    # (fails on error severity, warnings are advisory). Push builds skip it —
    # there is no PR base to diff against.
    if: ${{ inputs.run-frontend && github.event_name == 'pull_request' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: React Doctor (new issues vs base)
        working-directory: frontend
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash ../scripts/check-quality.sh react-doctor "origin/$BASE_REF"


  frontend-build:
    if: ${{ inputs.run-frontend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      SKIP_ENV_VALIDATION: "true"
      API_URL: "http://localhost:8080"
      NEXT_PUBLIC_OPERATOR_HOSTNAME: "operator.localhost:3000"
      NEXT_PUBLIC_PARENTS_HOSTNAME: "parents.localhost:3000"
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_SCHOOL_HOSTNAME: "schule.localhost:3000"
      TENANT_DOMAIN: "localhost"
      NEXT_PUBLIC_TENANT_DOMAIN: "localhost"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-bundle-ratchet-throwaway-secret"
      AUTH_JWT_EXPIRY: "15m"
      AUTH_JWT_REFRESH_EXPIRY: "168h"
      METRICS_BEARER_TOKEN: "ci-bundle-ratchet-token"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      # Bundle-Size-Ratchet (#2939): `next experimental-analyze` kompiliert
      # kalt (Chunk-Aufteilung hängt sonst vom Cache-Zustand ab) und vergleicht
      # Client-JS je Route mit scripts/perf/bundle-baseline.json. Die Baseline
      # sind Runner-Zahlen: zum Nachziehen das Artefakt `bundle-measured`
      # laden und als bundle-baseline.json einchecken.
      - name: Bundle size ratchet
        working-directory: frontend
        run: pnpm run perf:bundle-ratchet

      - name: Upload measured bundle sizes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-measured
          path: frontend/perf-results/bundle-measured.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Build Storybook
        working-directory: frontend
        run: pnpm run build-storybook
