name: Lint

on:
  workflow_call:
    inputs:
      run-backend:
        type: boolean
        default: true
      full-backend:
        type: boolean
        default: true
      run-frontend:
        type: boolean
        default: true
      run-error-codes:
        type: boolean
        default: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local

# Runners: standard GitHub runners are free for this public repository and run
# every job here except frontend-build and backend-lint. Blacksmith bills per
# vCPU-minute, rounded up to whole minutes per job, so a larger runner pays off
# only on the job that sets the pull request's wall-clock time, or where it cuts
# the job's time in half or more. frontend-build sets it for frontend pull
# requests: eight vCPUs took 142 s instead of 185 s (10/2026), but bill three
# minutes at twice the rate where four vCPUs bill four; four vCPUs cost a third
# less per run. Its two cold bundle builds keep four cores busy: started side
# by side they took 207 s against 210 s one after the other (11/2026).
# backend-lint took 6-8 minutes on a hosted runner; a cold
# full lint took 195 s on four vCPUs and 101 s on eight, at the same cost.
# nightly.yml runs this workflow on development to keep the caches warm.

jobs:
  error-code-registry:
    name: Error code registry
    if: ${{ inputs.run-error-codes }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Check error code registry and generated files
        run: |
          node --test scripts/generate-error-codes.test.mjs
          node scripts/generate-error-codes.mjs --check

  backend-quality:
    name: Backend quality
    if: ${{ inputs.run-backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      # This job already runs for every migration change. Fail before Go setup.
      # development -> main promotes migrations already checked on development;
      # it is a release, not a stack with additions of its own.
      - name: Check new migration names and function redefinitions against current base tips
        if: github.event_name == 'pull_request' && !(github.base_ref == 'main' && github.head_ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The default checkout is shallow and may be a synthetic merge.
          git fetch --no-tags --filter=blob:none --unshallow origin "$HEAD_SHA"
          node scripts/check-migration-versions.mjs "origin/$BASE_REF" "$HEAD_SHA"

      - name: Setup Go with cache
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum

      # setup-go's go.sum-only key is immutable, so the production build and
      # deadcode started from an old build cache. Keep a source-keyed layer
      # with the last source build as a warm fallback, as test.yml does.
      # Only nightly.yml saves it, on development: a ~290 MB save per pull
      # request push evicted that entry from the 10 GB repository cache.
      - name: Compute backend quality build cache key
        id: build-cache-key
        env:
          QUALITY_CACHE_PREFIX: backend-quality-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('backend/go.sum', 'backend/tools/go.sum') }}-
          QUALITY_SOURCE_HASH: ${{ hashFiles('backend/**/*.go') }}
        run: |
          echo "prefix=$QUALITY_CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "key=$QUALITY_CACHE_PREFIX$QUALITY_SOURCE_HASH" >> "$GITHUB_OUTPUT"
      - name: Restore backend quality build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-cache-key.outputs.key }}
          restore-keys: ${{ steps.build-cache-key.outputs.prefix }}

      - name: Backend quality (shared with pre-push)
        # Source ratchets run once per PR: test.yml selects ./test for every
        # backend test change, and ci-scripts covers toolchain-filter changes.
        # Lint-only inputs (quality scripts, .golangci.yml) feed no ratchet.
        env:
          SKIP_SOURCE_RATCHETS: 'true'
        run: bash scripts/check-quality.sh backend

      - name: Save backend quality build cache
        if: ${{ github.event_name != 'pull_request' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-cache-key.outputs.key }}

  backend-lint:
    name: Backend lint
    if: ${{ inputs.run-backend }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOLANGCI_LINT_CACHE: /home/runner/.cache/golangci-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Package selection reads file names only; no file contents needed.
          filter: blob:none
      - name: Setup Go with cache
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      # golangci-lint type-checks from Go build cache export data; its own
      # cache is only ~2 MB. setup-go's go.sum-only key is immutable and holds
      # build.yml's binary build, so lint started cold. Keep a source-keyed
      # layer with the last source build as a warm fallback, as test.yml does.
      # The golangci-lint action's own cache key is also immutable per week.
      # Pull requests only restore. Each pull request run saved about 240 MB
      # that only its own later runs could read, and those saves pushed
      # development's entry out of the cache within hours: after the nightly
      # save at 02:13 every first run of a pull request from 06:49 on linted
      # cold, 200-310 s against 35 s (#6784, 12.11.2026).
      # backend-build-cache.yml saves the entry pull requests restore, on each
      # push to development; its key must stay identical to this one.
      - name: Compute backend lint cache key
        id: lint-cache-key
        env:
          # lint.yml pins the golangci-lint version, so a bump starts a new cache.
          LINT_CACHE_PREFIX: backend-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('backend/go.sum', '.github/workflows/lint.yml') }}-
          LINT_SOURCE_HASH: ${{ hashFiles('backend/**/*.go', 'backend/.golangci.yml') }}
        run: |
          echo "prefix=$LINT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "key=$LINT_CACHE_PREFIX$LINT_SOURCE_HASH" >> "$GITHUB_OUTPUT"
      - name: Restore backend lint cache
        id: lint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.lint-cache-key.outputs.key }}
          restore-keys: ${{ steps.lint-cache-key.outputs.prefix }}
      - name: Select backend packages
        id: packages
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_BACKEND: ${{ inputs.full-backend }}
        run: |
          packages_output=$(scripts/backend-lint-packages.sh)
          mapfile -t packages <<< "$packages_output"
          echo "Linting ${#packages[@]} backend package target(s): ${packages[*]}"
          printf 'args=%s\n' "${packages[*]}" >> "$GITHUB_OUTPUT"
      - name: golang ci lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout 10m ${{ steps.packages.outputs.args }}
          working-directory: backend
          # The step above owns the lint cache.
          skip-cache: true
      - name: Save backend lint cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.lint-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.lint-cache-key.outputs.key }}

  frontend-quality:
    name: Frontend quality
    if: ${{ inputs.run-frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend quality (shared with pre-push)
        run: bash scripts/check-quality.sh frontend

      # Storybook supplies its own mock environment and needs no Next build.
      # Keep it off the serial Next.js/bundle-ratchet critical path.
      - name: Build Storybook
        working-directory: frontend
        run: pnpm run build-storybook

  # The regular build of the tested tree: on pull requests GitHub's synthetic
  # merge, which this job checks out by default. It ran in "Frontend build"
  # before the two cold bundle builds and took 76-138 s there, on the job that
  # set the wall-clock time of frontend pull requests (306-458 s, 13.11.2026).
  # The bundle comparison reads nothing from it. Inside "Frontend quality" it
  # took 154 s and brought that job to 273-294 s, so it has its own hosted
  # runner, which is free for this repository. Without a Next.js cache: a
  # hosted runner would save it into the repository's 10 GB GitHub cache on
  # every push.
  frontend-merge-build:
    name: Frontend merge build
    if: ${{ inputs.run-frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend merge integration
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8080"
          SKIP_ENV_VALIDATION: "true"
          API_URL: "http://localhost:8080"
          NEXT_PUBLIC_OPERATOR_HOSTNAME: "operator.localhost:3000"
          NEXT_PUBLIC_PARENTS_HOSTNAME: "parents.localhost:3000"
          NEXT_PUBLIC_APP_ENV: test
          NEXT_PUBLIC_SCHOOL_HOSTNAME: "schule.localhost:3000"
          NEXT_PUBLIC_CATERER_HOSTNAME: "caterer.localhost:3000"
          NEXT_PUBLIC_TRAEGER_HOSTNAME: "traeger.localhost:3000"
          TENANT_DOMAIN: "localhost"
          NEXT_PUBLIC_TENANT_DOMAIN: "localhost"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXTAUTH_SECRET: "ci-bundle-ratchet-throwaway-secret"
          AUTH_JWT_EXPIRY: "15m"
          AUTH_JWT_REFRESH_EXPIRY: "168h"
          METRICS_BEARER_TOKEN: "ci-bundle-ratchet-token"
        run: pnpm run build

  frontend-react-doctor:
    name: Frontend React Doctor
    # Changed-scope only: the existing codebase has ~1000 findings, so a full
    # scan would always fail. This gates only issues introduced by the PR
    # (fails on error severity, warnings are advisory). Push builds skip it —
    # there is no PR base to diff against.
    if: ${{ inputs.run-frontend && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: React Doctor (new issues vs base)
        working-directory: frontend
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash ../scripts/check-quality.sh react-doctor "origin/$BASE_REF"


  frontend-build:
    name: Frontend build
    if: ${{ inputs.run-frontend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      # Only for the approval label step below.
      pull-requests: read
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      SKIP_ENV_VALIDATION: "true"
      API_URL: "http://localhost:8080"
      NEXT_PUBLIC_OPERATOR_HOSTNAME: "operator.localhost:3000"
      NEXT_PUBLIC_PARENTS_HOSTNAME: "parents.localhost:3000"
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_SCHOOL_HOSTNAME: "schule.localhost:3000"
      NEXT_PUBLIC_CATERER_HOSTNAME: "caterer.localhost:3000"
      NEXT_PUBLIC_TRAEGER_HOSTNAME: "traeger.localhost:3000"
      TENANT_DOMAIN: "localhost"
      NEXT_PUBLIC_TENANT_DOMAIN: "localhost"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-bundle-ratchet-throwaway-secret"
      AUTH_JWT_EXPIRY: "15m"
      AUTH_JWT_REFRESH_EXPIRY: "168h"
      METRICS_BEARER_TOKEN: "ci-bundle-ratchet-token"
    steps:
      # Runs first, before any PR code, and is the only step with a token. The
      # API, not the event payload, so "Re-run failed jobs" sees a label set
      # after the first run.
      - name: Read bundle growth approval label
        id: bundle-approval
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh api "repos/$REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -qx 'bundle-growth-approved'; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Feature bundle measurements switch to the PR head below; release
          # pull requests and pushes measure the checked-out tree.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify bundle budget and observation contracts
        working-directory: frontend
        run: node --test scripts/bundle-workflow-permissions.node-test.mjs scripts/perf/bundle-policy.node-test.mjs scripts/perf/bundle-measurement.node-test.mjs scripts/perf/bundle-base.node-test.mjs

      - name: Select feature PR head for bundle delta measurements
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        working-directory: frontend
        env:
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --detach "$HEAD_REVISION"
          pnpm install --frozen-lockfile

      - name: Identify bundle observation source and configuration
        id: bundle-key
        working-directory: frontend
        env:
          BASE_REVISION: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.base.sha || '' }}
        run: |
          if [[ -n "$BASE_REVISION" && ! "$BASE_REVISION" =~ ^0+$ ]]; then
            merge_base=$(git merge-base HEAD "$BASE_REVISION")
            node scripts/perf/bundle-measurement.mjs --prepare-ci "$merge_base"
          else
            node scripts/perf/bundle-measurement.mjs --prepare-ci
          fi

      # The merge-base rarely changes between the pushes of one pull request,
      # and two cold builds of one tree are byte-identical, so its measurement
      # is kept under its source tree and build configuration. The cold build
      # took 87-166 s of this job on every run (13.11.2026). The script reuses
      # a restored file only if it is a valid measurement of exactly that
      # identity and builds cold otherwise. A cache saved by a pull request is
      # visible to that pull request alone; frontend-bundle-base.yml measures
      # every development commit with this job's env and commands, so a pull
      # request based on one finds it ("base measurement: cache hit|measured"
      # in the log and the job summary).
      - name: Restore merge-base bundle measurement
        id: bundle-base-cache
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/perf-results/bundle-base.json
          key: ${{ steps.bundle-key.outputs.base-measurement-key }}

      - name: Measure exact merge-base, cold unless already measured
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        working-directory: frontend
        run: node scripts/perf/bundle-measurement.mjs --build-base

      - name: Save merge-base bundle measurement
        if: github.event_name == 'pull_request' && github.base_ref != 'main' && steps.bundle-base-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/perf-results/bundle-base.json
          key: ${{ steps.bundle-key.outputs.base-measurement-key }}

      # Feature PRs enforce their own delta against the cold merge-base build;
      # the approval label turns it into a warning. Release PRs into main and
      # nightly enforce only the few absolute ceilings: release-cycle growth is
      # not a feature PR regression. The regular build in "Frontend merge
      # build" still catches semantic integration failures before merging.
      # Keep that build: experimental-analyze's cold compilation is not assumed
      # to cover every Next.js build/type/route-validation contract.
      - name: Bundle size ratchet
        working-directory: frontend
        env:
          BUNDLE_GROWTH_APPROVED: ${{ steps.bundle-approval.outputs.approved == 'true' }}
        run: pnpm run perf:bundle-ratchet

      - name: Upload measured bundle sizes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-measured-${{ steps.bundle-key.outputs.measurement-key }}
          overwrite: true
          path: |
            frontend/perf-results/bundle-measured.json
            frontend/perf-results/bundle-base.json
            frontend/perf-results/bundle-base-identity.json
          retention-days: 14
          if-no-files-found: ignore
