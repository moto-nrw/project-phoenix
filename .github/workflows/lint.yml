name: Lint

on:
  workflow_call:
    inputs:
      run-backend:
        type: boolean
        default: true
      full-backend:
        type: boolean
        default: true
      run-frontend:
        type: boolean
        default: true
      run-error-codes:
        type: boolean
        default: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local

# Runners: standard GitHub runners are free for this public repository and run
# every job here except frontend-build and backend-lint. backend-lint sets the
# pull request's wall-clock time: affected-package lint of ~220 packages took
# 6-8 minutes on a hosted runner, full lint 2-3 minutes on Blacksmith.
# frontend-build stays on Blacksmith: on a frontend-only pull request it runs
# about as long as test-frontend, and its per-commit Next.js cache would churn
# the 10 GB GitHub cache.
# nightly.yml runs this workflow on development to keep the caches warm.

jobs:
  error-code-registry:
    if: ${{ inputs.run-error-codes }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - name: Check error code registry and generated files
        run: |
          node --test scripts/generate-error-codes.test.mjs
          node scripts/generate-error-codes.mjs --check

  backend-quality:
    if: ${{ inputs.run-backend }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go with cache
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum

      # setup-go's go.sum-only key is immutable, so the production build and
      # deadcode started from an old build cache. Keep a source-keyed layer
      # with the last source build as a warm fallback, as test.yml does.
      - name: Compute backend quality build cache key
        id: build-cache-key
        env:
          QUALITY_CACHE_PREFIX: backend-quality-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('backend/go.sum', 'backend/tools/go.sum') }}-
          QUALITY_SOURCE_HASH: ${{ hashFiles('backend/**/*.go') }}
        run: |
          echo "prefix=$QUALITY_CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "key=$QUALITY_CACHE_PREFIX$QUALITY_SOURCE_HASH" >> "$GITHUB_OUTPUT"
      - name: Restore backend quality build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-cache-key.outputs.key }}
          restore-keys: ${{ steps.build-cache-key.outputs.prefix }}

      - name: Backend quality (shared with pre-push)
        # Source ratchets run once per PR: test.yml selects ./test for every
        # backend test change, and ci-scripts covers toolchain-filter changes.
        # Lint-only inputs (quality scripts, .golangci.yml) feed no ratchet.
        env:
          SKIP_SOURCE_RATCHETS: 'true'
        run: bash scripts/check-quality.sh backend

  backend-lint:
    if: ${{ inputs.run-backend }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      GOLANGCI_LINT_CACHE: /home/runner/.cache/golangci-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Package selection reads file names only; no file contents needed.
          filter: blob:none
      - name: Setup Go with cache
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      # golangci-lint type-checks from Go build cache export data; its own
      # cache is only ~2 MB. setup-go's go.sum-only key is immutable and holds
      # build.yml's binary build, so lint started cold. Keep a source-keyed
      # layer with the last source build as a warm fallback, as test.yml does.
      # The golangci-lint action's own cache key is also immutable per week.
      - name: Compute backend lint cache key
        id: lint-cache-key
        env:
          # lint.yml pins the golangci-lint version, so a bump starts a new cache.
          LINT_CACHE_PREFIX: backend-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('backend/go.sum', '.github/workflows/lint.yml') }}-
          LINT_SOURCE_HASH: ${{ hashFiles('backend/**/*.go', 'backend/.golangci.yml') }}
        run: |
          echo "prefix=$LINT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "key=$LINT_CACHE_PREFIX$LINT_SOURCE_HASH" >> "$GITHUB_OUTPUT"
      - name: Restore backend lint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.lint-cache-key.outputs.key }}
          restore-keys: ${{ steps.lint-cache-key.outputs.prefix }}
      - name: Select backend packages
        id: packages
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_BACKEND: ${{ inputs.full-backend }}
        run: |
          packages_output=$(scripts/backend-lint-packages.sh)
          mapfile -t packages <<< "$packages_output"
          echo "Linting ${#packages[@]} backend package target(s): ${packages[*]}"
          printf 'args=%s\n' "${packages[*]}" >> "$GITHUB_OUTPUT"
      - name: golang ci lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v6
        with:
          version: v2.14.0
          args: --timeout 10m ${{ steps.packages.outputs.args }}
          working-directory: backend
          # The step above owns the lint cache.
          skip-cache: true

  frontend-quality:
    if: ${{ inputs.run-frontend }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend quality (shared with pre-push)
        run: bash scripts/check-quality.sh frontend

      # Storybook supplies its own mock environment and needs no Next build.
      # Keep it off the serial Next.js/bundle-ratchet critical path.
      - name: Build Storybook
        working-directory: frontend
        run: pnpm run build-storybook

  frontend-react-doctor:
    # Changed-scope only: the existing codebase has ~1000 findings, so a full
    # scan would always fail. This gates only issues introduced by the PR
    # (fails on error severity, warnings are advisory). Push builds skip it —
    # there is no PR base to diff against.
    if: ${{ inputs.run-frontend && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"

      - name: React Doctor (new issues vs base)
        working-directory: frontend
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash ../scripts/check-quality.sh react-doctor "origin/$BASE_REF"


  frontend-build:
    if: ${{ inputs.run-frontend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      SKIP_ENV_VALIDATION: "true"
      API_URL: "http://localhost:8080"
      NEXT_PUBLIC_OPERATOR_HOSTNAME: "operator.localhost:3000"
      NEXT_PUBLIC_PARENTS_HOSTNAME: "parents.localhost:3000"
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_SCHOOL_HOSTNAME: "schule.localhost:3000"
      NEXT_PUBLIC_CATERER_HOSTNAME: "caterer.localhost:3000"
      NEXT_PUBLIC_TRAEGER_HOSTNAME: "traeger.localhost:3000"
      TENANT_DOMAIN: "localhost"
      NEXT_PUBLIC_TENANT_DOMAIN: "localhost"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-bundle-ratchet-throwaway-secret"
      AUTH_JWT_EXPIRY: "15m"
      AUTH_JWT_REFRESH_EXPIRY: "168h"
      METRICS_BEARER_TOKEN: "ci-bundle-ratchet-token"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the default synthetic merge for the regular integration build.
          # Feature bundle measurements switch to the PR head afterwards.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      # Actions re-evaluates cache inputs in the post step. Compute these once,
      # before node_modules and build outputs exist: the same glob cost 24s
      # after Storybook, even on an exact cache hit with no upload.
      - name: Compute Next.js cache key
        id: next-cache-key
        env:
          CACHE_KEY: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          CACHE_PREFIX: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
        run: |
          echo "key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "prefix=$CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: ${{ steps.next-cache-key.outputs.key }}
          restore-keys: ${{ steps.next-cache-key.outputs.prefix }}

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify bundle budget and observation contracts
        working-directory: frontend
        run: node --test scripts/bundle-workflow-permissions.node-test.mjs scripts/perf/bundle-policy.node-test.mjs scripts/perf/bundle-measurement.node-test.mjs scripts/perf/bundle-base.node-test.mjs

      - name: Build frontend merge integration
        working-directory: frontend
        run: pnpm run build

      - name: Select feature PR head for bundle delta measurements
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        working-directory: frontend
        env:
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --detach "$HEAD_REVISION"
          pnpm install --frozen-lockfile

      - name: Identify bundle observation source and configuration
        id: bundle-key
        working-directory: frontend
        env:
          BASE_REVISION: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.base.sha || '' }}
        run: |
          if [[ -n "$BASE_REVISION" && ! "$BASE_REVISION" =~ ^0+$ ]]; then
            merge_base=$(git merge-base HEAD "$BASE_REVISION")
            node scripts/perf/bundle-measurement.mjs --prepare-ci "$merge_base"
          else
            node scripts/perf/bundle-measurement.mjs --prepare-ci
          fi

      - name: Cold build exact merge-base with the same runner and environment
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        working-directory: frontend
        run: node scripts/perf/bundle-measurement.mjs --build-base

      # Feature PRs enforce their own delta against a cold merge-base build.
      # Release PRs into main and nightly enforce only absolute ceilings:
      # release-cycle growth is not a feature PR regression. The regular merge
      # build above still catches semantic integration failures before merging.
      # Keep the regular build: experimental-analyze's cold compilation is not
      # assumed to cover every Next.js build/type/route-validation contract.
      - name: Bundle size ratchet
        working-directory: frontend
        run: pnpm run perf:bundle-ratchet

      - name: Upload measured bundle sizes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-measured-${{ steps.bundle-key.outputs.measurement-key }}
          overwrite: true
          path: |
            frontend/perf-results/bundle-measured.json
            frontend/perf-results/bundle-base.json
            frontend/perf-results/bundle-base-identity.json
          retention-days: 14
          if-no-files-found: ignore
