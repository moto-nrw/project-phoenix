# TEMP-DIAG #6962: remove before ready. Runs the seed smoke on free hosted
# runners to compare fast and slow VMs.
name: TEMP seed smoke diagnosis

on:
  push:
    branches:
      - perf/6962-pr-lauf-unter-5-min
    paths:
      - .github/workflows/tmp-seed-diag-6962.yml

permissions:
  contents: read
  checks: write

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    uses: ./.github/workflows/test.yml
    with:
      run-backend: false
      run-frontend: false
      run-seed-smoke: true
      full-backend-suite: false
      full-frontend-suite: false
