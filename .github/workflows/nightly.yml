name: Nightly full suite

# development has no push run (see main.yml). Pull requests test only what they
# change, so this run catches what slips between them: two pull requests that
# pass alone but break together, and gaps in changed-test selection. It runs the
# full suites on the development head before perf-nightly (03:30 UTC).
#
# The full lint run serves the same purpose for changed-package lint. It also
# saves the development caches that the lint jobs restore in pull requests;
# a pull request cannot read another one's cache.
# Backend tests run with the race detector (#5261), not on pull requests.
# Keep the existing weekday schedule. Failures make this run red; like the
# other nightly suites, there is no separate notification integration.

on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Test with race detector
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/test.yml
    with:
      run-backend: true
      run-frontend: true
      run-seed-smoke: true
      changed-scope: false
      base_ref: ""
      full-backend-suite: true
      backend-race: true
      full-frontend-suite: true

  lint:
    name: Lint
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/lint.yml
    with:
      run-backend: true
      full-backend: true
      run-frontend: true
      run-error-codes: true

  # License and vulnerability scans depend on dependency changes and on new
  # advisories, not on each pull request's code, so they run once a night.
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go with cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum
      - name: Install govulncheck (Devbox pin)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Backend licenses and vulnerabilities
        run: bash scripts/check-quality.sh backend-dependencies
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend licenses
        run: bash scripts/check-quality.sh frontend-dependencies
