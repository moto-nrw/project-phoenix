name: E2E (Playwright)

# Reusable workflow that runs the Playwright E2E suite against an isolated
# Docker stack (postgres-test + server-e2e). Triggered by main.yml when
# either backend/ or frontend/ changes. Manual dispatch is also supported
# for ad-hoc runs.
#
# What this does, end-to-end:
#   1. Materialise .env from the checked-in templates.
#   2. `./scripts/e2e.sh` brings up postgres-test + server-e2e, runs
#      `go run main.go e2e prepare`, then hands off to Playwright.
#   3. Playwright's webServer starts only the dedicated Next.js dev server
#      from the emitted Go manifest.
#   4. The suite runs headless against that manifest-backed frontend.
#   5. On failure, the HTML report, E2E manifest, and backend logs are
#      uploaded as artifacts.

on:
  workflow_call:
    inputs:
      run-e2e:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      run-e2e:
        type: boolean
        default: true
        description: "Run the E2E suite (uncheck to no-op)"

defaults:
  run:
    shell: bash

jobs:
  e2e:
    if: ${{ inputs.run-e2e }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install frontend dependencies
        # Adding --ignore-scripts here would skip postinstall hooks for
        # legitimate deps (Playwright browser setup, esbuild/swc native
        # build steps). The dependency tree is verified by Socket Security
        # and CodeQL on every PR, so any malicious postinstall would be
        # flagged elsewhere. The whole file is excluded from SonarCloud
        # via sonar-project.properties for the same reason.
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          # Pin cache key to the @playwright/test version so a bump
          # invalidates the cache automatically.
          key: pw-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Chromium for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium

      - name: Generate ephemeral CI secrets
        # Generate fresh, random per-run secrets and propagate via
        # $GITHUB_ENV so subsequent steps see them as env vars. This avoids
        # hardcoding any secret-shaped strings in the workflow file (which
        # secret scanners like GitGuardian flag, even when the strings are
        # CI-only test fixtures). Hex output keeps `sed` substitutions safe
        # (no special characters to escape). 32-byte JWT/NEXTAUTH secrets
        # produce 64 hex chars — well above the 32-char minimum the backend
        # enforces at startup.
        run: |
          {
            echo "CI_AUTH_JWT_SECRET=$(openssl rand -hex 32)"
            echo "CI_NEXTAUTH_SECRET=$(openssl rand -hex 32)"
            echo "CI_POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "CI_ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "CI_OPERATOR_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Materialise root .env for docker compose
        # docker compose reads ${VAR} from .env at the repo root. The example
        # file already has CI-safe defaults for everything we touch (Mailpit,
        # localhost CORS, debug logging) — we only override secrets that
        # MUST be non-placeholder for the backend to boot successfully.
        run: |
          cp .env.example .env
          sed -i "s|^AUTH_JWT_SECRET=.*|AUTH_JWT_SECRET=${CI_AUTH_JWT_SECRET}|" .env
          sed -i "s|^NEXTAUTH_SECRET=.*|NEXTAUTH_SECRET=${CI_NEXTAUTH_SECRET}|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${CI_POSTGRES_PASSWORD}|" .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=${CI_ADMIN_PASSWORD}|" .env
          # The seeder overrides OPERATOR_* with E2E values, but a non-empty
          # default keeps the bootstrap migration from refusing to run.
          sed -i "s|^OPERATOR_PASSWORD=.*|OPERATOR_PASSWORD=${CI_OPERATOR_PASSWORD}|" .env

      - name: Run canonical E2E flow
        env:
          CI: "true"
          NEXTAUTH_SECRET: ${{ env.CI_NEXTAUTH_SECRET }}
        run: ./scripts/e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload E2E manifest on failure
        # Useful for debugging "demo-device-001 missing in E2E manifest" errors.
        # The Go prepare pipeline writes a dedicated .e2e-manifest.json
        # contract (separate from the dev seed's .seed-state.json).
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-manifest
          path: backend/.e2e-manifest.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Capture backend logs on failure
        # Write to files instead of dumping straight into the job log.
        # `docker compose logs` without --tail can produce tens of
        # thousands of lines (postgres especially) which floods GitHub's
        # job-log UI and gets truncated mid-output, exactly when you
        # need it for triage. --tail=2000 covers any realistic failure
        # window; --no-color strips ANSI escapes so the file is grep-able.
        # `|| true` prevents this step from masking the real test failure
        # if `docker compose` itself errors out (e.g. service already down).
        if: failure()
        run: |
          mkdir -p backend-logs
          docker compose -f docker-compose.example.yml --profile e2e logs --no-color --tail=2000 server-e2e \
            > backend-logs/server-e2e.log 2>&1 || true
          docker compose -f docker-compose.example.yml --profile e2e logs --no-color --tail=2000 postgres-test \
            > backend-logs/postgres-test.log 2>&1 || true

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-logs
          path: backend-logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down docker stack
        if: always()
        run: docker compose -f docker-compose.example.yml --profile e2e down --volumes --remove-orphans
