name: E2E (Playwright)

# Reusable workflow that runs the canonical Go-owned E2E harness. CI prepares
# dependencies, exports ephemeral secrets into the process environment, then
# invokes exactly the same `go run . e2e run` command that developers use
# locally. The Go orchestrator owns infra startup, world preparation, frontend
# boot, Playwright execution, teardown, and backend-log capture.

on:
  workflow_call:
    inputs:
      run-e2e:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      run-e2e:
        type: boolean
        default: true
        description: "Run the E2E suite (uncheck to no-op)"

defaults:
  run:
    shell: bash

jobs:
  e2e:
    if: ${{ inputs.run-e2e }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install frontend dependencies
        # Adding --ignore-scripts here would skip postinstall hooks for
        # legitimate deps (Playwright browser setup, esbuild/swc native
        # build steps). The dependency tree is verified by Socket Security
        # and CodeQL on every PR, so any malicious postinstall would be
        # flagged elsewhere. The whole file is excluded from SonarCloud
        # via sonar-project.properties for the same reason.
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          # Pin cache key to the @playwright/test version so a bump
          # invalidates the cache automatically.
          key: pw-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Chromium for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium

      - name: Generate ephemeral CI secrets
        run: |
          {
            echo "AUTH_JWT_SECRET=$(openssl rand -hex 32)"
            echo "NEXTAUTH_SECRET=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "OPERATOR_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Materialize root .env for the canonical harness
        run: cp .env.example .env

      - name: Run canonical E2E flow
        env:
          CI: "true"
        working-directory: backend
        run: go run . e2e run --scenario e2e-multi-tenant

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload E2E state on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-state
          path: backend/.e2e-state.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-logs
          path: backend/.e2e-artifacts/backend-logs/
          retention-days: 7
          if-no-files-found: ignore
