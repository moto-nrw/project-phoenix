run-name: main workflow
on:
  push:
    branches:
      - main
      - master
      - develop
      - development
  pull_request:
    # ready_for_review is NOT a default activity type. Without it, a PR taken
    # out of draft would get no CI at all, because every job below skips while
    # the PR is a draft.
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Draft PRs run no CI. lint/test skip implicitly via `needs: detect-changes`;
  # env-sync-check and ci-gate carry the same guard explicitly. The full suite
  # runs on the ready_for_review event.
  detect-changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      # Every protected-branch push rechecks both full suites. A docs-only push
      # must not report green while inheriting a broken development head.
      # Lint/build jobs stay scoped to the side that changed.
      run-backend: ${{ github.event_name == 'push' || steps.filter.outputs.backend-tests == 'true' || steps.filter.outputs.backend-test-infra == 'true' || steps.filter.outputs.ci == 'true' }}
      run-frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.frontend-test-infra == 'true' || steps.filter.outputs.ci == 'true' }}
      run-backend-lint: ${{ steps.filter.outputs.backend-lint == 'true' || steps.filter.outputs.ci == 'true' }}
      run-frontend-lint: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.ci == 'true' }}
      # The seed smoke drives runtime API contracts. Test-only edits and
      # frontend-only pushes cannot affect it and must not buy another runner.
      run-seed-smoke: ${{ steps.filter.outputs.backend-production == 'true' || steps.filter.outputs.ci == 'true' }}
      # Workflow/config changes validate the complete test commands. Ordinary
      # PRs use changed-test selection; protected-branch pushes are always full
      # because they produce the coverage consumed by SonarCloud.
      full-backend-suite: ${{ steps.filter.outputs.backend-test-infra == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'push' }}
      full-frontend-suite: ${{ steps.filter.outputs.frontend-test-infra == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            backend-tests:
              - 'backend/**/*.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/**/testdata/**'
              - 'backend/localization/locales.json'
              - 'backend/services/listexport/assets/**'
              - 'backend/templates/email/**'
            backend-lint:
              - 'backend/**/*.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/.golangci.yml'
              - 'backend/.go-arch-lint.yml'
              - 'backend/tools/go.mod'
              - 'backend/tools/go.sum'
              - 'scripts/backend-architecture.sh'
            backend-production:
              - 'backend/**/*.go'
              - '!backend/**/*_test.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/localization/locales.json'
              - 'backend/services/listexport/assets/**'
              - 'backend/templates/email/**'
            frontend:
              - 'frontend/**'
              - '!frontend/**/*.md'
            backend-test-infra:
              - 'scripts/backend-affected-packages.sh'
              - 'scripts/backend-affected-packages_test.sh'
              - 'scripts/test-backend.sh'
              - 'scripts/test-changed.sh'
            frontend-test-infra:
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'frontend/tsconfig.json'
              - 'frontend/vitest.config.ts'
              - 'frontend/src/test/setup.ts'
              - 'scripts/test-changed.sh'
            ci:
              - '.github/**'
              - 'sonar-project.properties'
              - 'environments/**'
              - '.env.example'
              - 'package.json'

  lint:
    permissions:
      contents: read
    needs: detect-changes
    uses: ./.github/workflows/lint.yml
    with:
      run-backend: ${{ needs.detect-changes.outputs.run-backend-lint == 'true' }}
      run-frontend: ${{ needs.detect-changes.outputs.run-frontend-lint == 'true' }}

  test:
    permissions:
      contents: read
      checks: write
    needs: detect-changes
    uses: ./.github/workflows/test.yml
    with:
      run-backend: ${{ needs.detect-changes.outputs.run-backend == 'true' }}
      run-frontend: ${{ needs.detect-changes.outputs.run-frontend == 'true' }}
      run-seed-smoke: ${{ needs.detect-changes.outputs.run-seed-smoke == 'true' }}
      is-pr: ${{ github.event_name == 'pull_request' }}
      base_ref: ${{ github.base_ref }}
      full-backend-suite: ${{ needs.detect-changes.outputs.full-backend-suite == 'true' }}
      full-frontend-suite: ${{ needs.detect-changes.outputs.full-frontend-suite == 'true' }}

  # Deliberately NOT a ci-gate dependency. Sonar needs the coverage artifacts,
  # so it can only start once test finishes; keeping it in the gate added its
  # full runtime to every run's critical path. Run it only after changes land
  # on development or main; PRs already run lint and tests before merge.
  sonarcloud:
    needs: [detect-changes, test]
    # always(): analyse failing runs too, matching the previous behaviour from
    # when this job lived in test.yml.
    if: >-
      always()
      && github.event_name == 'push'
      && (github.ref_name == 'development' || github.ref_name == 'main')
      && (needs.detect-changes.outputs.run-backend == 'true' || needs.detect-changes.outputs.run-frontend == 'true')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required for SonarCloud PR analysis and SCM blame

      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-backend
          path: backend/
        continue-on-error: true

      - name: Download frontend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-frontend
          path: frontend/coverage/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Verify all environments have matching env var keys (no secrets needed)
  env-sync-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check environment key sync
        run: ./scripts/env-check.sh
      - name: Block unencrypted secrets
        run: |
          failed=false
          for f in environments/*.sops.env; do
            [ -f "$f" ] || continue
            # Check 1: file must have SOPS metadata
            if ! grep -q '^sops_version=' "$f"; then
              echo "::error file=$f::UNENCRYPTED file! Run: sops encrypt --in-place $f"
              failed=true
              continue
            fi
            # Check 2: no non-empty values without ENC[ wrapper
            # Matches KEY=<something> where <something> is not empty and not ENC[
            while IFS= read -r line; do
              echo "::error file=$f::Plaintext value detected: ${line%%=*}= — re-encrypt with: sops encrypt --in-place $f"
              failed=true
            done < <(grep -E '^[A-Za-z_][A-Za-z0-9_]*=.+' "$f" | grep -v 'ENC\[' | grep -v '^sops_')
          done
          if [ "$failed" = true ]; then
            exit 1
          fi
          echo "All .sops.env files are encrypted"

  ci-gate:
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [lint, test, env-sync-check]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, test
