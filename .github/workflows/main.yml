run-name: main workflow
on:
  push:
    branches:
      - main
      - master
      - develop
      - development
  pull_request:
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      # On push to main/development: always run everything (full coverage for SonarCloud)
      # On PRs: only run what changed (path filtering saves CI minutes)
      run-backend: ${{ github.event_name == 'push' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.ci == 'true' }}
      run-frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ci:
              - '.github/**'
              - 'sonar-project.properties'

  lint:
    permissions:
      contents: read
    needs: detect-changes
    uses: ./.github/workflows/lint.yml
    with:
      run-backend: ${{ needs.detect-changes.outputs.run-backend == 'true' }}
      run-frontend: ${{ needs.detect-changes.outputs.run-frontend == 'true' }}

  test:
    permissions:
      contents: read
      checks: write
    needs: detect-changes
    uses: ./.github/workflows/test.yml
    with:
      run-backend: ${{ needs.detect-changes.outputs.run-backend == 'true' }}
      run-frontend: ${{ needs.detect-changes.outputs.run-frontend == 'true' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Verify all environments have matching env var keys (no secrets needed)
  env-sync-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check environment key sync
        run: ./scripts/env-check.sh
      - name: Block unencrypted secrets
        run: |
          for f in environments/*.sops.env; do
            [ -f "$f" ] || continue
            if ! grep -q '^sops_version=' "$f"; then
              echo "::error file=$f::UNENCRYPTED secrets detected! Run: sops encrypt --in-place $f"
              exit 1
            fi
          done
          echo "All .sops.env files are encrypted"

  ci-gate:
    if: always()
    needs: [lint, test, env-sync-check]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, test, env-sync-check
