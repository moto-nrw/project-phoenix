run-name: main workflow
on:
  push:
    branches:
      - main
      - master
      - develop
      - development
  pull_request:
    # ready_for_review is NOT a default activity type. Without it, a PR taken
    # out of draft would get no CI at all, because every job below skips while
    # the PR is a draft.
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local

jobs:
  # Draft PRs run no CI. lint/test skip implicitly via `needs: detect-changes`;
  # env-sync-check and ci-gate carry the same guard explicitly. The full suite
  # runs on the ready_for_review event.
  detect-changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      # Every protected-branch push rechecks both full suites. A docs-only push
      # must not report green while inheriting a broken development head.
      # Backend lint also runs in full; frontend lint/build stays change-scoped.
      run-backend: ${{ github.event_name == 'push' || steps.filter.outputs.backend-tests == 'true' || steps.filter.outputs.backend-test-infra == 'true' || steps.filter.outputs.ci == 'true' }}
      run-frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.frontend-test-infra == 'true' || steps.filter.outputs.ci == 'true' }}
      run-backend-lint: ${{ github.event_name == 'push' || steps.filter.outputs.backend-lint == 'true' || steps.filter.outputs.ci == 'true' }}
      run-backend-architecture: ${{ github.event_name == 'push' || steps.filter.outputs.backend-architecture == 'true' || steps.filter.outputs.ci == 'true' }}
      full-backend-lint: ${{ github.event_name == 'push' || steps.filter.outputs.backend-lint-full == 'true' || steps.filter.outputs.ci == 'true' }}
      run-frontend-lint: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.ci == 'true' }}
      # The seed smoke drives runtime API contracts. Test-only edits and
      # frontend-only pushes cannot affect it and must not buy another runner.
      run-seed-smoke: ${{ steps.filter.outputs.backend-production == 'true' || steps.filter.outputs.ci == 'true' }}
      # Workflow/config changes validate the complete test commands. Ordinary
      # PRs use changed-test selection; protected-branch pushes are always full
      # because they produce the coverage consumed by SonarCloud.
      full-backend-suite: ${{ steps.filter.outputs.backend-test-infra == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'push' }}
      full-frontend-suite: ${{ steps.filter.outputs.frontend-test-infra == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            backend-tests:
              - 'backend/**/*.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/architecture/policy.json'
              - 'backend/**/testdata/**'
              - 'backend/localization/locales.json'
              - 'backend/services/listexport/assets/**'
              - 'backend/templates/email/**'
              - 'scripts/backend-architecture.sh'
              - 'scripts/backend-architecture/**'
            backend-lint:
              - 'backend/**/*.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/.golangci.yml'
              - 'backend/architecture/**'
              - 'backend/internal/architecture/**'
              - 'backend/tools/go.mod'
              - 'backend/tools/go.sum'
              - 'scripts/backend-affected-packages.sh'
              - 'scripts/backend-affected-packages_test.sh'
              - 'scripts/backend-lint-packages.sh'
              - 'scripts/backend-architecture.sh'
              - 'scripts/backend-architecture/**'
            backend-architecture:
              - 'backend/**/*.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/architecture/**'
              - 'backend/internal/architecture/**'
              - 'scripts/backend-architecture.sh'
              - 'scripts/backend-architecture/**'
              - 'lefthook.yml'
            backend-lint-full:
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/.golangci.yml'
              - 'scripts/backend-affected-packages.sh'
              - 'scripts/backend-affected-packages_test.sh'
              - 'scripts/backend-lint-packages.sh'
            backend-production:
              - 'backend/**/*.go'
              - '!backend/**/*_test.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/localization/locales.json'
              - 'backend/services/listexport/assets/**'
              - 'backend/templates/email/**'
            frontend:
              - 'frontend/**'
              - '!frontend/**/*.md'
            backend-test-infra:
              - 'scripts/backend-affected-packages.sh'
              - 'scripts/backend-affected-packages_test.sh'
              - 'scripts/backend-lint-packages.sh'
              - 'scripts/test-backend.sh'
              - 'scripts/test-changed.sh'
              - 'scripts/test-changed_test.sh'
              - 'scripts/test-run-id.sh'
              - '.claude/hooks/guard-absolute-rules.sh'
              - '.claude/hooks/guard-absolute-rules_test.sh'
            frontend-test-infra:
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'frontend/tsconfig.json'
              - 'frontend/vitest.config.ts'
              - 'frontend/src/test/setup.ts'
              - 'scripts/test-changed.sh'
            ci:
              - '.github/**'
              - 'sonar-project.properties'
              - 'environments/**'
              - '.env.example'
              - 'package.json'

  lint:
    permissions:
      contents: read
    needs: detect-changes
    uses: ./.github/workflows/lint.yml
    with:
      run-backend: ${{ needs.detect-changes.outputs.run-backend-lint == 'true' }}
      full-backend: ${{ needs.detect-changes.outputs.full-backend-lint == 'true' }}
      run-frontend: ${{ needs.detect-changes.outputs.run-frontend-lint == 'true' }}

  backend-architecture-ratchet:
    name: Backend architecture ratchet
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.draft == false && needs.detect-changes.outputs.run-backend-architecture == 'true')
    needs: detect-changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go with cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: |
            backend/go.sum
            scripts/backend-architecture/go.sum
      - name: Check deterministic architecture ratchet
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CUTOVER_BASE_SHA: 1c66eb9233fb398b186420b4ffb36004a8a83c6c
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if git cat-file -e "$BASE_SHA:backend/architecture/legacy.jsonl" 2>/dev/null; then
              scripts/backend-architecture.sh check --base-ref "$BASE_SHA"
            elif [[ "$BASE_SHA" == "$CUTOVER_BASE_SHA" ]]; then
              # The baseline cannot exist in the base commit that introduces it.
              # Restrict this one-time bootstrap to graph-neutral cutover files.
              unexpected=$(git diff --name-only "$BASE_SHA"...HEAD -- backend | grep -Ev '^backend/(\.go-arch-lint\.yml|README\.md|architecture/(README\.md|legacy\.jsonl)|internal/architecture/cli_test\.go|tools/go\.(mod|sum))$' || true)
              if [[ -n "$unexpected" ]]; then
                echo "Unexpected backend changes in architecture-ratchet cutover:"
                echo "$unexpected"
                exit 1
              fi
              scripts/backend-architecture.sh check
            elif [[ "$BASE_REF" == "main" && "$HEAD_REF" == "development" && "$HEAD_REPO" == "$REPOSITORY" ]]; then
              # The first release that carries the ratchet cannot compare
              # against main because main does not have a baseline yet. Only
              # the repository's development branch may take this path.
              scripts/backend-architecture.sh check
            else
              echo "Base commit $BASE_SHA has no architecture baseline; rebase onto the cutover."
              exit 1
            fi
          else
            scripts/backend-architecture.sh check
          fi
      - name: Generate and validate current architecture projections
        run: |
          output_directory=$(mktemp -d)
          cleanup() {
            rm -rf -- "$output_directory"
          }
          trap cleanup EXIT

          scripts/backend-architecture.sh diagram --output "$output_directory"
          scripts/backend-architecture.sh dependencies \
            --focus module:architecture-check \
            --output "$output_directory"

          for artifact in architecture.json go-arch-lint.yml dependencies.json dependencies.goda; do
            test -s "$output_directory/$artifact"
          done
          python3 - \
            "$output_directory/target.svg" \
            "$output_directory/migration.svg" \
            "$output_directory/dependencies.svg" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          svg_tag = "{http://www.w3.org/2000/svg}svg"
          for filename in sys.argv[1:]:
              root = ET.parse(filename).getroot()
              if root.tag != svg_tag:
                  raise SystemExit(
                      f"{filename}: root element is {root.tag}, expected {svg_tag}"
                  )
          PY
      - name: Audit open migration issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/backend-architecture.sh audit-issues --api-url "$GITHUB_API_URL"

  test:
    permissions:
      contents: read
      checks: write
    needs: detect-changes
    uses: ./.github/workflows/test.yml
    with:
      run-backend: ${{ needs.detect-changes.outputs.run-backend == 'true' }}
      run-frontend: ${{ needs.detect-changes.outputs.run-frontend == 'true' }}
      run-seed-smoke: ${{ needs.detect-changes.outputs.run-seed-smoke == 'true' }}
      is-pr: ${{ github.event_name == 'pull_request' }}
      base_ref: ${{ github.base_ref }}
      full-backend-suite: ${{ needs.detect-changes.outputs.full-backend-suite == 'true' }}
      full-frontend-suite: ${{ needs.detect-changes.outputs.full-frontend-suite == 'true' }}

  # Deliberately NOT a ci-gate dependency. Sonar needs the coverage artifacts,
  # so it can only start once test finishes; keeping it in the gate added its
  # full runtime to every run's critical path. Run it only after changes land
  # on development or main; PRs already run lint and tests before merge.
  sonarcloud:
    needs: [detect-changes, test]
    # always(): analyse failing runs too, matching the previous behaviour from
    # when this job lived in test.yml.
    if: >-
      always()
      && github.event_name == 'push'
      && (github.ref_name == 'development' || github.ref_name == 'main')
      && (needs.detect-changes.outputs.run-backend == 'true' || needs.detect-changes.outputs.run-frontend == 'true')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required for SonarCloud PR analysis and SCM blame

      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-backend
          path: backend/
        continue-on-error: true

      - name: Download frontend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-frontend
          path: frontend/coverage/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Verify all environments have matching env var keys (no secrets needed)
  env-sync-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check environment key sync
        run: ./scripts/env-check.sh
      - name: Check pinned pnpm contract
        run: |
          expected=$(jq -r '[.packages[] | select(startswith("pnpm_10@"))] | if length == 1 then .[0] | split("@")[1] else empty end' devbox.json)
          if [[ -z "$expected" ]]; then
            echo "::error file=devbox.json::Expected exactly one pnpm_10@<version> package"
            exit 1
          fi
          locked=$(jq -r --arg package "pnpm_10@$expected" '.packages[$package].version // empty' devbox.lock)
          if [[ "$locked" != "$expected" ]]; then
            echo "::error file=devbox.lock::pnpm lock version $locked does not match Devbox pin $expected"
            exit 1
          fi
          for manifest in package.json frontend/package.json; do
            actual=$(jq -r '(.packageManager // "") | if startswith("pnpm@") then sub("^pnpm@"; "") | split("+")[0] else empty end' "$manifest")
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$manifest::packageManager version $actual does not match Devbox pin $expected"
              exit 1
            fi
          done
      - name: Block unencrypted secrets
        run: |
          failed=false
          for f in environments/*.sops.env; do
            [ -f "$f" ] || continue
            # Check 1: file must have SOPS metadata
            if ! grep -q '^sops_version=' "$f"; then
              echo "::error file=$f::UNENCRYPTED file! Run: sops encrypt --in-place $f"
              failed=true
              continue
            fi
            # Check 2: no non-empty values without ENC[ wrapper
            # Matches KEY=<something> where <something> is not empty and not ENC[
            while IFS= read -r line; do
              echo "::error file=$f::Plaintext value detected: ${line%%=*}= — re-encrypt with: sops encrypt --in-place $f"
              failed=true
            done < <(grep -E '^[A-Za-z_][A-Za-z0-9_]*=.+' "$f" | grep -v 'ENC\[' | grep -v '^sops_')
          done
          if [ "$failed" = true ]; then
            exit 1
          fi
          echo "All .sops.env files are encrypted"

  ci-gate:
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [detect-changes, lint, test, backend-architecture-ratchet, env-sync-check]
    runs-on: ubuntu-latest
    steps:
      - name: Reject skipped mandatory checks
        env:
          ARCHITECTURE_REQUIRED: ${{ needs.detect-changes.outputs.run-backend-architecture }}
          BACKEND_LINT_REQUIRED: ${{ needs.detect-changes.outputs.run-backend-lint }}
          FRONTEND_LINT_REQUIRED: ${{ needs.detect-changes.outputs.run-frontend-lint }}
          BACKEND_TEST_REQUIRED: ${{ needs.detect-changes.outputs.run-backend }}
          FRONTEND_TEST_REQUIRED: ${{ needs.detect-changes.outputs.run-frontend }}
          SEED_SMOKE_REQUIRED: ${{ needs.detect-changes.outputs.run-seed-smoke }}
          ARCHITECTURE_RESULT: ${{ needs.backend-architecture-ratchet.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$ARCHITECTURE_REQUIRED" == true && "$ARCHITECTURE_RESULT" == skipped ]] ||
             [[ ( "$BACKEND_LINT_REQUIRED" == true || "$FRONTEND_LINT_REQUIRED" == true ) && "$LINT_RESULT" == skipped ]] ||
             [[ ( "$BACKEND_TEST_REQUIRED" == true || "$FRONTEND_TEST_REQUIRED" == true || "$SEED_SMOKE_REQUIRED" == true ) && "$TEST_RESULT" == skipped ]]; then
            echo "A mandatory check was skipped (architecture=$ARCHITECTURE_RESULT, lint=$LINT_RESULT, test=$TEST_RESULT)"
            exit 1
          fi
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, test, backend-architecture-ratchet
