run-name: main workflow
on:
  push:
    branches:
      - main
      - master
      - develop
      - development
  pull_request:
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      # On push to main/development: always run everything (full coverage for SonarCloud)
      # On PRs: only run what changed (path filtering saves CI minutes)
      run-backend: ${{ github.event_name == 'push' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.ci == 'true' }}
      run-frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.ci == 'true' }}
      # E2E exercises the cross-cutting flow (frontend + backend + seed
      # scripts), so any change to those areas — or to the e2e harness
      # itself — must trigger it.
      run-e2e: ${{ github.event_name == 'push' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.e2e == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            e2e:
              - 'frontend/e2e/**'
              - 'frontend/playwright.config.ts'
              - 'scripts/seed-e2e*.sh'
              - 'scripts/setup-e2e-hosts.sh'
              - 'scripts/lib/assert-local-url.sh'
              - 'docker-compose.example.yml'
            ci:
              - '.github/**'
              - 'sonar-project.properties'

  lint:
    permissions:
      contents: read
    needs: detect-changes
    uses: ./.github/workflows/lint.yml
    with:
      run-backend: ${{ needs.detect-changes.outputs.run-backend == 'true' }}
      run-frontend: ${{ needs.detect-changes.outputs.run-frontend == 'true' }}

  test:
    permissions:
      contents: read
      checks: write
    needs: detect-changes
    uses: ./.github/workflows/test.yml
    with:
      run-backend: ${{ needs.detect-changes.outputs.run-backend == 'true' }}
      run-frontend: ${{ needs.detect-changes.outputs.run-frontend == 'true' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    permissions:
      contents: read
    needs: detect-changes
    uses: ./.github/workflows/e2e.yml
    with:
      run-e2e: ${{ needs.detect-changes.outputs.run-e2e == 'true' }}

  # Verify all environments have matching env var keys (no secrets needed)
  env-sync-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check environment key sync
        run: ./scripts/env-check.sh
      - name: Block unencrypted secrets
        run: |
          failed=false
          for f in environments/*.sops.env; do
            [ -f "$f" ] || continue
            # Check 1: file must have SOPS metadata
            if ! grep -q '^sops_version=' "$f"; then
              echo "::error file=$f::UNENCRYPTED file! Run: sops encrypt --in-place $f"
              failed=true
              continue
            fi
            # Check 2: no non-empty values without ENC[ wrapper
            # Matches KEY=<something> where <something> is not empty and not ENC[
            while IFS= read -r line; do
              echo "::error file=$f::Plaintext value detected: ${line%%=*}= — re-encrypt with: sops encrypt --in-place $f"
              failed=true
            done < <(grep -E '^[A-Za-z_][A-Za-z0-9_]*=.+' "$f" | grep -v 'ENC\[' | grep -v '^sops_')
          done
          if [ "$failed" = true ]; then
            exit 1
          fi
          echo "All .sops.env files are encrypted"

  ci-gate:
    if: always()
    needs: [lint, test, e2e, env-sync-check]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, test, e2e
