run-name: main workflow
on:
  push:
    branches:
      - main
      - master
      - develop
  # development has no push run: pull requests test each change, release pull
  # requests into main run the full suites, and nightly.yml runs them on the
  # development head every weekday.
  pull_request:
    # ready_for_review is NOT a default activity type. Without it, a PR taken
    # out of draft would get no CI at all, because every job below skips while
    # the PR is a draft.
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}

concurrency:
  # Pushes have no head_ref, so each push run gets its own group and is never
  # cancelled by the next one.
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local

jobs:
  # Draft PRs run no CI. lint/test skip implicitly via `needs: detect-changes`;
  # env-sync-check and ci-gate carry the same guard explicitly. The full suite
  # runs on the ready_for_review event.
  detect-changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      # Protected-branch pushes and release pull requests (development -> main)
      # recheck both full suites. A docs-only release must not report green while
      # inheriting a broken development head. Backend lint also runs in full;
      # frontend lint/build stays change-scoped.
      run-backend: ${{ github.event_name == 'push' || steps.scope.outputs.release == 'true' || steps.filter.outputs.backend-tests == 'true' || steps.filter.outputs.backend-test-infra == 'true' || steps.filter.outputs.ci == 'true' }}
      run-frontend: ${{ github.event_name == 'push' || steps.scope.outputs.release == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.frontend-test-infra == 'true' || steps.filter.outputs.ci == 'true' }}
      run-backend-lint: ${{ github.event_name == 'push' || steps.scope.outputs.release == 'true' || steps.filter.outputs.backend-lint == 'true' || steps.filter.outputs.ci == 'true' }}
      run-backend-architecture: ${{ github.event_name == 'push' || steps.scope.outputs.release == 'true' || steps.filter.outputs.backend-architecture == 'true' || steps.filter.outputs.ci == 'true' }}
      full-backend-lint: ${{ github.event_name == 'push' || steps.scope.outputs.release == 'true' || steps.filter.outputs.backend-lint-full == 'true' || steps.filter.outputs.ci == 'true' }}
      run-frontend-lint: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.ci == 'true' }}
      # The seed smoke drives runtime API contracts. Test-only edits,
      # frontend-only pushes and CI changes outside its own workflow definition
      # cannot affect it and must not buy another runner.
      run-seed-smoke: ${{ steps.filter.outputs.backend-production == 'true' || steps.filter.outputs.seed-smoke-infra == 'true' }}
      # Workflow/config changes validate the complete test commands. Ordinary
      # PRs use changed-test selection; protected-branch pushes and release pull
      # requests are always full because they revalidate the whole tree, not
      # just what the change touched.
      full-backend-suite: ${{ steps.filter.outputs.backend-test-infra == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'push' || steps.scope.outputs.release == 'true' }}
      full-frontend-suite: ${{ steps.filter.outputs.frontend-test-infra == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'push' || steps.scope.outputs.release == 'true' }}
      # Pull requests test what changed against the base branch. Protected-branch
      # pushes and release pull requests run the full suites.
      changed-scope: ${{ github.event_name != 'push' && steps.scope.outputs.release != 'true' }}
      base-ref: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # development has no push run, so the release pull request carries the
      # full-suite evidence for the exact tree that reaches main.
      - name: Detect release pull request
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release=false
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" &&
                "$HEAD_REF" == "development" && "$HEAD_REPO" == "$REPOSITORY" ]]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
      # paths-filter resolves pull requests through the GitHub API and compares
      # a push against the commit before it; neither needs an explicit base.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            backend-tests:
              - 'backend/**/*.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/architecture/policy.json'
              - 'backend/**/testdata/**'
              - 'backend/localization/locales.json'
              - 'backend/services/listexport/assets/**'
              - 'backend/templates/email/**'
              - 'scripts/backend-architecture.sh'
              - 'scripts/backend-architecture/**'
            backend-lint:
              - 'backend/**/*.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/.golangci.yml'
              - 'backend/architecture/**'
              - 'backend/internal/architecture/**'
              - 'backend/tools/go.mod'
              - 'backend/tools/go.sum'
              - 'scripts/backend-affected-packages.sh'
              - 'scripts/backend-affected-packages_test.sh'
              - 'scripts/backend-lint-packages.sh'
              - 'scripts/backend-architecture.sh'
              - 'scripts/backend-architecture/**'
            backend-architecture:
              - 'backend/**/*.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/architecture/**'
              - 'backend/internal/architecture/**'
              - 'scripts/backend-architecture.sh'
              - 'scripts/backend-architecture/**'
              - 'docs/runtime-checkpoints/**'
              - 'docs/operations/**'
              - 'scripts/check-migration-evidence*'
              - 'lefthook.yml'
            backend-lint-full:
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/.golangci.yml'
              - 'scripts/backend-affected-packages.sh'
              - 'scripts/backend-affected-packages_test.sh'
              - 'scripts/backend-lint-packages.sh'
            backend-production:
              - 'backend/**/*.go'
              - '!backend/**/*_test.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/localization/locales.json'
              - 'backend/services/listexport/assets/**'
              - 'backend/templates/email/**'
            seed-smoke-infra:
              - '.github/workflows/main.yml'
              - '.github/workflows/test.yml'
            frontend:
              - 'frontend/**'
              - '!frontend/**/*.md'
            backend-test-infra:
              - 'scripts/backend-affected-packages.sh'
              - 'scripts/backend-affected-packages_test.sh'
              - 'scripts/backend-lint-packages.sh'
              - 'scripts/test-backend.sh'
              - 'scripts/test-changed.sh'
              - 'scripts/test-changed_test.sh'
              - 'scripts/test-run-id.sh'
            frontend-test-infra:
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'frontend/tsconfig.json'
              - 'frontend/vitest.config.ts'
              - 'frontend/src/test/setup.ts'
              - 'scripts/test-changed.sh'
            ci:
              - 'lefthook.yml'
              - 'scripts/pre-push*'
              - 'scripts/check-quality.sh'
              - 'scripts/check-backend-quality.sh'
              - 'scripts/check-frontend-quality.sh'
              - 'scripts/quality-timing.sh'
              - 'scripts/check-secrets.sh'
              - 'scripts/check-release-architecture*'
              - 'scripts/check-migration-evidence*'
              - 'scripts/release-backup*'
              - 'scripts/demo-environment.test.mjs'
              - 'scripts/report-sentry-deploy*'
              - 'scripts/create-demo-env.py'
              - 'scripts/test-support/release-docker.mjs'
              - 'scripts/deploy-remote.sh'
              - 'scripts/rollback-remote.sh'
              - 'scripts/restore-db.sh'
              - 'scripts/run-go-toolchain.sh'
              - '.github/**'
              - 'environments/**'
              - '.env.example'
              - 'package.json'

      - name: Verify pre-push failure and selection behavior
        run: node --test scripts/pre-push.test.mjs scripts/check-release-architecture.test.mjs scripts/check-migration-evidence.test.mjs scripts/release-backup.test.mjs scripts/demo-environment.test.mjs scripts/report-sentry-deploy.test.mjs scripts/posthog-dashboards.test.mjs

      - name: Verify complete release restore with PostgreSQL
        if: steps.filter.outputs.ci == 'true'
        run: node --test scripts/release-backup.integration.test.mjs

  lint:
    permissions:
      contents: read
    needs: detect-changes
    uses: ./.github/workflows/lint.yml
    with:
      run-backend: ${{ needs.detect-changes.outputs.run-backend-lint == 'true' }}
      full-backend: ${{ needs.detect-changes.outputs.full-backend-lint == 'true' }}
      run-frontend: ${{ needs.detect-changes.outputs.run-frontend-lint == 'true' }}

  backend-architecture-ratchet:
    name: Backend architecture ratchet
    # Protected-branch pushes and release pull requests always check. Other
    # pull requests check only when backend or architecture files changed.
    # Draft PRs need no guard here: detect-changes skips, and this job skips
    # with it.
    if: >-
      github.event_name == 'push'
      || needs.detect-changes.outputs.run-backend-architecture == 'true'
    needs: detect-changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go with cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: |
            backend/go.sum
            scripts/backend-architecture/go.sum
      - name: Check deterministic architecture ratchet
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CUTOVER_BASE_SHA: 1c66eb9233fb398b186420b4ffb36004a8a83c6c
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$BASE_REF" == "main" && "$HEAD_REF" == "development" && "$HEAD_REPO" == "$REPOSITORY" ]]; then
              node scripts/check-release-architecture.mjs
            elif git cat-file -e "$BASE_SHA:backend/architecture/legacy.jsonl" 2>/dev/null; then
              scripts/backend-architecture.sh check --base-ref "$BASE_SHA"
            elif [[ "$BASE_SHA" == "$CUTOVER_BASE_SHA" ]]; then
              # The baseline cannot exist in the base commit that introduces it.
              # Restrict this one-time bootstrap to graph-neutral cutover files.
              unexpected=$(git diff --name-only "$BASE_SHA"...HEAD -- backend | grep -Ev '^backend/(\.go-arch-lint\.yml|README\.md|architecture/(README\.md|legacy\.jsonl)|internal/architecture/cli_test\.go|tools/go\.(mod|sum))$' || true)
              if [[ -n "$unexpected" ]]; then
                echo "Unexpected backend changes in architecture-ratchet cutover:"
                echo "$unexpected"
                exit 1
              fi
              scripts/backend-architecture.sh check
            else
              echo "Base commit $BASE_SHA has no architecture baseline; rebase onto the cutover."
              exit 1
            fi
          else
            scripts/backend-architecture.sh check
          fi
      - name: Validate migration evidence and retirement coverage
        # The validator discovers every architecture JSON except the named
        # policy, composition, checkpoint registry and contract-active-2737-progress.json
        # documents. The progress file is historical notes, not cutover evidence.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-migration-evidence.mjs
      - name: Generate and validate current architecture projections
        run: |
          output_directory=$(mktemp -d)
          cleanup() {
            rm -rf -- "$output_directory"
          }
          trap cleanup EXIT

          scripts/backend-architecture.sh diagram --output "$output_directory"
          scripts/backend-architecture.sh dependencies \
            --focus module:architecture-check \
            --output "$output_directory"

          for artifact in architecture.json go-arch-lint.yml dependencies.json dependencies.goda; do
            test -s "$output_directory/$artifact"
          done
          python3 - \
            "$output_directory/target.svg" \
            "$output_directory/migration.svg" \
            "$output_directory/dependencies.svg" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          svg_tag = "{http://www.w3.org/2000/svg}svg"
          for filename in sys.argv[1:]:
              root = ET.parse(filename).getroot()
              if root.tag != svg_tag:
                  raise SystemExit(
                      f"{filename}: root element is {root.tag}, expected {svg_tag}"
                  )
          PY
      - name: Audit open migration issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/backend-architecture.sh audit-issues --api-url "$GITHUB_API_URL"

  test:
    permissions:
      contents: read
      checks: write
    needs: detect-changes
    uses: ./.github/workflows/test.yml
    with:
      run-backend: ${{ needs.detect-changes.outputs.run-backend == 'true' }}
      run-frontend: ${{ needs.detect-changes.outputs.run-frontend == 'true' }}
      run-seed-smoke: ${{ needs.detect-changes.outputs.run-seed-smoke == 'true' }}
      changed-scope: ${{ needs.detect-changes.outputs.changed-scope == 'true' }}
      base_ref: ${{ needs.detect-changes.outputs.base-ref }}
      full-backend-suite: ${{ needs.detect-changes.outputs.full-backend-suite == 'true' }}
      full-frontend-suite: ${{ needs.detect-changes.outputs.full-frontend-suite == 'true' }}

  # Verify all environments have matching env var keys (no secrets needed)
  env-sync-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check environment key sync
        run: ./scripts/env-check.sh
      - name: Check pinned pnpm contract
        run: |
          expected=$(jq -r '[.packages[] | select(startswith("pnpm_10@"))] | if length == 1 then .[0] | split("@")[1] else empty end' devbox.json)
          if [[ -z "$expected" ]]; then
            echo "::error file=devbox.json::Expected exactly one pnpm_10@<version> package"
            exit 1
          fi
          locked=$(jq -r --arg package "pnpm_10@$expected" '.packages[$package].version // empty' devbox.lock)
          if [[ "$locked" != "$expected" ]]; then
            echo "::error file=devbox.lock::pnpm lock version $locked does not match Devbox pin $expected"
            exit 1
          fi
          for manifest in package.json frontend/package.json; do
            actual=$(jq -r '(.packageManager // "") | if startswith("pnpm@") then sub("^pnpm@"; "") | split("+")[0] else empty end' "$manifest")
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$manifest::packageManager version $actual does not match Devbox pin $expected"
              exit 1
            fi
          done
      - name: Block unencrypted secrets
        run: |
          failed=false
          for f in environments/*.sops.env; do
            [ -f "$f" ] || continue
            # Check 1: file must have SOPS metadata
            if ! grep -q '^sops_version=' "$f"; then
              echo "::error file=$f::UNENCRYPTED file! Run: sops encrypt --in-place $f"
              failed=true
              continue
            fi
            # Check 2: no non-empty values without ENC[ wrapper
            # Matches KEY=<something> where <something> is not empty and not ENC[
            while IFS= read -r line; do
              echo "::error file=$f::Plaintext value detected: ${line%%=*}= — re-encrypt with: sops encrypt --in-place $f"
              failed=true
            done < <(grep -E '^[A-Za-z_][A-Za-z0-9_]*=.+' "$f" | grep -v 'ENC\[' | grep -v '^sops_')
          done
          if [ "$failed" = true ]; then
            exit 1
          fi
          echo "All .sops.env files are encrypted"

  ci-gate:
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [detect-changes, lint, test, backend-architecture-ratchet, env-sync-check]
    runs-on: ubuntu-latest
    steps:
      - name: Reject skipped mandatory checks
        env:
          ARCHITECTURE_REQUIRED: ${{ needs.detect-changes.outputs.run-backend-architecture }}
          BACKEND_LINT_REQUIRED: ${{ needs.detect-changes.outputs.run-backend-lint }}
          FRONTEND_LINT_REQUIRED: ${{ needs.detect-changes.outputs.run-frontend-lint }}
          BACKEND_TEST_REQUIRED: ${{ needs.detect-changes.outputs.run-backend }}
          FRONTEND_TEST_REQUIRED: ${{ needs.detect-changes.outputs.run-frontend }}
          SEED_SMOKE_REQUIRED: ${{ needs.detect-changes.outputs.run-seed-smoke }}
          ARCHITECTURE_RESULT: ${{ needs.backend-architecture-ratchet.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$ARCHITECTURE_REQUIRED" == true && "$ARCHITECTURE_RESULT" == skipped ]] ||
             [[ ( "$BACKEND_LINT_REQUIRED" == true || "$FRONTEND_LINT_REQUIRED" == true ) && "$LINT_RESULT" == skipped ]] ||
             [[ ( "$BACKEND_TEST_REQUIRED" == true || "$FRONTEND_TEST_REQUIRED" == true || "$SEED_SMOKE_REQUIRED" == true ) && "$TEST_RESULT" == skipped ]]; then
            echo "A mandatory check was skipped (architecture=$ARCHITECTURE_RESULT, lint=$LINT_RESULT, test=$TEST_RESULT)"
            exit 1
          fi
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, test, backend-architecture-ratchet
