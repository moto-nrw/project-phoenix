run-name: main workflow
on:
  push:
    branches:
      - main
      - master
      - develop
  # development has no push run: pull requests test each change, release pull
  # requests into main run the full suites, and nightly.yml runs them on the
  # development head every weekday.
  pull_request:
    # ready_for_review is NOT a default activity type. Without it, a PR taken
    # out of draft would get no CI at all, because every job below skips while
    # the PR is a draft.
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}

concurrency:
  # Pushes have no head_ref, so each push run gets its own group and is never
  # cancelled by the next one.
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local

jobs:
  # Draft PRs run no CI. Every job except ci-gate skips implicitly via
  # `needs: detect-changes`; ci-gate carries the same guard explicitly. The full
  # suite runs on the ready_for_review event.
  detect-changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      # Protected-branch pushes and release pull requests (development -> main)
      # recheck both full suites. A docs-only release must not report green while
      # inheriting a broken development head. Backend lint also runs in full;
      # frontend lint/build stays change-scoped.
      # A workflow change reruns only the jobs its file defines: main.yml
      # orchestrates every job, test.yml the test suites, lint.yml the lint
      # jobs. Other .github files reach only the script suites below.
      run-backend: ${{ github.event_name == 'push' || steps.scope.outputs.release == 'true' || steps.filter.outputs.backend-tests == 'true' || steps.filter.outputs.backend-test-infra == 'true' || steps.filter.outputs.workflow-main == 'true' || steps.filter.outputs.workflow-test == 'true' }}
      run-frontend: ${{ github.event_name == 'push' || steps.scope.outputs.release == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.frontend-test-infra == 'true' || steps.filter.outputs.workflow-main == 'true' || steps.filter.outputs.workflow-test == 'true' }}
      run-backend-lint: ${{ github.event_name == 'push' || steps.scope.outputs.release == 'true' || steps.filter.outputs.backend-lint == 'true' || steps.filter.outputs.workflow-main == 'true' || steps.filter.outputs.workflow-lint == 'true' || steps.filter.outputs.quality-scripts == 'true' }}
      run-backend-architecture: ${{ github.event_name == 'push' || steps.scope.outputs.release == 'true' || steps.filter.outputs.backend-architecture == 'true' || steps.filter.outputs.workflow-main == 'true' }}
      full-backend-lint: ${{ github.event_name == 'push' || steps.scope.outputs.release == 'true' || steps.filter.outputs.backend-lint-full == 'true' || steps.filter.outputs.workflow-main == 'true' || steps.filter.outputs.workflow-lint == 'true' || steps.filter.outputs.quality-scripts == 'true' }}
      run-frontend-lint: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.workflow-main == 'true' || steps.filter.outputs.workflow-lint == 'true' || steps.filter.outputs.quality-scripts == 'true' }}
      # The seed smoke drives runtime API contracts. Test-only edits,
      # frontend-only pushes and CI changes outside its own workflow definition
      # cannot affect it and must not buy another runner.
      run-seed-smoke: ${{ steps.filter.outputs.backend-production == 'true' || steps.filter.outputs.seed-smoke-infra == 'true' }}
      # Changes to main.yml or test.yml validate the complete test commands.
      # Ordinary PRs use changed-test selection; protected-branch pushes and
      # release pull requests are always full because they revalidate the whole
      # tree, not just what the change touched.
      full-backend-suite: ${{ steps.backend-size.outputs.full == 'true' || steps.filter.outputs.backend-test-infra == 'true' || steps.filter.outputs.workflow-main == 'true' || steps.filter.outputs.workflow-test == 'true' || github.event_name == 'push' || steps.scope.outputs.release == 'true' }}
      full-frontend-suite: ${{ steps.filter.outputs.frontend-test-infra == 'true' || steps.filter.outputs.workflow-main == 'true' || steps.filter.outputs.workflow-test == 'true' || github.event_name == 'push' || steps.scope.outputs.release == 'true' }}
      # Pull requests test what changed against the base branch. Protected-branch
      # pushes and release pull requests run the full suites.
      changed-scope: ${{ github.event_name != 'push' && steps.scope.outputs.release != 'true' }}
      base-ref: ${{ github.base_ref }}
      # The script suites, the env sync and the error-code registry check only
      # files their own filter lists. Docs-only pull requests skip all three.
      run-ci-scripts: ${{ github.event_name == 'push' || steps.scope.outputs.release == 'true' || steps.filter.outputs.tooling == 'true' || steps.filter.outputs.quality-scripts == 'true' || steps.filter.outputs.hooks == 'true' || steps.filter.outputs.toolchain == 'true' || steps.filter.outputs.script-tests == 'true' }}
      run-env-check: ${{ github.event_name == 'push' || steps.scope.outputs.release == 'true' || steps.filter.outputs.env == 'true' }}
      run-error-codes: ${{ github.event_name == 'push' || steps.scope.outputs.release == 'true' || steps.filter.outputs.error-codes == 'true' }}
      tooling-changed: ${{ steps.filter.outputs.tooling == 'true' }}
      toolchain-changed: ${{ steps.filter.outputs.toolchain == 'true' }}
    steps:
      # Pull requests need no checkout: paths-filter reads their changed files
      # through the GitHub API. Pushes compare against the previous commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      # development has no push run, so the release pull request carries the
      # full-suite evidence for the exact tree that reaches main.
      - name: Detect release pull request
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release=false
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" &&
                "$HEAD_REF" == "development" && "$HEAD_REPO" == "$REPOSITORY" ]]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
      # paths-filter resolves pull requests through the GitHub API and compares
      # a push against the commit before it; neither needs an explicit base.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          list-files: json
          filters: |
            backend-tests:
              - 'backend/**/*.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/architecture/policy.json'
              - 'backend/**/testdata/**'
              - 'backend/modules/delivery/internal/adapters/localization/locales.json'
              - 'backend/services/listexport/assets/**'
              - 'backend/templates/email/**'
              - 'scripts/backend-architecture.sh'
              - 'scripts/backend-architecture/**'
            backend-lint:
              - 'backend/**/*.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/.golangci.yml'
              - 'backend/architecture/**'
              - 'backend/internal/architecture/**'
              - 'backend/tools/go.mod'
              - 'backend/tools/go.sum'
              # Notes such as backend/architecture/WORKPLAN.md feed no check.
              # Without a Go change they would select a full ./... lint.
              - '!backend/**/*.md'
              - 'scripts/backend-affected-packages.sh'
              - 'scripts/backend-affected-packages_test.sh'
              - 'scripts/backend-lint-packages.sh'
              - 'scripts/backend-architecture.sh'
              - 'scripts/backend-architecture/**'
            backend-architecture:
              - 'backend/**/*.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/architecture/**'
              - 'backend/internal/architecture/**'
              - 'scripts/backend-architecture.sh'
              - 'scripts/backend-architecture/**'
              - 'docs/runtime-checkpoints/**'
              - 'docs/operations/**'
              - 'scripts/check-migration-evidence*'
              # The evidence gate reads docs/ markdown, never backend/ notes.
              - '!backend/**/*.md'
            backend-lint-full:
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/.golangci.yml'
              - 'scripts/backend-affected-packages.sh'
              - 'scripts/backend-affected-packages_test.sh'
              - 'scripts/backend-lint-packages.sh'
            backend-production:
              - 'backend/**/*.go'
              - '!backend/**/*_test.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/modules/delivery/internal/adapters/localization/locales.json'
              - 'backend/services/listexport/assets/**'
              - 'backend/templates/email/**'
            seed-smoke-infra:
              - '.github/workflows/main.yml'
              - '.github/workflows/test.yml'
            frontend:
              - 'frontend/**'
              - '!frontend/**/*.md'
            backend-test-infra:
              - 'scripts/backend-affected-packages.sh'
              - 'scripts/backend-affected-packages_test.sh'
              - 'scripts/backend-lint-packages.sh'
              - 'scripts/test-backend.sh'
              - 'scripts/backend-test-matrix.sh'
              - 'scripts/backend-test-matrix_test.sh'
              - 'scripts/test-changed.sh'
              - 'scripts/test-changed_test.sh'
              - 'scripts/test-run-id.sh'
              - 'scripts/go-package-workers.sh'
              - 'scripts/total-memory-gb.sh'
            frontend-test-infra:
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'frontend/tsconfig.json'
              - 'frontend/vitest.config.ts'
              - 'frontend/src/test/setup.ts'
              - 'scripts/test-changed.sh'
            # The workflows that run on pull requests. Each one reruns the
            # jobs it defines in full; see the outputs above.
            workflow-main:
              - '.github/workflows/main.yml'
            workflow-test:
              - '.github/workflows/test.yml'
            workflow-lint:
              - '.github/workflows/lint.yml'
            # Shared with pre-push; CI calls them from the lint jobs.
            quality-scripts:
              - 'scripts/check-quality.sh'
              - 'scripts/check-backend-quality.sh'
              - 'scripts/check-frontend-quality.sh'
              - 'scripts/quality-timing.sh'
            # Local developer tooling: Git hooks and the native dev loop. CI
            # never runs them; the script suites and the toolchain ratchet are
            # the only checks that read these files.
            hooks:
              - 'lefthook.yml'
              - 'scripts/pre-push*'
              - 'scripts/check-secrets.sh'
              - 'scripts/run-go-toolchain.sh'
              - 'scripts/dev-native*'
            # Release, deploy and demo tooling and the workflow files the
            # script suites read. None of it feeds the test or lint suites.
            tooling:
              - 'scripts/check-release-architecture*'
              - 'scripts/check-migration-evidence*'
              - 'scripts/release-backup*'
              - 'scripts/demo-environment.test.mjs'
              - 'scripts/report-sentry-deploy*'
              - 'scripts/posthog-dashboards*'
              - 'scripts/create-demo-env.py'
              - 'scripts/test-support/release-docker.mjs'
              - 'scripts/deploy-remote.sh'
              - 'scripts/rollback-remote.sh'
              - 'scripts/restore-db.sh'
              - '.github/**'
              - 'environments/**'
              - '.env.example'
              - 'package.json'
            # Script suites without another trigger (#4436). Each runs when its
            # script or suite changes; the runner guard reruns when a test
            # file or a Playwright config appears or moves.
            script-tests:
              - 'monitoring/student-contract/**'
              - 'scripts/student-contract-monitor.test.mjs'
              - 'scripts/runtime-checkpoint-*.py'
              - 'scripts/runtime_checkpoint_*_test.py'
              - 'scripts/check-agent-context*'
              - 'scripts/check-test-runners*'
              - '**/*.test.{js,cjs,mjs,ts,cts,mts}'
              - '**/*_test.py'
              - '**/*_test.sh'
              - 'frontend/e2e/**'
              - 'frontend/playwright*.config.ts'
              # Vitest discovers these by glob; the guard skips them.
              - '!frontend/src/**'
              - '!frontend/scripts/**'
            # Inputs of TestToolchainPinsRatchet. Changed-test selection adds
            # ./test only for backend changes, so ci-scripts runs the
            # ratchets for these files instead of the full backend suite.
            toolchain:
              - 'lefthook.yml'
              - 'scripts/pre-push.sh'
              - 'scripts/run-go-toolchain.sh'
              - '.claude/hooks/format-go.sh'
              - '.github/workflows/**'
              - 'devbox.json'
              - 'devbox.lock'
              - 'package.json'
              - 'frontend/package.json'
              - 'backend/Dockerfile'
              - 'backend/Dockerfile.dev'
              - 'backend/tools/go.mod'
              - 'scripts/backend-architecture/go.mod'
            env:
              - 'environments/**'
              - '.env.example'
              - 'docker-compose*.yml'
              - 'devbox.json'
              - 'devbox.lock'
              - 'package.json'
              - 'frontend/package.json'
              - 'frontend/src/**'
              - 'backend/cmd/**'
              - '.github/workflows/**'
              - 'scripts/env-check.sh'
              - 'scripts/check-runtime-env.py'
            error-codes:
              - 'error-registry.json'
              - 'scripts/generate-error-codes*'
              - 'backend/api/common/error_codes.generated.go'
              - 'frontend/src/lib/error-codes.generated.ts'
              - '.github/workflows/lint.yml'

      # A large refactor must not squeeze almost the whole suite through the
      # affected-only runner. This cheap file-list check also avoids a serial
      # Go planning job for changes that are already obviously broad.
      - name: Size backend test scope
        id: backend-size
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.backend-tests_files }}
        run: |
          : "${CHANGED_FILES:?changed-file list is required}"
          full=$(jq 'any(.[]; . == "backend/go.mod" or . == "backend/go.sum") or
            (map(select(endswith(".go")) | split("/")[:-1] | join("/")) | unique | length >= 64)' <<< "$CHANGED_FILES")
          echo "full=$full" >> "$GITHUB_OUTPUT"

  ci-scripts:
    name: CI and release script suites (${{ matrix.suite }})
    needs: detect-changes
    if: needs.detect-changes.outputs.run-ci-scripts == 'true'
    strategy:
      fail-fast: false
      matrix:
        # These suites have separate fixtures and no ordering dependency.
        # Keep the existing path selection without buying unused runners.
        suite: >-
          ${{ fromJSON(
            needs.detect-changes.outputs.tooling-changed == 'true' && needs.detect-changes.outputs.toolchain-changed == 'true' && '["unit","restore","ratchets"]'
            || needs.detect-changes.outputs.tooling-changed == 'true' && '["unit","restore"]'
            || needs.detect-changes.outputs.toolchain-changed == 'true' && '["unit","ratchets"]'
            || '["unit"]'
          ) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch source ratchet comparison ref
        if: matrix.suite == 'ratchets'
        run: git fetch --no-tags --depth=1 origin development:refs/remotes/origin/development

      - name: Verify pre-push failure and selection behavior
        if: matrix.suite == 'unit'
        run: node --test scripts/pre-push.test.mjs scripts/dev-native.test.mjs scripts/check-release-architecture.test.mjs scripts/check-migration-evidence.test.mjs scripts/release-backup.test.mjs scripts/demo-environment.test.mjs scripts/report-sentry-deploy.test.mjs scripts/posthog-dashboards.test.mjs

      - name: Verify repository script suites
        if: matrix.suite == 'unit'
        run: |
          node --test scripts/student-contract-monitor.test.mjs scripts/check-agent-context.test.mjs scripts/check-test-runners.test.mjs
          python3 -m unittest scripts/runtime_checkpoint_compare_test.py scripts/runtime_checkpoint_report_test.py

      # Lists test files that no workflow runs (#4436).
      - name: Check every test file has a CI runner
        if: matrix.suite == 'unit'
        run: node scripts/check-test-runners.mjs

      - name: Verify complete release restore with PostgreSQL
        if: matrix.suite == 'restore'
        run: node --test scripts/release-backup.integration.test.mjs

      # TestToolchainPinsRatchet reads the files of the toolchain filter.
      # Changed-test selection adds ./test only for backend changes, so such a
      # change runs the ratchets here instead of the full backend suite.
      - name: Setup Go with cache
        if: matrix.suite == 'ratchets'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify source ratchets
        if: matrix.suite == 'ratchets'
        working-directory: backend
        run: go test -tags=testhooks -count=1 -run Ratchet ./test

      # The selector suite also pins contracts in main.yml and lint.yml. A
      # lint.yml-only change does not start test-backend, which runs it too.
      - name: Verify workflow selection contracts
        if: matrix.suite == 'ratchets'
        run: scripts/backend-affected-packages_test.sh

  lint:
    permissions:
      contents: read
    needs: detect-changes
    uses: ./.github/workflows/lint.yml
    with:
      run-backend: ${{ needs.detect-changes.outputs.run-backend-lint == 'true' }}
      full-backend: ${{ needs.detect-changes.outputs.full-backend-lint == 'true' }}
      run-frontend: ${{ needs.detect-changes.outputs.run-frontend-lint == 'true' }}
      run-error-codes: ${{ needs.detect-changes.outputs.run-error-codes == 'true' }}

  backend-architecture-ratchet:
    name: Backend architecture ratchet
    # Protected-branch pushes and release pull requests always check. Other
    # pull requests check only when backend or architecture files changed.
    # Draft PRs need no guard here: detect-changes skips, and this job skips
    # with it.
    if: >-
      github.event_name == 'push'
      || needs.detect-changes.outputs.run-backend-architecture == 'true'
    needs: detect-changes
    # Standard runners are free for this public repository. Blacksmith minutes
    # go to the test suites, which set the pull request's wall-clock time.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ratchets need historical source blobs, not unrelated refs/tags.
          fetch-depth: 1
      - name: Fetch architecture comparison history
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          refs=("$(git rev-parse HEAD)" "+refs/heads/development:refs/remotes/origin/development")
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != development ]; then
            refs+=("+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF")
          fi
          if [ -n "$BASE_SHA" ] && [[ ! "$BASE_SHA" =~ ^0+$ ]]; then
            refs+=("$BASE_SHA")
          fi
          git fetch --no-tags --unshallow origin "${refs[@]}"
      - name: Setup Go with cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          # The development cache build.yml saves under this key. The
          # architecture module pins the same golang.org/x versions.
          cache-dependency-path: backend/go.sum
      - name: Check deterministic architecture ratchet
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CUTOVER_BASE_SHA: 1c66eb9233fb398b186420b4ffb36004a8a83c6c
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$BASE_REF" == "main" && "$HEAD_REF" == "development" && "$HEAD_REPO" == "$REPOSITORY" ]]; then
              node scripts/check-release-architecture.mjs
            elif git cat-file -e "$BASE_SHA:backend/architecture/legacy.jsonl" 2>/dev/null; then
              scripts/backend-architecture.sh check --base-ref "$BASE_SHA"
            elif [[ "$BASE_SHA" == "$CUTOVER_BASE_SHA" ]]; then
              # The baseline cannot exist in the base commit that introduces it.
              # Restrict this one-time bootstrap to graph-neutral cutover files.
              unexpected=$(git diff --name-only "$BASE_SHA"...HEAD -- backend | grep -Ev '^backend/(\.go-arch-lint\.yml|README\.md|architecture/(README\.md|legacy\.jsonl)|internal/architecture/cli_test\.go|tools/go\.(mod|sum))$' || true)
              if [[ -n "$unexpected" ]]; then
                echo "Unexpected backend changes in architecture-ratchet cutover:"
                echo "$unexpected"
                exit 1
              fi
              scripts/backend-architecture.sh check
            else
              echo "Base commit $BASE_SHA has no architecture baseline; rebase onto the cutover."
              exit 1
            fi
          else
            scripts/backend-architecture.sh check
          fi
      - name: Validate migration evidence and retirement coverage
        # The validator discovers every architecture JSON except the named
        # policy, composition, checkpoint registry and contract-active-2737-progress.json
        # documents. The progress file is historical notes, not cutover evidence.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-migration-evidence.mjs
      - name: Generate and validate current architecture projections
        run: |
          output_directory=$(mktemp -d)
          cleanup() {
            rm -rf -- "$output_directory"
          }
          trap cleanup EXIT

          scripts/backend-architecture.sh diagram --output "$output_directory"
          scripts/backend-architecture.sh dependencies \
            --focus module:architecture-check \
            --output "$output_directory"

          for artifact in architecture.json go-arch-lint.yml dependencies.json dependencies.goda; do
            test -s "$output_directory/$artifact"
          done
          python3 - \
            "$output_directory/target.svg" \
            "$output_directory/migration.svg" \
            "$output_directory/dependencies.svg" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          svg_tag = "{http://www.w3.org/2000/svg}svg"
          for filename in sys.argv[1:]:
              root = ET.parse(filename).getroot()
              if root.tag != svg_tag:
                  raise SystemExit(
                      f"{filename}: root element is {root.tag}, expected {svg_tag}"
                  )
          PY
      - name: Audit open migration issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/backend-architecture.sh audit-issues --api-url "$GITHUB_API_URL"

  test:
    permissions:
      contents: read
      checks: write
    needs: detect-changes
    uses: ./.github/workflows/test.yml
    with:
      run-backend: ${{ needs.detect-changes.outputs.run-backend == 'true' }}
      run-frontend: ${{ needs.detect-changes.outputs.run-frontend == 'true' }}
      run-seed-smoke: ${{ needs.detect-changes.outputs.run-seed-smoke == 'true' }}
      changed-scope: ${{ needs.detect-changes.outputs.changed-scope == 'true' }}
      base_ref: ${{ needs.detect-changes.outputs.base-ref }}
      full-backend-suite: ${{ needs.detect-changes.outputs.full-backend-suite == 'true' }}
      full-frontend-suite: ${{ needs.detect-changes.outputs.full-frontend-suite == 'true' }}

  # Verify all environments have matching env var keys (no secrets needed)
  env-sync-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.run-env-check == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check environment key sync
        run: ./scripts/env-check.sh
      - name: Check pinned pnpm contract
        run: |
          expected=$(jq -r '[.packages[] | select(startswith("pnpm_10@"))] | if length == 1 then .[0] | split("@")[1] else empty end' devbox.json)
          if [[ -z "$expected" ]]; then
            echo "::error file=devbox.json::Expected exactly one pnpm_10@<version> package"
            exit 1
          fi
          locked=$(jq -r --arg package "pnpm_10@$expected" '.packages[$package].version // empty' devbox.lock)
          if [[ "$locked" != "$expected" ]]; then
            echo "::error file=devbox.lock::pnpm lock version $locked does not match Devbox pin $expected"
            exit 1
          fi
          for manifest in package.json frontend/package.json; do
            actual=$(jq -r '(.packageManager // "") | if startswith("pnpm@") then sub("^pnpm@"; "") | split("+")[0] else empty end' "$manifest")
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$manifest::packageManager version $actual does not match Devbox pin $expected"
              exit 1
            fi
          done
      - name: Block unencrypted secrets
        run: |
          failed=false
          for f in environments/*.sops.env; do
            [ -f "$f" ] || continue
            # Check 1: file must have SOPS metadata
            if ! grep -q '^sops_version=' "$f"; then
              echo "::error file=$f::UNENCRYPTED file! Run: sops encrypt --in-place $f"
              failed=true
              continue
            fi
            # Check 2: no non-empty values without ENC[ wrapper
            # Matches KEY=<something> where <something> is not empty and not ENC[
            while IFS= read -r line; do
              echo "::error file=$f::Plaintext value detected: ${line%%=*}= — re-encrypt with: sops encrypt --in-place $f"
              failed=true
            done < <(grep -E '^[A-Za-z_][A-Za-z0-9_]*=.+' "$f" | grep -v 'ENC\[' | grep -v '^sops_')
          done
          if [ "$failed" = true ]; then
            exit 1
          fi
          echo "All .sops.env files are encrypted"

  ci-gate:
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [detect-changes, ci-scripts, lint, test, backend-architecture-ratchet, env-sync-check]
    runs-on: ubuntu-latest
    steps:
      - name: Reject skipped mandatory checks
        env:
          ARCHITECTURE_REQUIRED: ${{ needs.detect-changes.outputs.run-backend-architecture }}
          BACKEND_LINT_REQUIRED: ${{ needs.detect-changes.outputs.run-backend-lint }}
          FRONTEND_LINT_REQUIRED: ${{ needs.detect-changes.outputs.run-frontend-lint }}
          BACKEND_TEST_REQUIRED: ${{ needs.detect-changes.outputs.run-backend }}
          FRONTEND_TEST_REQUIRED: ${{ needs.detect-changes.outputs.run-frontend }}
          SEED_SMOKE_REQUIRED: ${{ needs.detect-changes.outputs.run-seed-smoke }}
          CI_SCRIPTS_REQUIRED: ${{ needs.detect-changes.outputs.run-ci-scripts }}
          ENV_CHECK_REQUIRED: ${{ needs.detect-changes.outputs.run-env-check }}
          ERROR_CODES_REQUIRED: ${{ needs.detect-changes.outputs.run-error-codes }}
          CI_SCRIPTS_RESULT: ${{ needs.ci-scripts.result }}
          ENV_CHECK_RESULT: ${{ needs.env-sync-check.result }}
          ARCHITECTURE_RESULT: ${{ needs.backend-architecture-ratchet.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$ARCHITECTURE_REQUIRED" == true && "$ARCHITECTURE_RESULT" == skipped ]] ||
             [[ ( "$BACKEND_LINT_REQUIRED" == true || "$FRONTEND_LINT_REQUIRED" == true || "$ERROR_CODES_REQUIRED" == true ) && "$LINT_RESULT" == skipped ]] ||
             [[ ( "$BACKEND_TEST_REQUIRED" == true || "$FRONTEND_TEST_REQUIRED" == true || "$SEED_SMOKE_REQUIRED" == true ) && "$TEST_RESULT" == skipped ]] ||
             [[ "$CI_SCRIPTS_REQUIRED" == true && "$CI_SCRIPTS_RESULT" == skipped ]] ||
             [[ "$ENV_CHECK_REQUIRED" == true && "$ENV_CHECK_RESULT" == skipped ]]; then
            echo "A mandatory check was skipped (architecture=$ARCHITECTURE_RESULT, lint=$LINT_RESULT, test=$TEST_RESULT, ci-scripts=$CI_SCRIPTS_RESULT, env=$ENV_CHECK_RESULT)"
            exit 1
          fi
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, test, backend-architecture-ratchet, ci-scripts, env-sync-check
