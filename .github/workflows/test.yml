name: Test & Coverage

on:
  workflow_call:
    inputs:
      run-backend:
        type: boolean
        default: true
      run-frontend:
        type: boolean
        default: true
      is-pr:
        type: boolean
        default: false
      base_ref:
        type: string
        default: ""
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud authentication token"
        required: true

defaults:
  run:
    shell: bash

jobs:
  test-backend:
    if: ${{ inputs.run-backend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      checks: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phoenix_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: Europe/Berlin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run database migrations
        working-directory: backend
        env:
          DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_test?sslmode=disable
          PHOENIX_AUTH_PASSWORD: phoenix_auth_ci
        run: go run main.go migrate

      - name: Run Go tests
        working-directory: backend
        env:
          TEST_DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_test?sslmode=disable
        run: |
          gotestsum \
            --format pkgname-and-test-fails \
            --junitfile junit.xml \
            --rerun-fails \
            --rerun-fails-max-failures=5 \
            --rerun-fails-report rerun-fails.json \
            --packages="./..." \
            -- \
            -coverpkg=./... \
            -covermode=atomic \
            -coverprofile=coverage.out

      - name: Regenerate full Go coverage
        working-directory: backend
        env:
          TEST_DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_test?sslmode=disable
          BASE_REF: ${{ inputs.base_ref }}
          IS_PR: ${{ inputs.is-pr }}
        run: |
          echo "Regenerating full coverage for SonarCloud"
          cp coverage.out coverage.gotestsum.out
          if ! go test ./... -coverpkg=./... -covermode=atomic -coverprofile=coverage.out; then
            echo "Coverage regeneration failed; retrying once"
            if ! go test ./... -coverpkg=./... -covermode=atomic -coverprofile=coverage.out; then
              echo "Coverage regeneration failed after retry; keeping gotestsum coverage.out"
              mv coverage.gotestsum.out coverage.out
            fi
          fi
          if [ "${IS_PR}" = "true" ] && [ -n "${BASE_REF}" ]; then
            changed_packages="$(git diff --name-only "origin/${BASE_REF}"...HEAD -- '*.go' \
              | grep '^backend/' \
              | grep -v '_test.go$' \
              | grep -v '^backend/api/' \
              | xargs -r -n1 dirname \
              | sed 's|^backend|.|' \
              | sort -u \
              | tr '\n' ' ')"
            if [ -n "${changed_packages}" ]; then
              echo "Appending targeted coverage for changed backend packages: ${changed_packages}"
              if go test ${changed_packages} -coverpkg=./... -covermode=atomic -coverprofile=coverage.changed.out; then
                tail -n +2 coverage.changed.out >> coverage.out
                rm -f coverage.changed.out
              else
                echo "Targeted changed-package coverage failed; keeping existing coverage.out"
              fi
            fi
          fi
          if [ "${IS_PR}" = "true" ]; then
            echo "Appending deterministic coverage for OGS settings access paths"
            if go test ./auth/authorize ./services/config ./services/config/defaults \
              -run 'TestResolveOGSGroupsEnabled|TestResolveStudentDataScope|TestCanReadStudent|TestOGSGroupsEnabledSetting|TestDefaultRegistry' \
              -coverpkg=./... \
              -covermode=atomic \
              -coverprofile=coverage.ogs.out; then
              tail -n +2 coverage.ogs.out >> coverage.out
              rm -f coverage.ogs.out
            else
              echo "OGS settings access coverage failed; keeping existing coverage.out"
            fi
          fi
          rm -f coverage.gotestsum.out

      - name: Drop flaky retries from junit.xml
        working-directory: backend
        if: always()
        run: |
          if [ ! -f junit.xml ]; then
            echo "junit.xml not found, skipping dedupe"
            exit 0
          fi
          python3 - <<'PYEOF'
          import sys
          import xml.etree.ElementTree as ET

          # gotestsum --rerun-fails records every attempt of a retried test as a
          # separate <testcase> with the same (classname, name). The first (failed)
          # entry stays in junit.xml even after a passing rerun, so the JUnit
          # reporter check goes red despite gotestsum exiting 0. This step keeps
          # only the latest non-failed entry per test, matching the job's exit
          # code semantics.
          tree = ET.parse("junit.xml")
          root = tree.getroot()
          seen = {}
          removed = 0
          for ts in root.iter("testsuite"):
              for tc in list(ts.findall("testcase")):
                  key = (tc.get("classname"), tc.get("name"))
                  cur_failed = tc.find("failure") is not None or tc.find("error") is not None
                  prev = seen.get(key)
                  if prev is None:
                      seen[key] = (ts, tc)
                      continue
                  prev_ts, prev_tc = prev
                  prev_failed = prev_tc.find("failure") is not None or prev_tc.find("error") is not None
                  if prev_failed and not cur_failed:
                      prev_ts.remove(prev_tc)
                      seen[key] = (ts, tc)
                  else:
                      ts.remove(tc)
                  removed += 1

          # Refresh testsuite-level counters so they match the surviving testcases.
          for ts in root.iter("testsuite"):
              cases = ts.findall("testcase")
              ts.set("tests", str(len(cases)))
              ts.set("failures", str(sum(1 for tc in cases if tc.find("failure") is not None)))
              ts.set("errors", str(sum(1 for tc in cases if tc.find("error") is not None)))

          tree.write("junit.xml", xml_declaration=True, encoding="utf-8")
          print(f"Removed {removed} duplicate <testcase> entries from junit.xml", file=sys.stderr)
          PYEOF

      - name: Fix Go coverage paths for SonarCloud
        if: ${{ always() && hashFiles('backend/coverage.out') != '' }}
        run: |
          # Transform Go module paths to relative paths
          # From: github.com/moto-nrw/project-phoenix/... → backend/...
          sed -i 's|github.com/moto-nrw/project-phoenix/|backend/|g' backend/coverage.out

      - name: Upload backend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-backend
          path: |
            backend/coverage.out
            backend/junit.xml
          retention-days: 7
        if: always()

      - name: Publish backend test results
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: always()
        with:
          report_paths: backend/junit.xml
          check_name: Backend Test Results
          include_passed: false
          detailed_summary: true

  test-frontend:
    if: ${{ inputs.run-frontend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run changed frontend tests with coverage
        if: ${{ inputs.is-pr && inputs.base_ref != '' }}
        working-directory: frontend
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: pnpm vitest run --changed "origin/${BASE_REF}" --coverage

      - name: Run full frontend tests with coverage
        if: ${{ !inputs.is-pr || inputs.base_ref == '' }}
        working-directory: frontend
        run: pnpm run test:run --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          retention-days: 7
        if: always()

  sonarcloud:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    needs: [test-backend, test-frontend]
    if: ${{ always() && (inputs.run-backend || inputs.run-frontend) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # Required for SonarCloud PR analysis and SCM blame

      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-backend
          path: backend/
        continue-on-error: true

      - name: Download frontend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-frontend
          path: frontend/coverage/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
