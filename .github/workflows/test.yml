name: Test & Coverage

on:
  workflow_call:
    inputs:
      run-backend:
        type: boolean
        default: true
      run-frontend:
        type: boolean
        default: true
      is-pr:
        type: boolean
        default: false
      base_ref:
        type: string
        default: ""

defaults:
  run:
    shell: bash

jobs:
  test-backend:
    if: ${{ inputs.run-backend }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
      checks: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phoenix_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: Europe/Berlin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Restore migrated DB snapshot
        id: db-snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.db-snapshot
          # pg17: bump manually when the postgres service image major version
          # changes. No restore-keys on purpose — a stale snapshot must never
          # be restored; a miss only costs the ~25s migrate path below.
          key: db-snapshot-pg17-${{ hashFiles('backend/database/migrations/*.go', 'backend/cmd/migrate.go') }}

      - name: Restore database from snapshot
        if: steps.db-snapshot.outputs.cache-hit == 'true'
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PHOENIX_AUTH_PASSWORD: phoenix_auth_test
        run: |
          # pg_dump omits global objects (roles, ALTER ROLE ... SET). Recreate
          # them exactly as migration 001014001_create_tenant_roles.go does,
          # BEFORE restoring the dump — it contains GRANTs and RLS policies
          # referencing these roles. If a future migration adds a role, update
          # this block too; drift fails loudly (ON_ERROR_STOP on the restore),
          # never silently, because new migrations also change the cache key.
          # Everything runs inside the postgres:17 service container: the
          # local socket is trust-auth and the runner's psql is v16, which
          # refuses a v17 server.
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d phoenix_test <<EOF
          CREATE ROLE phoenix_auth LOGIN NOINHERIT PASSWORD '${PHOENIX_AUTH_PASSWORD}';
          CREATE ROLE phoenix_tenant NOLOGIN;
          CREATE ROLE phoenix_admin NOLOGIN BYPASSRLS;
          GRANT phoenix_tenant TO phoenix_auth;
          GRANT phoenix_admin TO phoenix_auth;
          ALTER ROLE phoenix_auth SET search_path TO public, platform;
          EOF
          docker exec -i "$PG_CONTAINER" psql -q -v ON_ERROR_STOP=1 -U postgres -d phoenix_test \
            < backend/.db-snapshot/dump.sql

      - name: Run database migrations
        if: steps.db-snapshot.outputs.cache-hit != 'true'
        working-directory: backend
        env:
          DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_test?sslmode=disable
          PHOENIX_AUTH_PASSWORD: phoenix_auth_test
        run: go run main.go migrate

      - name: Dump migrated database for snapshot cache
        if: steps.db-snapshot.outputs.cache-hit != 'true'
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # pg_dump must come from the service container (runner ships v16,
          # which refuses newer servers). The dump includes bun_migrations, so
          # a restored DB needs no migrate pass. Roles are NOT in the dump —
          # the restore step recreates them.
          mkdir -p backend/.db-snapshot
          docker exec -i "$PG_CONTAINER" pg_dump -U postgres phoenix_test \
            > backend/.db-snapshot/dump.sql

      - name: Run Go tests with coverage
        working-directory: backend
        env:
          TEST_DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_test?sslmode=disable
          # The route-table golden builds the production API, whose serve
          # connection uses the role created above with this password. The
          # value must stay identical to testdb.AuthRolePassword — the test
          # lifecycle pins the cluster-global phoenix_auth role to it.
          PHOENIX_AUTH_PASSWORD: phoenix_auth_test
          # Dummy 32+ char secret so services.NewFactory can init the MFA
          # service in tests. NewFactory hard-fails without it (the secret
          # is the HMAC key for trusted-device cookies). Production and
          # staging supply this via SOPS; CI tests get a fixed test value.
          AUTH_JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
          FRONTEND_URL: http://localhost:3000
          PARENTS_URL: http://parents.localhost:3000
          NEXT_PUBLIC_OPERATOR_HOSTNAME: operator.localhost:3000
          TENANT_DOMAIN: localhost
        # Single pass produces junit.xml AND coverage.out. No --rerun-fails:
        # gotestsum reruns overwrite the coverage profile (upstream issue;
        # fix PR unmerged), and flaky tests should fail loudly, not retry.
        # gotestsum is a go.mod tool directive, so its whole dependency
        # graph is locked by go.sum (sonar githubactions:S8545).
        run: |
          # -p/-parallel are pinned, not left at GOMAXPROCS: `go test` runs
          # -p package binaries at once and each opens (-parallel + headroom)
          # connections plus a keeper. 4 x 13 = 52 fits the 100 connections a
          # stock postgres:17 service container allows.
          # scripts/test-backend.sh owns these numbers — change them there
          # first, then mirror. CI cannot call the wrapper: it needs the
          # coverage flags and does its own DB snapshot restore.
          go tool gotestsum \
            --format pkgname-and-test-fails \
            --junitfile junit.xml \
            -- -p 4 -parallel 8 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Fix Go coverage paths for SonarCloud
        if: ${{ always() && hashFiles('backend/coverage.out') != '' }}
        run: |
          # Transform Go module paths to relative paths
          # From: github.com/moto-nrw/project-phoenix/... → backend/...
          sed -i 's|github.com/moto-nrw/project-phoenix/|backend/|g' backend/coverage.out
          python3 - <<'PYEOF'
          from collections import OrderedDict

          source = "backend/coverage.out"
          merged = OrderedDict()

          with open(source, encoding="utf-8") as fh:
              mode = fh.readline()
              for raw in fh:
                  line = raw.strip()
                  if not line:
                      continue
                  location, statements, count = line.rsplit(" ", 2)
                  key = (location, statements)
                  merged[key] = merged.get(key, 0) + int(count)

          with open(source, "w", encoding="utf-8") as fh:
              fh.write(mode)
              for (location, statements), count in merged.items():
                  fh.write(f"{location} {statements} {count}\n")
          PYEOF

      - name: Upload backend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-backend
          path: |
            backend/coverage.out
            backend/junit.xml
          retention-days: 7
        if: always()

      - name: Publish backend test results
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always()
        with:
          report_paths: backend/junit.xml
          check_name: Backend Test Results
          include_passed: false
          detailed_summary: true

  test-frontend:
    if: ${{ inputs.run-frontend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run changed frontend tests with coverage
        if: ${{ inputs.is-pr && inputs.base_ref != '' }}
        working-directory: frontend
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: pnpm vitest run --changed "origin/${BASE_REF}" --coverage

      - name: Run full frontend tests with coverage
        if: ${{ !inputs.is-pr || inputs.base_ref == '' }}
        working-directory: frontend
        run: pnpm run test:run --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          retention-days: 7
        if: always()
