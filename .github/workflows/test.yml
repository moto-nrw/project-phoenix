name: Test & Coverage

on:
  workflow_call:
    inputs:
      run-backend:
        type: boolean
        default: true
      run-frontend:
        type: boolean
        default: true
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud authentication token"
        required: true

defaults:
  run:
    shell: bash

jobs:
  test-backend:
    if: ${{ inputs.run-backend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      checks: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phoenix_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: Europe/Berlin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run database migrations
        working-directory: backend
        env:
          DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_test?sslmode=disable
          PHOENIX_AUTH_PASSWORD: phoenix_auth_ci
        run: go run main.go migrate

      - name: Run Go tests with coverage
        working-directory: backend
        env:
          TEST_DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_test?sslmode=disable
        run: |
          gotestsum \
            --format pkgname-and-test-fails \
            --junitfile junit.xml \
            --rerun-fails \
            --rerun-fails-max-failures=5 \
            --packages="./..." \
            -- \
            -coverprofile=coverage.out \
            -covermode=atomic

      - name: Fix Go coverage paths for SonarCloud
        run: |
          # Transform Go module paths to relative paths
          # From: github.com/moto-nrw/project-phoenix/... → backend/...
          sed -i 's|github.com/moto-nrw/project-phoenix/|backend/|g' backend/coverage.out

      - name: Upload backend coverage
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-backend
          path: |
            backend/coverage.out
            backend/junit.xml
          retention-days: 7
        if: always()

      - name: Publish backend test results
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6.4.0
        if: always()
        with:
          report_paths: backend/junit.xml
          check_name: Backend Test Results
          include_passed: false
          detailed_summary: true

  test-frontend:
    if: ${{ inputs.run-frontend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: pnpm run test:run --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          retention-days: 7
        if: always()

  sonarcloud:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    needs: [test-backend, test-frontend]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # Required for SonarCloud PR analysis and SCM blame

      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-backend
          path: backend/
        continue-on-error: true

      - name: Download frontend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-frontend
          path: frontend/coverage/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
