name: Test & Coverage

on:
  workflow_call:
    inputs:
      run-backend:
        type: boolean
        default: true
      run-frontend:
        type: boolean
        default: true
      run-seed-smoke:
        type: boolean
        required: true
      is-pr:
        type: boolean
        default: false
      base_ref:
        type: string
        default: ""
      full-backend-suite:
        type: boolean
        required: true
      full-frontend-suite:
        type: boolean
        required: true

defaults:
  run:
    shell: bash

jobs:
  test-backend:
    if: ${{ inputs.run-backend }}
    # PRs run only affected packages without coverage; four vCPUs avoid paying
    # the 8-vCPU rate for that smaller workload. Protected-branch pushes keep
    # eight vCPUs for the full instrumented suite consumed by SonarCloud.
    runs-on: ${{ inputs.is-pr && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-8vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      checks: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phoenix_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: Europe/Berlin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR test selection needs origin/<base_ref>. Keeping one checkout
          # shape for both event types avoids an untested expression branch.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Test affected-package selection
        run: scripts/backend-affected-packages_test.sh

      - name: Restore migrated DB snapshot
        id: db-snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.db-snapshot
          # pg17: bump manually when the postgres service image major version
          # changes. No restore-keys on purpose — a stale snapshot must never
          # be restored; a miss only costs the ~25s migrate path below.
          key: db-snapshot-pg17-${{ hashFiles('backend/database/migrations/*.go', 'backend/cmd/migrate.go') }}

      - name: Restore database from snapshot
        if: steps.db-snapshot.outputs.cache-hit == 'true'
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PHOENIX_AUTH_PASSWORD: phoenix_auth_test
        run: |
          # pg_dump omits global objects (roles, ALTER ROLE ... SET). Recreate
          # them exactly as migration 001014001_create_tenant_roles.go does,
          # BEFORE restoring the dump — it contains GRANTs and RLS policies
          # referencing these roles. If a future migration adds a role, update
          # this block too; drift fails loudly (ON_ERROR_STOP on the restore),
          # never silently, because new migrations also change the cache key.
          # Everything runs inside the postgres:17 service container: the
          # local socket is trust-auth and the runner's psql is v16, which
          # refuses a v17 server.
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d phoenix_test <<EOF
          CREATE ROLE phoenix_auth LOGIN NOINHERIT PASSWORD '${PHOENIX_AUTH_PASSWORD}';
          CREATE ROLE phoenix_tenant NOLOGIN;
          CREATE ROLE phoenix_admin NOLOGIN BYPASSRLS;
          GRANT phoenix_tenant TO phoenix_auth;
          GRANT phoenix_admin TO phoenix_auth;
          ALTER ROLE phoenix_auth SET search_path TO public, platform;
          EOF
          docker exec -i "$PG_CONTAINER" psql -q -v ON_ERROR_STOP=1 -U postgres -d phoenix_test \
            < backend/.db-snapshot/dump.sql

      - name: Run database migrations
        if: steps.db-snapshot.outputs.cache-hit != 'true'
        working-directory: backend
        env:
          DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_test?sslmode=disable
          PHOENIX_AUTH_PASSWORD: phoenix_auth_test
        run: go run main.go migrate

      - name: Dump migrated database for snapshot cache
        if: steps.db-snapshot.outputs.cache-hit != 'true'
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # pg_dump must come from the service container (runner ships v16,
          # which refuses newer servers). The dump includes bun_migrations, so
          # a restored DB needs no migrate pass. Roles are NOT in the dump —
          # the restore step recreates them.
          mkdir -p backend/.db-snapshot
          docker exec -i "$PG_CONTAINER" pg_dump -U postgres phoenix_test \
            > backend/.db-snapshot/dump.sql

      - name: Run Go tests
        working-directory: backend
        env:
          TEST_DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_test?sslmode=disable
          # The route-table golden builds the production API, whose serve
          # connection uses the role created above with this password. The
          # value must stay identical to testdb.AuthRolePassword — the test
          # lifecycle pins the cluster-global phoenix_auth role to it.
          PHOENIX_AUTH_PASSWORD: phoenix_auth_test
          # Dummy 32+ char secret so services.NewFactory can init the MFA
          # service in tests. NewFactory hard-fails without it (the secret
          # is the HMAC key for trusted-device cookies). Production and
          # staging supply this via SOPS; CI tests get a fixed test value.
          AUTH_JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
          FRONTEND_URL: http://localhost:3000
          PARENTS_URL: http://parents.localhost:3000
          SCHOOL_URL: http://schule.localhost:3000
          NEXT_PUBLIC_OPERATOR_HOSTNAME: operator.localhost:3000
          TENANT_DOMAIN: localhost
          BASE_REF: ${{ inputs.base_ref }}
          FULL_SUITE: ${{ inputs.full-backend-suite }}
          IS_PR: ${{ inputs.is-pr }}
        run: |
          packages=(./...)
          if [ "$IS_PR" = true ] && [ "$FULL_SUITE" = false ] && [ -n "$BASE_REF" ]; then
            affected_output=$(../scripts/backend-affected-packages.sh "origin/$BASE_REF")
            packages=()
            while IFS= read -r package; do
              [ -n "$package" ] && packages+=("$package")
            done <<< "$affected_output"
            if [ "${#packages[@]}" -eq 0 ]; then
              echo "No changed Go packages"
              exit 0
            fi
            echo "Running ${#packages[@]} changed/affected Go packages"
          fi

          test_args=(-parallel 8)
          if [ "$IS_PR" = true ]; then
            test_args+=(-p 4)
          else
            # Coverage is consumed only by the post-merge SonarCloud job.
            # Keeping it off PRs avoids instrumenting every dependency and
            # merging a large profile that no PR job reads.
            test_args+=(-p 6 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out)
          fi

          # Single pass produces junit.xml and, on pushes, coverage.out. No
          # retries: flaky tests should fail loudly, not be hidden.
          go tool gotestsum --format pkgname-and-test-fails \
            --junitfile junit.xml -- "${test_args[@]}" "${packages[@]}"

      - name: Fix Go coverage paths for SonarCloud
        if: ${{ always() && hashFiles('backend/coverage.out') != '' }}
        run: |
          # Transform Go module paths to relative paths
          # From: github.com/moto-nrw/project-phoenix/... → backend/...
          sed -i 's|github.com/moto-nrw/project-phoenix/|backend/|g' backend/coverage.out
          python3 - <<'PYEOF'
          from collections import OrderedDict

          source = "backend/coverage.out"
          merged = OrderedDict()

          with open(source, encoding="utf-8") as fh:
              mode = fh.readline()
              for raw in fh:
                  line = raw.strip()
                  if not line:
                      continue
                  location, statements, count = line.rsplit(" ", 2)
                  key = (location, statements)
                  merged[key] = merged.get(key, 0) + int(count)

          with open(source, "w", encoding="utf-8") as fh:
              fh.write(mode)
              for (location, statements), count in merged.items():
                  fh.write(f"{location} {statements} {count}\n")
          PYEOF

      - name: Upload backend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-backend
          path: |
            backend/coverage.out
            backend/junit.xml
          retention-days: 7
        if: ${{ always() && ! inputs.is-pr && hashFiles('backend/coverage.out', 'backend/junit.xml') != '' }}

      - name: Publish backend test results
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: ${{ always() && hashFiles('backend/junit.xml') != '' }}
        with:
          report_paths: backend/junit.xml
          check_name: Backend Test Results
          include_passed: false
          detailed_summary: true

  test-frontend:
    if: ${{ inputs.run-frontend }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run changed frontend tests
        if: ${{ inputs.is-pr && ! inputs.full-frontend-suite && inputs.base_ref != '' }}
        working-directory: frontend
        run: pnpm vitest run --changed "origin/${{ inputs.base_ref }}"

      - name: Run full frontend tests
        if: ${{ inputs.is-pr && (inputs.full-frontend-suite || inputs.base_ref == '') }}
        working-directory: frontend
        run: pnpm run test:run

      - name: Run full frontend tests with coverage
        if: ${{ ! inputs.is-pr }}
        working-directory: frontend
        run: pnpm run test:run --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          retention-days: 7
        if: ${{ always() && hashFiles('frontend/coverage/lcov.info') != '' }}

  # The seeder is the widest end-to-end path in this repo: roughly a hundred
  # real API calls across auth, enrollment, parent portal, time tracking and
  # IoT. Until this job existed it ran nowhere automatically, so a tightened
  # request contract could break it unnoticed — a mandatory `reason` field on
  # the parent pickup-change endpoint did exactly that in July 2026 and only
  # surfaced a month later, when a developer seeded by hand.
  seed-smoke:
    name: Seed & simulate smoke
    if: ${{ inputs.run-seed-smoke }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phoenix_seed
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: Europe/Berlin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        # Operator login enrolls MFA and reads the code back out of mailpit's
        # REST API, so the seeder cannot authenticate without a mail sink.
        image: axllent/mailpit:v1.30
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_seed?sslmode=disable
      PHOENIX_AUTH_PASSWORD: phoenix_auth_test
      # validateServeConfig() in cmd/serve.go requires every one of these:
      # there are no fallback defaults anywhere in this codebase.
      PORT: "8080"
      APP_ENV: development
      LOG_LEVEL: info
      LOG_TEXTLOGGING: "true"
      AUTH_JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
      AUTH_JWT_EXPIRY: 15m
      AUTH_JWT_REFRESH_EXPIRY: 168h
      # Read by os.Getenv in migration 001011003, which creates the operator
      # account the seeder logs in with.
      OPERATOR_EMAIL: operator@example.com
      OPERATOR_PASSWORD: SeedSmoke1234%
      OPERATOR_DISPLAY_NAME: CI Operator
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: SeedSmoke1234%
      FRONTEND_URL: http://localhost:3000
      PARENTS_URL: http://parents.localhost:3000
      NEXT_PUBLIC_OPERATOR_HOSTNAME: operator.localhost:3000
      NEXT_PUBLIC_PARENTS_HOSTNAME: parents.localhost:3000
      TENANT_DOMAIN: localhost
      # api/server.go refuses to build the server without it.
      METRICS_BEARER_TOKEN: ci-metrics-token
      # No tenant override exists on a fresh seed, so device auth falls back to
      # this env var. It must match the seeder's --pin, or every RFID call in
      # the simulation returns 401.
      OGS_DEVICE_PIN: "1234"
      EMAIL_SMTP_HOST: localhost
      EMAIL_SMTP_PORT: 1025
      EMAIL_FROM_ADDRESS: noreply@localhost
      EMAIL_FROM_NAME: moto CI
      MAILPIT_URL: http://localhost:8025
      # The schedulers would mutate seeded rows behind the coverage check.
      CLEANUP_SCHEDULER_ENABLED: "false"
      SESSION_END_SCHEDULER_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build backend binary
        working-directory: backend
        run: go build -o "${RUNNER_TEMP}/phoenix" .

      - name: Run migrations
        working-directory: backend
        run: |
          "${RUNNER_TEMP}/phoenix" migrate

      - name: Start server
        working-directory: backend
        run: |
          "${RUNNER_TEMP}/phoenix" serve > "${RUNNER_TEMP}/server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/server.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 60s"
          exit 1

      - name: Seed demo data
        working-directory: backend
        run: |
          "${RUNNER_TEMP}/phoenix" seed \
            --email "${OPERATOR_EMAIL}" \
            --password "${OPERATOR_PASSWORD}" \
            --pin 1234 \
            --url http://localhost:8080 \
            --tenant-slug demo-school \
            --staff-password 'SeedSmoke1234%' \
            --admin-email school-admin@example.com

      - name: Simulate a full care day
        working-directory: backend
        run: |
          "${RUNNER_TEMP}/phoenix" simulate full-day

      - name: Check seed coverage ratchet
        working-directory: backend
        env:
          SEED_COVERAGE_DSN: postgres://postgres:postgres@localhost:5432/phoenix_seed?sslmode=disable
        run: go test ./seed/api/ -run TestSeedCoverageRatchet -v

      - name: Server log
        if: always()
        run: tail -n 200 "${RUNNER_TEMP}/server.log" || true

      - name: Stop server
        if: always()
        run: kill "$(cat "${RUNNER_TEMP}/server.pid")" 2>/dev/null || true
