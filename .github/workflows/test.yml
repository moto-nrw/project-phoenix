name: Test

on:
  workflow_call:
    inputs:
      run-backend:
        type: boolean
        default: true
      run-frontend:
        type: boolean
        default: true
      frontend-guards-only:
        type: boolean
        default: false
      run-frontend-runner-tests:
        type: boolean
        default: false
      run-seed-smoke:
        type: boolean
        required: true
      # True for pull requests: test only what changed against base_ref. False
      # for protected-branch pushes, release pull requests and the nightly run,
      # which run both full suites.
      changed-scope:
        type: boolean
        default: false
      base_ref:
        type: string
        default: ""
      full-backend-suite:
        type: boolean
        required: true
      backend-race:
        description: Instrument backend tests for the nightly full race run
        type: boolean
        default: false
      full-frontend-suite:
        type: boolean
        required: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOFLAGS: -tags=testhooks

jobs:
  plan-backend:
    name: Select backend tests
    if: ${{ inputs.run-backend && inputs.changed-scope && !inputs.full-backend-suite && inputs.base_ref != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          filter: blob:none
      - name: Fetch backend comparison history
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          refs=("$(git rev-parse HEAD)" "+refs/heads/development:refs/remotes/origin/development")
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != development ]; then
            refs+=("+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF")
          fi
          git fetch --no-tags --unshallow origin "${refs[@]}"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Test backend test scripts
        run: |
          scripts/backend-affected-packages_test.sh
          scripts/backend-test-matrix_test.sh
          scripts/test-changed_test.sh
      - name: Select and partition backend packages
        id: packages
        working-directory: backend
        env:
          CHANGED_SCOPE: ${{ inputs.changed-scope }}
          FULL_SUITE: ${{ inputs.full-backend-suite }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          if [ "$CHANGED_SCOPE" = true ] && [ "$FULL_SUITE" = false ] && [ -n "$BASE_REF" ]; then
            packages=$(../scripts/backend-affected-packages.sh "origin/$BASE_REF")
            if [ "$packages" = ./... ]; then
              packages=$(go list ./...)
              FULL_SUITE=true
            fi
          else
            packages=$(go list ./...)
            FULL_SUITE=true
          fi
          matrix=$(printf '%s\n' "$packages" | FULL_SUITE="$FULL_SUITE" ../scripts/backend-test-matrix.sh)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$matrix" | jq '.include | map({shard, runner, packages: (.packages | split("\n") | map(select(length > 0)) | length)})'

  test-backend:
    name: Backend tests${{ inputs.backend-race && ' with race detector' || '' }} (${{ matrix.shard }})
    needs: plan-backend
    if: ${{ !cancelled() && inputs.run-backend && (needs.plan-backend.result == 'success' || needs.plan-backend.result == 'skipped') }}
    strategy:
      fail-fast: false
      # Size the run from the actual affected graph, not just the event type.
      # Small PRs keep one modest runner; broad PRs use the existing full-suite
      # budgets, without mixing architecture/migrations into application work.
      matrix: ${{ fromJSON(needs.plan-backend.outputs.matrix || '{"include":[{"shard":0},{"shard":1},{"shard":2},{"shard":3}]}') }}
    runs-on: ${{ matrix.runner || 'blacksmith-8vcpu-ubuntu-2404' }}
    # Instrumented builds and tests need more headroom than ordinary runs.
    # Keep the default Actions limit unchanged for non-race callers.
    timeout-minutes: ${{ inputs.backend-race && 60 || 360 }}
    env:
      # Keep sibling package clones in one run, as the local test wrappers do.
      # Generation GC must not collect them while this shard is still running.
      PHX_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
    permissions:
      contents: read
      checks: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phoenix_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: Europe/Berlin
        ports:
          - 5432:5432
        # Package database drops force checkpoints. These disposable databases
        # need no disk persistence; tmpfs avoids the measured fsync bottleneck.
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=4g
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch only the checked-out revision here. The next step expands
          # its history and comparison refs without downloading every branch
          # and tag. Only the architecture suite needs historical blobs.
          fetch-depth: 1
          filter: ${{ matrix.shard != 1 && 'blob:none' || '' }}

      - name: Fetch backend comparison history
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          refs=("$(git rev-parse HEAD)" "+refs/heads/development:refs/remotes/origin/development")
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != development ]; then
            refs+=("+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF")
          fi
          # Full ancestry keeps merge-base intact for the architecture
          # comparisons. Unrelated refs and tags are not test inputs.
          git fetch --no-tags --unshallow origin "${refs[@]}"

      - name: Setup Node.js for error-code generator fixtures
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"

      - name: Setup Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # setup-go's go.sum-only key is immutable. It restores dependencies but
      # never saves later source builds on an exact hit. Keep a source-keyed
      # build layer per shard, with the last source build as a warm fallback.
      - name: Compute backend build cache key
        id: build-cache-key
        env:
          BACKEND_CACHE_PREFIX: backend-build${{ inputs.backend-race && '-race' || '' }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.shard }}-${{ hashFiles('backend/go.sum', 'scripts/backend-architecture/go.sum') }}-
          BACKEND_SOURCE_HASH: ${{ hashFiles('backend/**/*.go', 'scripts/backend-architecture/**/*.go', 'scripts/backend-test-matrix.sh') }}
        run: |
          echo "prefix=$BACKEND_CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "key=$BACKEND_CACHE_PREFIX$BACKEND_SOURCE_HASH" >> "$GITHUB_OUTPUT"
      - name: Restore backend build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-cache-key.outputs.key }}
          restore-keys: ${{ steps.build-cache-key.outputs.prefix }}

      - name: Test backend test scripts
        if: ${{ matrix.shard == 0 && (!inputs.changed-scope || inputs.full-backend-suite || inputs.base_ref == '') }}
        run: |
          scripts/backend-affected-packages_test.sh
          scripts/backend-test-matrix_test.sh
          scripts/test-changed_test.sh

      - name: Verify snapshot roles match migrations
        if: matrix.shard == 0
        run: node --test scripts/db-snapshot-roles.test.mjs

      - name: Restore migrated DB snapshot
        if: ${{ matrix.shard != 1 }}
        id: db-snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.db-snapshot
          # pg17: bump manually when the postgres service image major version
          # changes. No restore-keys on purpose — a stale snapshot must never
          # be restored; a miss only costs the ~25s migrate path below.
          key: db-snapshot-pg17-${{ hashFiles('backend/database/migrations/*.go', 'backend/cmd/migrate.go') }}

      - name: Restore database from snapshot
        if: matrix.shard != 1 && steps.db-snapshot.outputs.cache-hit == 'true'
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PHOENIX_AUTH_PASSWORD: phoenix_auth_test
          PHOENIX_DEMO_PASSWORD: phoenix_demo_test
        run: |
          # pg_dump omits global objects (roles, ALTER ROLE ... SET). Recreate
          # them exactly as the role migrations do (001014001_create_tenant_roles.go,
          # 001015489_tenant_export_reader.go and later),
          # BEFORE restoring the dump — it contains GRANTs and RLS policies
          # referencing these roles. If a future migration adds a role, update
          # this block too, including role memberships such as pg_read_all_data.
          # A role the dump references fails the restore (ON_ERROR_STOP); a role
          # used only through SET ROLE fails later, in the tests that need it.
          # Everything runs inside the postgres:17 service container: the
          # local socket is trust-auth and the runner's psql is v16, which
          # refuses a v17 server.
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d phoenix_test <<EOF
          CREATE ROLE phoenix_auth LOGIN NOINHERIT PASSWORD '${PHOENIX_AUTH_PASSWORD}';
          CREATE ROLE phoenix_demo LOGIN NOINHERIT PASSWORD '${PHOENIX_DEMO_PASSWORD}';
          CREATE ROLE phoenix_tenant NOLOGIN;
          CREATE ROLE phoenix_admin NOLOGIN BYPASSRLS;
          CREATE ROLE phoenix_diagnostics NOLOGIN NOINHERIT;
          CREATE ROLE phoenix_school_erasure NOLOGIN NOINHERIT NOBYPASSRLS;
          CREATE ROLE phoenix_billing_retention NOLOGIN NOINHERIT NOBYPASSRLS;
          CREATE ROLE phoenix_tenant_export NOLOGIN BYPASSRLS;
          GRANT pg_read_all_data TO phoenix_tenant_export;
          GRANT phoenix_tenant TO phoenix_auth;
          GRANT phoenix_admin TO phoenix_auth;
          ALTER ROLE phoenix_auth SET search_path TO public, platform;
          EOF
          docker exec -i "$PG_CONTAINER" psql -q -v ON_ERROR_STOP=1 -U postgres -d phoenix_test \
            < backend/.db-snapshot/dump.sql

      - name: Run database migrations
        if: matrix.shard != 1 && steps.db-snapshot.outputs.cache-hit != 'true'
        working-directory: backend
        env:
          DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_test?sslmode=disable
          DB_MAX_OPEN_CONNS: "40"
          DB_MAX_IDLE_CONNS: "40"
          DB_CONN_MAX_LIFETIME: 30m
          DB_CONN_MAX_IDLE_TIME: 10m
          PHOENIX_AUTH_PASSWORD: phoenix_auth_test
          PHOENIX_DEMO_PASSWORD: phoenix_demo_test
        run: go run main.go migrate

      - name: Dump migrated database for snapshot cache
        if: matrix.shard != 1 && steps.db-snapshot.outputs.cache-hit != 'true'
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # pg_dump must come from the service container (runner ships v16,
          # which refuses newer servers). The dump includes bun_migrations, so
          # a restored DB needs no migrate pass. Roles are NOT in the dump —
          # the restore step recreates them.
          mkdir -p backend/.db-snapshot
          docker exec -i "$PG_CONTAINER" pg_dump -U postgres phoenix_test \
            > backend/.db-snapshot/dump.sql

      - name: Bootstrap test database template
        if: ${{ matrix.shard != 1 }}
        working-directory: backend
        env:
          TEST_DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_test?sslmode=disable
        run: echo "PHX_TEST_TEMPLATE=$(go run ./internal/testdb/cmd/bootstrap)" >> "$GITHUB_ENV"

      - name: Run Go tests
        working-directory: backend
        env:
          TEST_DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_test?sslmode=disable
          # The route-table golden builds the production API, whose serve
          # connection uses the role created above with this password. The
          # value must stay identical to testdb.AuthRolePassword — the test
          # lifecycle pins the cluster-global phoenix_auth role to it.
          PHOENIX_AUTH_PASSWORD: phoenix_auth_test
          PHOENIX_DEMO_PASSWORD: phoenix_demo_test
          # Dummy 32+ char secret so services.NewFactory can init the MFA
          # service in tests. NewFactory hard-fails without it (the secret
          # is the HMAC key for trusted-device cookies). Production and
          # staging supply this via SOPS; CI tests get a fixed test value.
          AUTH_JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
          FRONTEND_URL: http://localhost:3000
          PARENTS_URL: http://parents.localhost:3000
          SCHOOL_URL: http://schule.localhost:3000
          CATERER_URL: http://caterer.localhost:3000
          TRAEGER_URL: http://traeger.localhost:3000
          NEXT_PUBLIC_OPERATOR_HOSTNAME: operator.localhost:3000
          TENANT_DOMAIN: localhost
          TEST_PACKAGES: ${{ matrix.packages }}
          PACKAGE_WORKERS: ${{ matrix.workers || 6 }}
          FULL_SUITE: ${{ !inputs.changed-scope || inputs.full-backend-suite || inputs.base_ref == '' }}
          SHARD_INDEX: ${{ matrix.shard }}
          BACKEND_RACE: ${{ inputs.backend-race }}
        run: |
          if [ "$FULL_SUITE" = true ]; then
            # Known full runs start immediately, without a planning runner.
            all_packages=$(go list ./...)
            TEST_PACKAGES=$(printf '%s\n' "$all_packages" | FULL_SUITE=true ../scripts/backend-test-matrix.sh |
              jq -er --argjson shard "$SHARD_INDEX" '.include[] | select(.shard == $shard) | .packages')
          fi
          packages=()
          while IFS= read -r package; do
            [ -n "$package" ] && packages+=("$package")
          done <<< "$TEST_PACKAGES"
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No changed Go packages"
            exit 0
          fi
          echo "Running ${#packages[@]} selected Go packages"

          race_flags=()
          measure=()
          if [ "$BACKEND_RACE" = true ]; then
            export CGO_ENABLED=1
            "$(go env CC)" --version
            race_flags=(-race -timeout=20m)
            # Race instrumentation increases memory per package. Retain the
            # existing four shards and parallel tests, but limit each runner
            # to two package builds/binaries and their package-owned DB clones.
            PACKAGE_WORKERS=2
            measure=(/usr/bin/time -v -o "$RUNNER_TEMP/backend-race-resources.txt")
            nproc
            free -m
          fi

          # Single pass produces junit.xml. No retries: flaky tests should fail
          # loudly, not be hidden. gotestsum propagates race/test failures.
          "${measure[@]}" go tool gotestsum --format pkgname-and-test-fails \
            --junitfile junit.xml -- "${race_flags[@]}" -count=1 -parallel 8 -p "$PACKAGE_WORKERS" "${packages[@]}"

      - name: Summarize race test resources
        if: ${{ always() && inputs.backend-race }}
        run: |
          if [ -f "$RUNNER_TEMP/backend-race-resources.txt" ]; then
            {
              echo '### Backend race run (shard ${{ matrix.shard }})'
              echo 'GNU time maximum RSS is the largest process, not aggregate runner memory.'
              echo '```text'
              cat "$RUNNER_TEMP/backend-race-resources.txt"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish backend test results
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: ${{ always() && hashFiles('backend/junit.xml') != '' }}
        with:
          report_paths: backend/junit.xml
          check_name: Backend Test Results${{ inputs.backend-race && ' with race detector' || '' }} (${{ matrix.shard }})
          include_passed: false
          detailed_summary: true

  test-frontend:
    if: ${{ inputs.run-frontend }}
    # The existing Vitest projects are independent, but groupOrder runs Node
    # before DOM in one process. Split them without raising worker counts or
    # disabling isolation. Only Node needs the browser layout checks.
    strategy:
      fail-fast: false
      matrix:
        # Changed-only PRs keep one DOM job. Full suites split its files with
        # Vitest's built-in sharding, retaining four workers per DOM runner.
        project: ${{ fromJSON(inputs.frontend-guards-only && '["guards"]' || (!inputs.changed-scope || inputs.full-frontend-suite || inputs.base_ref == '') && '["node","dom-1","dom-2"]' || '["node","dom"]') }}
    runs-on: ${{ (matrix.project == 'node' || matrix.project == 'guards') && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-8vcpu-ubuntu-2404' }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check filesystem guard inventory
        if: ${{ matrix.project == 'node' }}
        run: node scripts/test-frontend-changed.mjs --check-guards

      - name: Test frontend selection runner
        if: ${{ matrix.project == 'node' && inputs.run-frontend-runner-tests }}
        run: node --test scripts/test-frontend-changed.test.mjs

      # Layout needs a real browser; jsdom/happy-dom compute no boxes (#3328).
      # The binary is cached per lockfile, OS libs install every run.
      - name: Cache Playwright browsers
        if: ${{ matrix.project == 'node' }}
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: ${{ matrix.project == 'node' }}
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run browser layout tests
        if: ${{ matrix.project == 'node' }}
        working-directory: frontend
        run: pnpm run test:layout

      - name: Run frontend tests
        working-directory: frontend
        env:
          PROJECT: ${{ matrix.project }}
          CHANGED_SCOPE: ${{ inputs.changed-scope }}
          FULL_SUITE: ${{ inputs.full-frontend-suite }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          test_args=(--project app-dom)
          if [ "$PROJECT" = node ]; then
            test_args=(--project api-node --project logic-node)
          elif [ "$PROJECT" = guards ]; then
            # Guard paths span Vitest projects. Do not filter DOM guards out.
            test_args=()
          fi
          case "$PROJECT" in
            dom-1|dom-2) test_args+=(--shard "${PROJECT#dom-}/2") ;;
          esac
          if [ "$CHANGED_SCOPE" = true ] && [ "$FULL_SUITE" = false ] && [ -n "$BASE_REF" ]; then
            node ../scripts/test-frontend-changed.mjs "origin/$BASE_REF" --disableConsoleIntercept "${test_args[@]}"
          else
            # Full suites already include every guard, with normal sharding.
            pnpm vitest run --disableConsoleIntercept "${test_args[@]}"
          fi

  # The seeder is the widest end-to-end path in this repo: roughly a hundred
  # real API calls across auth, enrollment, parent portal, time tracking and
  # IoT. Until this job existed it ran nowhere automatically, so a tightened
  # request contract could break it unnoticed — a mandatory `reason` field on
  # the parent pickup-change endpoint did exactly that in July 2026 and only
  # surfaced a month later, when a developer seeded by hand.
  seed-smoke:
    name: Seed & simulate smoke (${{ matrix.scenario }})
    if: ${{ inputs.run-seed-smoke }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [profiles, isolation, queue]
    # Each scenario owns its database and operator MFA mailbox. The isolation
    # scenario still seeds both schools sequentially into the SAME database;
    # profiles retains the complete coverage ratchet after the standing demo;
    # queue separately verifies all three prospect schools and parent access.
    # Database reads repeatedly stalled on the cached runner, including while
    # Postgres reported an active query with no lock wait (run 38232330367).
    # Use a fresh hosted VM without changing smoke coverage or read timeouts.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phoenix_seed
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: Europe/Berlin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        # Operator login enrolls MFA and reads the code back out of mailpit's
        # REST API, so the seeder cannot authenticate without a mail sink.
        image: axllent/mailpit:v1.30
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DB_MAX_OPEN_CONNS: "40"
      DB_MAX_IDLE_CONNS: "40"
      DB_CONN_MAX_LIFETIME: 30m
      DB_CONN_MAX_IDLE_TIME: 10m
      PHOENIX_AUTH_PASSWORD: phoenix_auth_test
      PHOENIX_DEMO_PASSWORD: phoenix_demo_test
      # validateServeConfig() in cmd/serve.go requires every one of these:
      # there are no fallback defaults anywhere in this codebase.
      PORT: "8080"
      APP_ENV: development
      LOG_LEVEL: info
      LOG_TEXTLOGGING: "true"
      AUTH_JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
      AUTH_JWT_EXPIRY: 15m
      AUTH_JWT_REFRESH_EXPIRY: 168h
      # Read by os.Getenv in migration 001011003, which creates the operator
      # account the seeder logs in with.
      OPERATOR_EMAIL: operator@example.com
      OPERATOR_PASSWORD: SeedSmoke1234%
      OPERATOR_DISPLAY_NAME: CI Operator
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: SeedSmoke1234%
      FRONTEND_URL: http://localhost:3000
      PARENTS_URL: http://parents.localhost:3000
      # Cloudflare's documented Turnstile test keys. profiles and isolation
      # use the always-passing secret, so the seeder covers the public
      # holiday registration. queue seeds what the demo server seeds, and the
      # demo holds a real secret that refuses the seeder's test token: the
      # always-failing secret makes every demo order there prove it survives
      # that, which a green CI missed until the demo failed on 2026-10-27.
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: ${{ matrix.scenario == 'queue' && '2x0000000000000000000000000000000AA' || '1x0000000000000000000000000000000AA' }}
      SCHOOL_URL: http://schule.localhost:3000
      CATERER_URL: http://caterer.localhost:3000
      TRAEGER_URL: http://traeger.localhost:3000
      # services.NewFactory refuses to build without it: the personal CalDAV
      # calendar derives its public server address from this value. Matches
      # the PORT above so the seeded links point at this job's own server.
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_OPERATOR_HOSTNAME: operator.localhost:3000
      NEXT_PUBLIC_PARENTS_HOSTNAME: parents.localhost:3000
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_SCHOOL_HOSTNAME: schule.localhost:3000
      NEXT_PUBLIC_CATERER_HOSTNAME: caterer.localhost:3000
      NEXT_PUBLIC_TRAEGER_HOSTNAME: traeger.localhost:3000
      TENANT_DOMAIN: localhost
      # api/server.go refuses to build the server without it.
      METRICS_BEARER_TOKEN: ci-metrics-token
      # Device auth checks the school's security.ogs_device_pin setting, whose
      # registry default is 1234. This is only the seeder input, never a runtime
      # fallback. The seeder writes its --pin into that setting. A PIN
      # other than the default proves that write; with 1234 a missing write
      # stays green here and every RFID call on the public demo returns 401.
      OGS_DEVICE_PIN: "4711"
      EMAIL_SMTP_HOST: localhost
      EMAIL_SMTP_PORT: 1025
      EMAIL_FROM_ADDRESS: noreply@localhost
      EMAIL_FROM_NAME: moto CI
      MAILPIT_URL: http://localhost:8025
      # The schedulers would mutate seeded rows behind the coverage check.
      CLEANUP_SCHEDULER_ENABLED: "false"
      SESSION_END_SCHEDULER_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every DSN points at the Postgres container's bridge IP instead of
      # localhost:5432. localhost resolves to [::1], which Docker serves
      # through its userland port proxy. Three runs (36190757699,
      # 36197414192, 36197521464) hung one pooled connection for the full
      # 10 s read timeout on a millisecond query, and Postgres logged neither
      # the query, a lock wait, nor the EOF of the closed connection: that
      # connection's bytes never reached the server. The direct address
      # takes the proxy out of the path.
      - name: Resolve Postgres container address
        run: |
          pg_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${{ job.services.postgres.id }}")
          test -n "${pg_ip}"
          echo "Postgres container address: ${pg_ip}"
          {
            echo "DB_DSN=postgres://postgres:postgres@${pg_ip}:5432/phoenix_seed?sslmode=disable"
            echo "DEMO_DB_DSN=postgres://phoenix_demo@${pg_ip}:5432/phoenix_seed?sslmode=disable"
            echo "SEED_COVERAGE_DSN=postgres://postgres:postgres@${pg_ip}:5432/phoenix_seed?sslmode=disable"
          } >> "${GITHUB_ENV}"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build backend and dev tools binaries
        working-directory: backend
        run: |
          go build -o "${RUNNER_TEMP}/phoenix" .
          go build -o "${RUNNER_TEMP}/devtools" ./cmd/devtools

      - name: Run migrations
        working-directory: backend
        run: |
          "${RUNNER_TEMP}/phoenix" migrate

      # A request once hung here for the full 10s driver read timeout on a
      # sub-millisecond read while no other request or pool connection was
      # busy (run 36190757699), and the service log could not say why. With
      # these settings the log printed at job end names a lock wait and its
      # blocker, or a slow statement with its duration; a hang that leaves
      # neither points at the runner rather than at the query.
      - name: Log Postgres lock waits and slow statements
        run: |
          psql "${DB_DSN}" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET log_lock_waits = on" \
            -c "ALTER SYSTEM SET log_min_duration_statement = '1s'" \
            -c "ALTER SYSTEM SET log_autovacuum_min_duration = '1s'" \
            -c "ALTER SYSTEM SET log_connections = on" \
            -c "ALTER SYSTEM SET log_disconnections = on" \
            -c "SELECT pg_reload_conf()"

      # If a request hangs again, this shows whether its backend was running,
      # waiting (wait_event), or idle without ever seeing the query, and
      # whether bytes sat in a socket queue. One psql session samples twice a
      # second, so log_connections stays readable. Printed only on failure.
      - name: Start Postgres activity sampler
        run: |
          cat > "${RUNNER_TEMP}/activity.sql" <<'SQL'
          SELECT clock_timestamp()::time(3) AS at, pid, backend_type, state,
                 wait_event_type, wait_event,
                 round(extract(epoch FROM clock_timestamp() - xact_start)::numeric, 2) AS xact_s,
                 round(extract(epoch FROM clock_timestamp() - query_start)::numeric, 2) AS query_s,
                 left(regexp_replace(query, '\s+', ' ', 'g'), 160) AS query
          FROM pg_stat_activity
          WHERE pid <> pg_backend_pid()
            AND backend_type IN ('client backend', 'autovacuum worker')
            AND state IS DISTINCT FROM 'idle'
          ORDER BY pid
          \watch 0.5
          SQL
          nohup psql "${DB_DSN}" -XAt -F ' | ' -f "${RUNNER_TEMP}/activity.sql" \
            > "${RUNNER_TEMP}/activity.log" 2>&1 &
          nohup bash -c 'while true; do
            echo "=== $(date -u +%H:%M:%S.%3N)"
            ss -tnio state established "( sport = :5432 or dport = :5432 )" | awk "NR > 1 && (\$1 > 0 || \$2 > 0)"
            sleep 0.5
          done' > "${RUNNER_TEMP}/sockets.log" 2>&1 &

      - name: Start server
        working-directory: backend
        run: |
          "${RUNNER_TEMP}/phoenix" serve > "${RUNNER_TEMP}/server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/server.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 60s"
          exit 1

      - name: Seed all four profiles and verify enrollment, withdrawal, web and NFC flows
        if: ${{ matrix.scenario == 'profiles' }}
        working-directory: backend
        run: |
          "${RUNNER_TEMP}/devtools" seed \
            --email "${OPERATOR_EMAIL}" \
            --password "${OPERATOR_PASSWORD}" \
            --pin "${OGS_DEVICE_PIN}" \
            --url http://localhost:8080 \
            --tenant-slug vollbetrieb \
            --staff-password 'SeedSmoke1234%' \
            --admin-email ines.lindner@ganztag-nord.example

      - name: Simulate a full care day
        if: ${{ matrix.scenario == 'profiles' }}
        working-directory: backend
        run: |
          "${RUNNER_TEMP}/devtools" simulate full-day --profile vollbetrieb

      - name: Verify manual attendance profile
        if: ${{ matrix.scenario == 'profiles' }}
        working-directory: backend
        run: |
          "${RUNNER_TEMP}/devtools" simulate status --profile manuell

      - name: Read enrollment demo profiles
        if: ${{ matrix.scenario == 'profiles' }}
        working-directory: backend
        run: |
          "${RUNNER_TEMP}/devtools" simulate status --profile anmeldung-wochenplan
          "${RUNNER_TEMP}/devtools" simulate status --profile anmeldung-buchungen

      # The public demo (#3456) seeds one such school per visitor into a
      # database that already holds others. The duration is what a visitor
      # waits for, so it is printed per school.
      - name: Seed two demo schools into the same database and simulate their day
        if: ${{ matrix.scenario == 'isolation' }}
        working-directory: backend
        run: |
          for slug in demo-smoke-eins demo-smoke-zwei; do
            started=$(date +%s)
            "${RUNNER_TEMP}/devtools" seed \
              --email "${OPERATOR_EMAIL}" \
              --password "${OPERATOR_PASSWORD}" \
              --pin "${OGS_DEVICE_PIN}" \
              --url http://localhost:8080 \
              --profile vollbetrieb \
              --tenant-slug "${slug}" \
              --school-name "OGS ${slug}" \
              --staff-password 'SeedSmoke1234%' \
              --state "${RUNNER_TEMP}/${slug}.seed-state.json"
            seeded=$(date +%s)
            "${RUNNER_TEMP}/devtools" simulate full-day --profile vollbetrieb \
              --state "${RUNNER_TEMP}/${slug}.seed-state.json"
            finished=$(date +%s)
            echo "demo school ${slug}: seed $((seeded - started))s, full day $((finished - seeded))s"
          done

      - name: Provision and restart the standing demo school
        if: ${{ matrix.scenario == 'profiles' }}
        working-directory: backend
        run: |
          # Reset only consumed challenge fixtures in this disposable CI
          # database; keep production limits unchanged.
          psql "${DB_DSN}" -v ON_ERROR_STOP=1 -c \
            'DELETE FROM platform.operator_mfa_email_challenges WHERE consumed_at IS NOT NULL'
          # The standing school is the fallback of #3463 and keeps its coverage.
          "${RUNNER_TEMP}/devtools" demo --url http://localhost:8080 --once --demo-standing-school
          "${RUNNER_TEMP}/devtools" demo --url http://localhost:8080 --once --demo-standing-school

      # One demo school per demo access (#3463): queue what the serving backend
      # queues for three prospects, let the demo process seed them with its
      # three workers and tick them once. A school that did not become ready
      # fails the job. The durations are what a visitor waits for. A failed
      # deferred seed rebuilds its school; its line names why (#5151).
      - name: Seed queued demo schools with the demo process
        if: ${{ matrix.scenario == 'queue' }}
        working-directory: backend
        run: |
          psql "${DB_DSN}" -v ON_ERROR_STOP=1 -c \
            'DELETE FROM platform.operator_mfa_email_challenges WHERE consumed_at IS NOT NULL'
          psql "${DB_DSN}" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO platform.demo_school_states (name, school_name, first_name, last_name)
             SELECT 'ogs-smoke-' || i || '-k3m9x' || i, 'OGS Smoke ' || i, 'Zyxwolda', 'Quorbelt' FROM generate_series(1, 3) AS i"
          LOG_LEVEL=info "${RUNNER_TEMP}/devtools" demo --url http://localhost:8080 --once 2>&1 | grep -E 'demo school (ready|order failed|deferred seed failed)' || true
          not_ready=$(psql "${DB_DSN}" -At -c "SELECT count(*) FROM platform.demo_school_states WHERE name LIKE 'ogs-smoke-%' AND status <> 'ready'")
          visitors=$(psql "${DB_DSN}" -At -c "SELECT count(*) FROM users.persons p JOIN platform.demo_school_states d ON d.tenant_id = p.tenant_id JOIN users.staff_school_memberships s ON s.tenant_id = p.tenant_id AND s.person_id = p.id WHERE d.name LIKE 'ogs-smoke-%' AND p.first_name = 'Zyxwolda' AND p.last_name = 'Quorbelt'")
          echo "demo schools not ready: ${not_ready}, staff named after the visitor: ${visitors}"
          test "${not_ready}" = 0
          test "${visitors}" = 3
          # The always-failing Turnstile secret of this scenario must have
          # refused the seeder's test token, as the demo server's key does.
          # Without it this step no longer proves the demo order path.
          refused=$(grep -c 'captcha verification failed' "${RUNNER_TEMP}/server.log" || true)
          echo "captcha refusals like on the demo server: ${refused}"
          test "${refused}" -gt 0
          # The demo role parent (#3468): each school names the visitor's
          # parent, a guardian of the visitor's name with full parent portal
          # rights for exactly one child and no other child.
          parents=$(psql "${DB_DSN}" -At -c "
            SELECT count(*) FROM platform.demo_school_states d
            JOIN users.guardian_profiles g ON g.account_id = d.visitor_parent_account_id AND g.tenant_id = d.tenant_id
            WHERE d.name LIKE 'ogs-smoke-%' AND g.first_name = 'Zyxwolda' AND g.last_name = 'Quorbelt'
              AND (SELECT count(*) FROM users.student_guardian_relationships sg WHERE sg.guardian_profile_id = g.id) = 1
              AND (SELECT count(*) FROM users.student_guardian_relationships sg
                   JOIN auth.guardian_student_access sga ON sga.tenant_id = sg.tenant_id AND sga.relationship_id = sg.id
                   WHERE sg.guardian_profile_id = g.id
                   AND sg.guardian_role = 'primary_guardian' AND (sga.permissions ->> 'parent_portal.access')::boolean) = 1
              AND (SELECT count(*) FROM users.guardian_profiles other
                   JOIN users.student_guardian_relationships sg ON sg.guardian_profile_id = other.id
                   WHERE other.account_id = d.visitor_parent_account_id) = 1")
          echo "demo schools with the visitor's parent: ${parents}"
          test "${parents}" = 3

      # Demo visitors are erased (#4048): hide the three schools as the
      # expiry does 14 days after their last use, let the demo process run its
      # expiry, and search every text column of the database for the visitor.
      # A new place the seed copies the visitor's name to fails here; add it
      # to platform.erase_closed_demo_visitors.
      - name: Erase the visitors of retired demo schools
        if: ${{ matrix.scenario == 'queue' }}
        working-directory: backend
        run: |
          psql "${DB_DSN}" -v ON_ERROR_STOP=1 -c \
            'DELETE FROM platform.operator_mfa_email_challenges WHERE consumed_at IS NOT NULL'
          psql "${DB_DSN}" -v ON_ERROR_STOP=1 -c \
            "UPDATE platform.schools SET deleted_at = NOW()
             WHERE id IN (SELECT tenant_id FROM platform.demo_school_states WHERE name LIKE 'ogs-smoke-%')"
          "${RUNNER_TEMP}/devtools" demo --url http://localhost:8080 --once
          orders=$(psql "${DB_DSN}" -At -c "SELECT count(*) FROM platform.demo_school_states WHERE name LIKE 'ogs-smoke-%'")
          echo "demo orders left after the erasure: ${orders}"
          test "${orders}" = 0
          psql "${DB_DSN}" -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE col RECORD; found BIGINT; traces TEXT := '';
            BEGIN
              FOR col IN
                SELECT c.table_schema, c.table_name, c.column_name
                FROM information_schema.columns AS c
                JOIN information_schema.tables AS t USING (table_schema, table_name)
                WHERE t.table_type = 'BASE TABLE' AND c.table_schema NOT IN ('pg_catalog', 'information_schema')
                  AND c.data_type IN ('text', 'character varying', 'character', 'json', 'jsonb')
              LOOP
                EXECUTE format('SELECT count(*) FROM %I.%I WHERE %I::text ILIKE ANY (ARRAY[%L, %L])',
                  col.table_schema, col.table_name, col.column_name, '%zyxwolda%', '%quorbelt%') INTO found;
                IF found > 0 THEN
                  traces := traces || format(' %s.%s.%s (%s rows)', col.table_schema, col.table_name, col.column_name, found);
                END IF;
              END LOOP;
              IF traces <> '' THEN
                RAISE EXCEPTION 'the erased demo visitor is still in:%', traces;
              END IF;
            END
            \$\$"

      - name: Check seed coverage ratchet
        if: ${{ matrix.scenario == 'profiles' }}
        working-directory: backend
        run: go test ./internal/devtools/seedapi/ -run TestSeedCoverageRatchet -v

      - name: Postgres activity and socket queues
        if: failure()
        run: |
          tail -n 400 "${RUNNER_TEMP}/activity.log" || true
          echo "--- sockets with queued bytes"
          awk '/^===/ { at = $2; next } { print at, $0 }' "${RUNNER_TEMP}/sockets.log" | tail -n 200 || true

      - name: Server log
        if: always()
        run: tail -n 200 "${RUNNER_TEMP}/server.log" || true

      - name: Stop server
        if: always()
        run: kill "$(cat "${RUNNER_TEMP}/server.pid")" 2>/dev/null || true
