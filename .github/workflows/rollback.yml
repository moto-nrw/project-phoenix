name: Manual Rollback
run-name: Rollback ${{ inputs.environment }} from ${{ inputs.backup_id || 'pre-deployment snapshot' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
          - demo
      backup_id:
        description: "Complete backup ID. Empty restores the current deployment's pre-deployment snapshot."
        required: false
        type: string

permissions: {}

jobs:
  rollback:
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set environment config
        id: env
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [[ "$ENVIRONMENT" = "production" || "$ENVIRONMENT" = "demo" ]] && [ "$REF_NAME" != "refs/heads/main" ]; then
            echo "Production and demo rollbacks must run from refs/heads/main, got $REF_NAME"
            exit 1
          fi
          case "$ENVIRONMENT" in
            staging) echo "dir=staging" >> "$GITHUB_OUTPUT" ;;
            production) echo "dir=production" >> "$GITHUB_OUTPUT" ;;
            demo) echo "dir=demo" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown environment"; exit 1 ;;
          esac

      - name: Setup SSH
        id: ssh
        env:
          SSH_KEY: ${{ secrets[format('{0}_SSH_KEY', inputs.environment)] }}
          SSH_HOST: ${{ secrets[format('{0}_HOST', inputs.environment)] }}
          SSH_KNOWN_HOSTS: ${{ secrets[format('{0}_SSH_KNOWN_HOSTS', inputs.environment)] }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "host=$SSH_HOST" >> "$GITHUB_OUTPUT"

      - name: Rollback
        id: rollback
        env:
          BACKUP_ID: ${{ inputs.backup_id }}
          DEPLOY_DIR: ${{ steps.env.outputs.dir }}
          SSH_HOST: ${{ steps.ssh.outputs.host }}
        run: |
          if [[ -n "$BACKUP_ID" && ! "$BACKUP_ID" =~ ^release-[0-9]{8}T[0-9]{6}Z-[a-f0-9]{7,40}$ ]]; then
            echo "Invalid backup ID"
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key "root@${SSH_HOST}" "mkdir -p ~/scripts"
          scp -i ~/.ssh/deploy_key scripts/rollback-remote.sh scripts/restore-db.sh scripts/release-backup.sh "root@$SSH_HOST:~/scripts/"
          set +e
          ssh -i ~/.ssh/deploy_key "root@${SSH_HOST}" \
            "BACKUP_ID=$BACKUP_ID DEPLOY_DIR=$DEPLOY_DIR bash ~/scripts/rollback-remote.sh"
          ROLLBACK_EXIT=$?
          set -e
          echo "rollback_exit=$ROLLBACK_EXIT" >> "$GITHUB_OUTPUT"
          exit "$ROLLBACK_EXIT"

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notify on rollback failure
        if: always() && steps.rollback.outputs.rollback_exit != '' && steps.rollback.outputs.rollback_exit != '0'
        uses: ./.github/actions/notify-deploy-failure
        with:
          exit_code: ${{ steps.rollback.outputs.rollback_exit }}
          environment: ${{ inputs.environment }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          notify_emails: ${{ vars.DEPLOY_NOTIFY_EMAILS }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          sha: ${{ github.sha }}
          actor: ${{ github.actor }}
