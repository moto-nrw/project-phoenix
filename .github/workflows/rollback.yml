name: Manual Rollback
run-name: Rollback ${{ inputs.environment }} to ${{ inputs.target_sha || 'previous version' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - demo
          - production
      target_sha:
        description: "Image SHA tag (7-char, e.g. abc1234). Leave empty to use previous deploy."
        required: false
        type: string
      restore_db:
        description: "Restore database from latest backup"
        required: true
        type: boolean
        default: true

permissions: {}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/moto-nrw/phoenix-server
  FRONTEND_IMAGE: ghcr.io/moto-nrw/phoenix-frontend

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set environment config
        id: env
        run: |
          case "${{ inputs.environment }}" in
            staging)    echo "dir=staging" >> $GITHUB_OUTPUT ;;
            demo)       echo "dir=demo" >> $GITHUB_OUTPUT ;;
            production) echo "dir=production" >> $GITHUB_OUTPUT ;;
          esac

      - name: Setup SSH
        id: ssh
        env:
          SSH_KEY: ${{ inputs.environment == 'staging' && secrets.STAGING_SSH_KEY || inputs.environment == 'demo' && secrets.DEMO_SSH_KEY || secrets.PRODUCTION_SSH_KEY }}
          SSH_HOST: ${{ inputs.environment == 'staging' && secrets.STAGING_HOST || inputs.environment == 'demo' && secrets.DEMO_HOST || secrets.PRODUCTION_HOST }}
          SSH_KNOWN_HOSTS: ${{ inputs.environment == 'staging' && secrets.STAGING_SSH_KNOWN_HOSTS || inputs.environment == 'demo' && secrets.DEMO_SSH_KNOWN_HOSTS || secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "host=$SSH_HOST" >> $GITHUB_OUTPUT

      - name: Determine target SHA
        id: target
        run: |
          if [ -n "${{ inputs.target_sha }}" ]; then
            echo "sha=${{ inputs.target_sha }}" >> $GITHUB_OUTPUT
            echo "Using provided SHA: ${{ inputs.target_sha }}"
          else
            PREV=$(ssh -i ~/.ssh/deploy_key root@${{ steps.ssh.outputs.host }} \
              "cat ~/${{ steps.env.outputs.dir }}/.deploy-state 2>/dev/null | grep '^PREVIOUS_SHA=' | cut -d= -f2")
            if [ -z "$PREV" ]; then
              echo "No .deploy-state found on server and no target_sha provided"
              exit 1
            fi
            echo "sha=$PREV" >> $GITHUB_OUTPUT
            echo "Using previous SHA from .deploy-state: $PREV"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate images exist in GHCR
        run: |
          SHA="${{ steps.target.outputs.sha }}"
          echo "Validating images for SHA: $SHA"
          docker manifest inspect ${{ env.BACKEND_IMAGE }}:$SHA > /dev/null 2>&1 \
            || { echo "Backend image :$SHA not found in GHCR"; exit 1; }
          docker manifest inspect ${{ env.FRONTEND_IMAGE }}:$SHA > /dev/null 2>&1 \
            || { echo "Frontend image :$SHA not found in GHCR"; exit 1; }
          echo "Both images verified in GHCR"

      - name: Rollback
        id: rollback
        run: |
          TARGET_SHA="${{ steps.target.outputs.sha }}"
          DEPLOY_DIR="${{ steps.env.outputs.dir }}"
          RESTORE_DB="${{ inputs.restore_db }}"

          set +e
          ssh -i ~/.ssh/deploy_key root@${{ steps.ssh.outputs.host }} \
            "TARGET_SHA=$TARGET_SHA DEPLOY_DIR=$DEPLOY_DIR RESTORE_DB=$RESTORE_DB bash -s" << 'ROLLBACK_SCRIPT'
            cd ~/$DEPLOY_DIR
            echo "Starting manual rollback to ${TARGET_SHA}..."

            # ── Database restore (if requested) ──
            if [ "$RESTORE_DB" = "true" ]; then
              BACKUP_FILE=$(ls -t ~/backups/$DEPLOY_DIR/backup-*.dump 2>/dev/null | head -1)
              if [ -z "$BACKUP_FILE" ]; then
                echo "No backup found in ~/backups/$DEPLOY_DIR/"
                exit 1
              fi
              echo "Restoring DB from: $(basename $BACKUP_FILE)"

              docker compose stop server frontend

              docker compose exec -T postgres psql -U postgres -d template1 -c "DROP DATABASE IF EXISTS postgres WITH (FORCE);" 2>/dev/null || true
              docker compose exec -T postgres psql -U postgres -d template1 -c "CREATE DATABASE postgres OWNER postgres;"
              docker compose exec -T postgres pg_restore -U postgres -d postgres --no-owner --no-acl "$BACKUP_FILE" || true

              # Verify DB is usable after restore
              if ! docker compose exec -T postgres psql -U postgres -d postgres -c "SELECT 1;" > /dev/null 2>&1; then
                echo "CRITICAL: Database restore verification failed — DB may be corrupt"
                exit 1
              fi
              echo "Database restored and verified"
            else
              docker compose stop server frontend
            fi

            # ── Override image tags to SHA-pinned versions ──
            sed -i "s|ghcr.io/moto-nrw/phoenix-server:[^ ]*|ghcr.io/moto-nrw/phoenix-server:${TARGET_SHA}|" docker-compose.yml
            sed -i "s|ghcr.io/moto-nrw/phoenix-frontend:[^ ]*|ghcr.io/moto-nrw/phoenix-frontend:${TARGET_SHA}|" docker-compose.yml

            # ── Pull and start ──
            docker compose pull
            if ! docker compose up -d --wait; then
              echo "CRITICAL: Rolled-back version also unhealthy!"
              exit 1
            fi

            # ── Update deploy state ──
            PREVIOUS_SHA=""
            if [ -f .deploy-state ]; then
              PREVIOUS_SHA=$(grep '^CURRENT_SHA=' .deploy-state | cut -d= -f2)
            fi
            echo "CURRENT_SHA=${TARGET_SHA}" > .deploy-state
            echo "PREVIOUS_SHA=${PREVIOUS_SHA}" >> .deploy-state
            echo "DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .deploy-state
            echo "BACKUP_FILE=" >> .deploy-state

            echo "Rollback to ${TARGET_SHA} complete"
          ROLLBACK_SCRIPT
          ROLLBACK_EXIT=$?
          set -e

          echo "rollback_exit=$ROLLBACK_EXIT" >> $GITHUB_OUTPUT

          if [ "$ROLLBACK_EXIT" -ne 0 ]; then
            exit 1
          fi

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Send failure notification
        if: always() && steps.rollback.outputs.rollback_exit != '' && steps.rollback.outputs.rollback_exit != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          SUBJECT="[CRITICAL] Manual rollback FAILED — ${{ inputs.environment }}"
          BODY="Manual rollback of ${{ inputs.environment }} to SHA ${{ steps.target.outputs.sha }} FAILED.\nImmediate manual intervention required.\n\nRestore DB: ${{ inputs.restore_db }}\nTriggered by: ${{ github.actor }}\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Phoenix CI <ci@ci.moto-app.de>\",\"to\":[\"mail@yannickwenger.de\"],\"subject\":\"${SUBJECT}\",\"text\":\"${BODY}\"}"
