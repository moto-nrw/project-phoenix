name: Backend PR regression benchmark
on:
  push:
    branches: [fix/backend-pr-ci-runtime]
permissions:
  contents: read
  checks: write
jobs:
  replay:
    uses: ./.github/workflows/test.yml
    with:
      run-backend: true
      run-frontend: false
      run-seed-smoke: false
      changed-scope: true
      base_ref: verify/backend-pr-4039-base
      # The real #4039 file list touches 72 Go package directories and selects
      # this full-suite path in main.yml, without the serial planning runner.
      full-backend-suite: true
      full-frontend-suite: false
