name: Notify Deploy Failure
description: Send email notification for deploy/rollback failures via Resend

inputs:
  exit_code:
    description: "Exit code from deploy or rollback script"
    required: true
  environment:
    description: "Target environment (staging, production)"
    required: true
  resend_api_key:
    description: "Resend API key"
    required: true
  run_url:
    description: "Full URL to the GitHub Actions run"
    required: true
  commit_url:
    description: "Full URL to the commit (empty for manual rollbacks)"
    required: false
    default: ""
  sha:
    description: "Commit or target SHA (will be truncated to 7 chars for display)"
    required: true
  actor:
    description: "GitHub actor who triggered the workflow"
    required: true
  notify_emails:
    description: "JSON array of email recipients, e.g. [\"a@b.com\",\"c@d.com\"]"
    required: true
  notification_type:
    description: "deploy or rollback"
    required: false
    default: "deploy"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        EXIT_CODE: ${{ inputs.exit_code }}
        ENV: ${{ inputs.environment }}
        TYPE: ${{ inputs.notification_type }}
        INPUT_SHA: ${{ inputs.sha }}
        COMMIT_URL: ${{ inputs.commit_url }}
        RUN_URL: ${{ inputs.run_url }}
        ACTOR: ${{ inputs.actor }}
        RESEND_API_KEY: ${{ inputs.resend_api_key }}
        NOTIFY_EMAILS: ${{ inputs.notify_emails }}
      run: |
        SHORT_SHA=$(echo "$INPUT_SHA" | cut -c1-7)

        # Display name: PRODUCTION in caps, others title-case
        if [ "$ENV" = "production" ]; then
          DISPLAY_ENV="PRODUCTION"
        else
          DISPLAY_ENV="$(echo "$ENV" | sed 's/./\U&/')"
        fi

        if [ "$TYPE" = "rollback" ]; then
          SUBJECT="[CRITICAL] Manual rollback FAILED — $DISPLAY_ENV"
          STATUS="Manual rollback of $DISPLAY_ENV to SHA <code>${SHORT_SHA}</code> FAILED.<br>Immediate manual intervention required."
          LINK_TEXT="View failed rollback →"
        elif [ "$EXIT_CODE" = "11" ]; then
          SUBJECT="[CRITICAL] $DISPLAY_ENV deploy + rollback FAILED"
          STATUS="Deployment to $DISPLAY_ENV failed AND automatic rollback also failed.<br>The $ENV environment may be <strong>DOWN</strong>.<br>Immediate manual intervention required."
          LINK_TEXT="View failed deployment →"
        elif [ "$EXIT_CODE" = "10" ]; then
          SUBJECT="[WARNING] $DISPLAY_ENV deploy failed — rolled back"
          STATUS="Deployment to $DISPLAY_ENV failed but was automatically rolled back to the previous version.<br>$DISPLAY_ENV is operational."
          LINK_TEXT="View failed deployment →"
        else
          SUBJECT="[INFO] $DISPLAY_ENV deploy aborted — no changes applied"
          STATUS="Deployment to $DISPLAY_ENV was aborted before any changes were applied (image pull or database backup failed).<br>$DISPLAY_ENV is operational on the previous version."
          LINK_TEXT="View failed deployment →"
        fi

        COMMIT_HTML=""
        if [ -n "$COMMIT_URL" ]; then
          COMMIT_HTML="Commit: <a href=\"${COMMIT_URL}\">${SHORT_SHA}</a><br>"
        else
          COMMIT_HTML="SHA: <code>${SHORT_SHA}</code><br>"
        fi

        BODY="<p>${STATUS}</p><p><a href=\"${RUN_URL}\">${LINK_TEXT}</a></p><p>${COMMIT_HTML}Triggered by: ${ACTOR}</p>"

        # Build JSON payload with jq to safely encode special characters for the Resend API.
        # This entire block is best-effort — notification failures must never mask the real deploy failure.
        if ! PAYLOAD=$(jq -n \
          --arg from "Phoenix CI <ci@ci.moto-app.de>" \
          --argjson to "$NOTIFY_EMAILS" \
          --arg subject "$SUBJECT" \
          --arg html "$BODY" \
          '{from: $from, to: $to, subject: $subject, html: $html}' 2>&1); then
          echo "::warning::Failed to build email payload (non-critical): $PAYLOAD"
          exit 0
        fi

        if ! HTTP_RESPONSE=$(curl -sS -o /tmp/resend_response.txt -w "%{http_code}" \
          -X POST https://api.resend.com/emails \
          -H "Authorization: Bearer $RESEND_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" 2>&1); then
          echo "::warning::Email notification request failed (non-critical): $HTTP_RESPONSE"
          exit 0
        fi

        if [ "$HTTP_RESPONSE" -ge 200 ] 2>/dev/null && [ "$HTTP_RESPONSE" -lt 300 ] 2>/dev/null; then
          echo "Email notification sent (HTTP $HTTP_RESPONSE)"
        else
          echo "::warning::Email notification rejected (HTTP $HTTP_RESPONSE, non-critical): $(cat /tmp/resend_response.txt 2>/dev/null)"
        fi
