name: CI cost
description: >-
  Estimates the runner cost of all CI runs of a pull request and keeps the
  cumulative total in one comment. Call it from a workflow_run workflow with
  actions read and pull-requests write. It reads only the GitHub API and never
  runs pull request code. PyrePortal uses it too.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/ci-cost.mjs"
