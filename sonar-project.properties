# SonarCloud CI-based Analysis Configuration
# This file is used by SonarScanner in GitHub Actions

sonar.projectKey=moto-nrw_project-phoenix
sonar.organization=moto-nrw

# Sources (use . for project root, paths in coverage are relative to root)
sonar.sources=.

# Tests
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.test.mjs,scripts/*_test.py

# Coverage Reports
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusions - non-code folders + test files (test files are covered by sonar.tests/sonar.test.inclusions)
# Test file exclusion prevents false-positive Security Hotspots (e.g. go:S1313 on fake IPs in fixtures)
# Also exclude .sql files - SonarCloud doesn't support PostgreSQL, only Oracle PL/SQL
# backend/internal/testdb/** is the hermetic test-database lifecycle (ADR 0004): pure test
# infrastructure like backend/test/**, never compiled into the server. Its go:S2077 hits are
# CREATE/DROP DATABASE DDL (no bind parameters possible) on internally generated, quoted
# identifiers, and go:S4036 is exec.LookPath for docker/psql on developer machines.
# Architecture testdata contains intentionally incomplete and invalid Go modules that exercise
# the policy checker. frontend/src/test/** contains Vitest setup and explicit fake credentials.
sonar.exclusions=**/node_modules/**,**/.next/**,**/openspec/**,**/docs/**,**/templates/**,loadtests/**,monitoring/**,**/*.sql,**/*_test.go,backend/test/**,backend/internal/testdb/**,backend/internal/architecture/testdata/**,frontend/src/test/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.test.mjs,scripts/*_test.py

# Coverage exclusions - non-production code and framework glue that shouldn't affect coverage metrics
# - backend/test/**: Test helpers/fixtures (not *_test.go but pure test infrastructure)
# - backend/database/database_config.go: Environment-based DSN selection with log.Fatal() branch
# - backend/database/db.go: DB connection boilerplate (implicitly tested by integration tests)
# - backend/database/migrations/**: Database DDL (validated by migration framework, not unit tests)
# - backend/cmd/**: CLI wiring/Cobra commands (thin glue code, not business logic)
# - backend/seed/**: Development fixture data (implicitly tested when app starts)
# - backend/simulator/**: IoT simulator for demos/testing (dev tool, not production code)
# - **/*.config.js, **/*.config.ts: Configuration files (not executable business logic)
# - frontend/src/test/**: Test setup and mocks (test infrastructure, not production code)
# - frontend/scripts/**: Build/test harnesses (e.g. Playwright guide-PDF generator), not production code
# - frontend/src/app/**: Next.js route, page, layout, and provider glue
# - frontend/src/components/**: UI rendering layer, covered by Vitest where behavior matters
# - backend/api/**: HTTP binding layer, business logic is covered in services and repositories
# - backend/auth/jwt/**: middleware glue around token parsing and context setup
# - outbox, scheduler, repository, model, and enrollment orchestration glue is exercised through higher-level integration paths
# Coverage-only exclusions below are developer tools and verified test support.
# Standalone fixture packages are absent from `go list -deps .`; every function
# in the explicitly listed *_test_helpers.go files is unreachable in
# `go tool deadcode -json .` (development 8291bcc9e2). Do not glob these names:
# school_membership_test_helpers.go and school_structure_test_helpers.go are live.
sonar.coverage.exclusions=frontend/scripts/**,backend/test/**,backend/cmd/**,backend/database/database_config.go,backend/database/db.go,backend/database/migrations/**,backend/seed/**,backend/simulator/**,loadtests/**,monitoring/**,**/*.config.js,**/*.config.ts,**/e2e/**,frontend/src/test/**,frontend/src/app/**,frontend/src/components/**,frontend/src/proxy.ts,frontend/src/lib/parent/route-wrapper.ts,frontend/src/lib/parent/route-wrapper.server.ts,frontend/src/lib/operator/route-wrapper.server.ts,frontend/src/lib/route-wrapper.ts,frontend/src/lib/route-wrapper.server.ts,frontend/src/lib/file-upload-wrapper.server.ts,frontend/src/lib/route-wrapper-utils.server.ts,frontend/src/lib/auth-proxy.server.ts,frontend/src/lib/client-headers.server.ts,frontend/src/lib/shell-auth-context.tsx,frontend/src/lib/enrollment-admin-api.ts,frontend/src/lib/hooks/use-require-admin.ts,frontend/src/lib/logger.ts,frontend/src/server/auth/parent.ts,frontend/src/server/auth/shared.ts,backend/api/**,backend/auth/jwt/**,backend/database/repositories/enrollment/**,backend/database/repositories/parent/**,backend/database/repositories/platform/email_outbox_repository.go,backend/database/repositories/users/student.go,backend/models/enrollment/**,backend/models/platform/email_outbox.go,backend/models/users/email_validation.go,backend/models/users/phone_validation.go,backend/models/users/student.go,backend/services/factory.go,backend/services/import/student_import_config.go,backend/services/parent/parent_service.go,backend/services/platform/outbox_*.go,backend/services/scheduler/activate_students.go,backend/services/scheduler/outbox_worker.go,backend/services/scheduler/rollover_deadline.go,backend/services/scheduler/scheduler.go,backend/services/auth/guardian_invitation_renderer.go,backend/services/auth/guardian_invitation_service.go,backend/services/auth/auth_login.go,backend/services/auth/auth_login_parent.go,backend/services/enrollment/**,backend/database/repositories/active/staff_absence.go,backen