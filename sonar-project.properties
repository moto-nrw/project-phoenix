# SonarCloud CI-based Analysis Configuration
# This file is used by SonarScanner in GitHub Actions

sonar.projectKey=moto-nrw_project-phoenix
sonar.organization=moto-nrw

# Sources (use . for project root, paths in coverage are relative to root)
sonar.sources=.

# Tests
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# Coverage Reports
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusions — non-code folders + test files (test files are covered by sonar.tests/sonar.test.inclusions)
# Test file exclusion prevents false-positive Security Hotspots (e.g. go:S1313 on fake IPs in fixtures)
# Also exclude .sql files - SonarCloud doesn't support PostgreSQL, only Oracle PL/SQL
# .github/workflows/e2e.yml is a CI-only test harness (sets up the postgres-test stack
# and seeds fixtures); SonarCloud's S6700 (--ignore-scripts) review rule fires on the
# pnpm install / playwright install lines, but adding the flag would skip legitimate
# postinstall hooks. Excluding the file is consistent with how other CI-only fixtures
# (test/, seed/, simulator/) are handled.
sonar.exclusions=**/node_modules/**,**/.next/**,**/openspec/**,**/docs/**,**/templates/**,**/*.sql,**/*_test.go,backend/test/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,.github/workflows/e2e.yml

# Issue-level ignores — kept narrow so the rule still fires elsewhere in the codebase.
# E1: Sonar's Jasmine analyzer flags Playwright spec files as "empty test files" because
#     it does not recognise `test(...)` imported from our custom fixtures module as a
#     real test invocation. The files contain real Playwright tests (uiTest / apiTest).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*:S2187
sonar.issue.ignore.multicriteria.e1.resourceKey=**/e2e/flows/*.spec.ts

# Coverage exclusions - non-production code that shouldn't affect coverage metrics
# - backend/test/**: Test helpers/fixtures (not *_test.go but pure test infrastructure)
# - backend/database/database_config.go: Environment-based DSN selection with log.Fatal() branch
# - backend/database/db.go: DB connection boilerplate (implicitly tested by integration tests)
# - backend/database/migrations/**: Database DDL (validated by migration framework, not unit tests)
# - backend/cmd/**: CLI wiring/Cobra commands (thin glue code, not business logic)
# - backend/seed/**: Development fixture data (implicitly tested when app starts)
# - backend/simulator/**: IoT simulator for demos/testing (dev tool, not production code)
# - **/*.config.js, **/*.config.ts: Configuration files (not executable business logic)
# - frontend/src/test/**: Test setup and mocks (test infrastructure, not production code)
sonar.coverage.exclusions=backend/test/**,backend/cmd/**,backend/database/database_config.go,backend/database/db.go,backend/database/migrations/**,backend/seed/**,backend/simulator/**,**/*.config.js,**/*.config.ts,**/e2e/**,frontend/src/test/**

# Duplication exclusions - test files have intentionally similar patterns
sonar.cpd.exclusions=**/*_test.go,backend/test/**

# Encoding
sonar.sourceEncoding=UTF-8
