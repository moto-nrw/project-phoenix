{{define "styles"}}
<style type="text/css">
body {
    background-color: #f8fafc;
    background-image: radial-gradient(#d9dee8 1px, transparent 1px);
    background-size: 18px 18px;
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

.email-container {
    max-width: 600px;
    margin: 0 auto;
    background-color: #ffffff;
    border-radius: 16px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    overflow: hidden;
}

.email-body {
    padding: 48px 40px;
}

p {
    color: #4b5563;
    line-height: 1.6;
    margin: 12px 0;
    font-size: 15px;
}

h1 {
    color: #111827;
    margin: 24px 0 20px 0;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0;
}

.school-brand {
    display: block;
    width: 100%;
    margin-bottom: 36px;
}

.school-logo,
.school-logo-fallback {
    display: inline-block;
    width: 48px;
    height: 48px;
    vertical-align: middle;
}

.school-logo {
    object-fit: contain;
    border-radius: 999px;
}

.school-logo-fallback {
    background-color: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    box-sizing: border-box;
    color: #111827;
    font-size: 13px;
    font-weight: 700;
    line-height: 48px;
    text-align: center;
}

.school-brand-copy {
    display: inline-block;
    padding-left: 14px;
    vertical-align: middle;
}

.school-kicker {
    color: #6b7280;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.2;
    margin: 0 0 4px 0;
    text-transform: uppercase;
}

.school-name {
    color: #111827;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
    margin: 0;
}

.brand {
    text-align: center;
    margin-bottom: 40px;
}

.button-wrapper {
    margin: 32px 0;
}

.button {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 12px;
    background-color: #111827;
    color: #ffffff !important;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: all 0.2s;
}

.highlight-box {
    background-color: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 16px 24px;
    margin: 24px 0;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
}

.highlight-box p {
    color: #6b7280;
    font-size: 14px;
    margin: 0;
    font-weight: 500;
}

.link-box {
    background-color: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 12px 16px;
    margin: 16px 0;
}

.link-box a {
    color: #374151;
    text-decoration: none;
    word-break: break-all;
    font-size: 13px;
    font-family: 'Monaco', 'Courier New', monospace;
}

.security-note {
    font-size: 13px;
    color: #9ca3af;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid #f3f4f6;
}

a {
    color: #374151;
}

#footer {
    background-color: #f8fafc;
    padding: 24px 40px;
    border-top: 1px solid #e5e7eb;
}

#footer p {
    color: #9ca3af;
    font-size: 13px;
    margin: 0;
}

.powered-by {
    color: #9ca3af;
    font-size: 12px;
    margin-top: 12px;
}

.powered-by span,
.powered-by strong {
    vertical-align: middle;
}

.powered-by strong {
    color: #6b7280;
    font-weight: 700;
}

.powered-by img {
    display: inline-block;
    height: 22px;
    margin-left: 6px;
    vertical-align: middle;
    width: auto;
}

#footer hr {
    display: none;
}

@media screen and (max-width: 480px) {
    body {
        padding: 10px;
    }

    .email-body {
        padding: 32px 24px;
    }

    /* button-wrapper text-align removed - inline styles in templates take precedence for email client compatibility */

    .button {
        padding: 14px 16px;
        display: block;
        box-sizing: border-box;
        text-align: center;
    }

    h1 {
        font-size: 22px;
    }

    p {
        font-size: 14px;
    }
}
</style>
{{end}}
