{{define "parent-message-notification.html"}}
{{template "header" .}}

<div class="email-body">
    {{template "school-brand" .}}
    <h1>{{.Subject}}</h1>

    <p>{{.Greeting}}</p>

    <p>{{.IntroText}}</p>

    <div class="button-wrapper" style="text-align: center; margin-top: 24px;">
        <a class="button" href="{{.MessagesURL}}">{{.ReplyLabel}}</a>
    </div>

    <p style="margin-top: 16px; font-size: 14px; color: #6b7280;">{{.FallbackHint}}</p>
    <div class="link-box">
        <a href="{{.MessagesURL}}">{{.MessagesURL}}</a>
    </div>

    <p style="margin-top: 24px; font-size: 14px; color: #6b7280;">{{.PreferenceHint}}</p>
</div>

{{template "footer" .}}
{{end}}
