version: 3
workdir: .

allow:
  depOnAnyVendor: true
  # The gate enforces package imports. DI implementation matching reports
  # injected service interfaces as reverse layer dependencies.
  deepScan: false

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*internal/architecture/testdata/.*\\.go$"

components:
  composition:
    in: [., api, cmd, internal/architecture, internal/architecture/cmd, services, seed/**, simulate]

  handlers: { in: api/** }

  services:
    in: services/**

  # Existing bridge: low-level device auth consumes services/iot while service
  # packages also use device auth. Keep the inversion visible until decoupled.
  device-auth: { in: auth/device }

  persistence:
    in:
      - database
      - database/migrations
      - database/repositories
      - database/repositories/**
      - internal/careplanning

  models: { in: models/** }

  foundation:
    in:
      - auth/userpass
      - internal/clientip
      - internal/collation
      - internal/holidays
      - internal/ical
      - internal/randstr
      - internal/schoolclass
      - internal/seedtoken
      - internal/sliceutil
      - internal/storage
      - internal/strutil
      - internal/timezone

  support:
    in:
      - analytics
      - applog
      - auth/authorize
      - auth/authorize/**
      - auth/jwt
      - auth/rotation
      - constants
      - email
      - integration/**
      - localization
      - middleware
      - observability
      - realtime
      - tenant

  test-support:
    in:
      - api/testutil
      - internal/ptrtest
      - internal/testdb
      - internal/testdb/**
      - services/auth/authtest
      - services/config/configtest
      - services/enrollment/enrollmenttest
      - services/schedule/scheduletest
      - services/users/userstest
      - test
      - test/**

deps:
  composition:
    mayDependOn:
      - composition
      - foundation
      - handlers
      - models
      - persistence
      - device-auth
      - services
      - support

  handlers:
    mayDependOn:
      - foundation
      - handlers
      - models
      - device-auth
      - services
      - support

  services:
    mayDependOn:
      - foundation
      - models
      - persistence
      - device-auth
      - services
      - support

  device-auth:
    mayDependOn: [models, services, support]

  persistence:
    mayDependOn: [foundation, models, persistence, support]

  models:
    mayDependOn: [foundation, models]

  foundation:
    mayDependOn: [foundation]

  support:
    mayDependOn: [foundation, models, support]

  test-support:
    anyProjectDeps: true
