minimumReleaseAge: 10080
trustPolicy: no-downgrade

# next-auth has exactly ONE provenance-signed release in its 727-version history:
# 0.0.0-manual.2824fa11 (canary, 2025-10-26). Under trustPolicy: no-downgrade that
# single canary permanently poisons the baseline, so every later publish (including
# the advisory fix beta.32) is rejected as a "trust downgrade". Checked before
# excluding: beta.32 has the same publisher as the installed beta.31
# (better-gustavo), 4.24.15 shipped 22 min later as the coordinated fix for the
# 4.x line, and @auth/core 0.41.3 (which carries the actual patches) does have
# valid SLSA provenance. Scoped to this one version on purpose, so re-evaluate on
# every next-auth bump.
trustPolicyExclude:
  - next-auth@5.0.0-beta.32
  # semver 6.3.1 (2023-07-10) is the official npm-team ReDoS backport for the 6.x
  # line (CVE-2022-25883) and predates provenance on that branch. The check
  # compares publish dates across ALL majors, and the parallel 7.5.x releases
  # (May/June 2023) already had SLSA provenance, so the backport is flagged as a
  # downgrade. Known pnpm false positive (pnpm/pnpm#10202, discussion #11084).
  - semver@6.3.1

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

overrides:
  # Tests use happy-dom; do not retain Vitest's unused optional jsdom peer.
  "vitest>jsdom": "-"
  "@radix-ui/react-focus-scope": ^1.1.12
  "picomatch@<2.3.2": 2.3.2
  "picomatch@>=4 <4.0.4": 4.0.4
  "postcss@<8.5.23": 8.5.23
  "smol-toml@<1.6.1": 1.6.1
  "nanoid@<3.3.18": 3.3.18
  "dompurify@<=3.4.12": 3.4.13
  "undici@>=7.0.0 <7.29.0": 7.29.0
  "fast-uri@>=3.0.0 <3.1.5": 3.1.5
  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9

peerDependencyRules:
  allowedVersions:
    "next-auth>next": ">=14"
