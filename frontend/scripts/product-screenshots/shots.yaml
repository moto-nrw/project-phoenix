# Die Shot-Liste der Produkt-Screenshots (#3759). Ein Eintrag ist ein Shot;
# seine ID bleibt über Releases gleich, weil sie die Dateinamen bestimmt.
#
#   id           deutscher Kebab-Slug (a-z, 0-9, Bindestrich; Umlaute als ae/oe/ue)
#   titel        Name für Menschen, landet im Manifest
#   portal       tenant | eltern | traeger
#   rolle        admin | betreuer (tenant) | eltern | traeger
#   pfad         Pfad im Portal, so wie ihn die Person in der Adressleiste sieht
#   geraete      optional: macbook | ipad | iphone.
#                Standard: tenant und traeger = macbook + ipad,
#                eltern = iphone + ipad
#   vorbereitung optional: Schritte vor dem Foto, jeweils genau eines von
#                klicken (Selektor), warten_auf (Selektor),
#                scrollen (Pixel oder Selektor), tippen ({feld: Selektor,
#                text: Text}) und zeichnen (Selektor einer Zeichenfläche).
#                Ein Klick darf auf eine andere Seite führen, etwa auf ein
#                Kind, dessen ID erst der Seed vergibt; geprüft wird, dass
#                `pfad` selbst erreichbar ist. `scrollen` mit Selektor legt
#                das Element an den oberen Rand, unter die Kopfleiste.
#                `tippen` füllt ein Feld, `zeichnen` zieht einen Schriftzug
#                mit der Maus über die Fläche (Unterschrift).
#
# Unbekannte Felder schlagen beim Laden fehl. Die Daten kommen aus dem
# Seed-Profil `vollbetrieb` (backend/internal/devtools/seedapi), dem
# Standardprofil des Seeders und der Demo, nach `simulate full-day`. Das erste
# Elternkonto (Sabine Schneider) ist das Elternteil von Felix Schneider; die
# Kinderakte zeigt Noah Richter. Kinder mit Elternkonto meldet der Seed nie
# krank, beide sind anwesend. An Betreuungstagen hängt die Kinderkarte Noahs
# Tagesänderung an den Namen („Noah Richter, … - Details öffnen“), daher der
# reguläre Ausdruck. Ins Träger-Portal meldet sich der Schul-Admin des Profils
# an, den der Seed zur ersten Person des Träger-Büros macht.
#
# Die Vorbereitung speichert keine Eingabe (Antwort, Entscheidung,
# Einstellung): Die Schritte laufen für jedes Gerät erneut, und gespeicherte
# Daten verändern spätere Shots. Ein Formular auszufüllen, ein Häkchen zu
# setzen oder eine Auswahl zu öffnen ist erlaubt, solange niemand absendet.
# Dass ein geöffneter Elternbrief als gelesen gilt, lässt sich nicht vermeiden.
#
# Auswahl (#3764, vom Maintainer bestätigt): die Flows der Hilfe und die
# Nutzung laut PostHog (nur lesend abgefragt). Erfasst sind Seitenaufrufe der
# Produktion seit dem 02.08.2026, früher gab es keine Daten; Zahlen mit
# "in 8 Tagen" stammen aus der neuen Erfassung ab 25.09.2026. Die Zeile über
# jedem Shot nennt seinen Grund. Die IDs folgen den Namen der
# Hilfe-Screenshots (frontend/public/help/screens), wo es einen für dieselbe
# Ansicht gibt, sonst dem Seitennamen; Shots aus dem Eltern-Portal beginnen
# mit `eltern-`, Shots aus dem Träger-Portal mit `traeger-`.
# `anwesenheit-ueberblick` bleibt aus dem Tracer (#3761), weil eine ID die
# Dateinamen in Drive bestimmt.
#
# Ergänzung: Motive, die die Website (moto-nrw/website) zeigt und die die
# Shot-Liste nicht hatte. Ihre Zeile nennt das Motiv der Website.
shots:
  # --- Tagesbetrieb ---------------------------------------------------------
  # Hilfe erste-schritte-mit-moto; PostHog: meistbesuchte Seite (1665 Aufrufe in 8 Tagen). ID aus dem Tracer #3761
  - id: anwesenheit-ueberblick
    titel: Startseite mit der Anwesenheit des Tages
    portal: tenant
    rolle: admin
    pfad: /home
  # Hilfe kindersuche; PostHog: Platz 1 der Seiten (7595 Aufrufe, 11 Schulen)
  - id: kindersuche
    titel: Alle Kinder mit Aufenthaltsort
    portal: tenant
    rolle: admin
    pfad: /students/search
  # Hilfe kind-an-und-abmelden; PostHog: Kindersuche zu 51 % mobil
  - id: kinder-an-und-abmelden
    titel: Kinder an- und abmelden
    portal: tenant
    rolle: admin
    pfad: /students/search
    geraete: [iphone, ipad, macbook]
    vorbereitung:
      - klicken: 'role=button[name="Kinder an- und abmelden"]'
  # Hilfe kindersuche, angaben-eines-kindes-verwalten; PostHog: Platz 2 (6281 Aufrufe)
  - id: kinderdetailansicht
    titel: Kinderakte mit dem heutigen Tag
    portal: tenant
    rolle: admin
    pfad: /students/search
    vorbereitung:
      - klicken: 'role=button[name=/^Noah Richter\b.*Details öffnen$/]'
      - warten_auf: 'role=tab[name="Stammdaten"]'
  # Hilfe betreuungszeiten-eintragen, kind-angaben-aendern
  - id: betreuungszeiten-pflegen
    titel: Betreuungszeiten eines Kindes
    portal: tenant
    rolle: admin
    pfad: /students/search
    vorbereitung:
      - klicken: 'role=button[name=/^Noah Richter\b.*Details öffnen$/]'
      - warten_auf: 'role=tab[name="Stammdaten"]'
      - klicken: '[role="tab"][data-tab-value="betreuungszeiten"]'
      - scrollen: 'role=heading[name="Betreuungszeiten"s]'
  # Hilfe abwesenheiten; PostHog: 253 Abwesenheitsmeldungen
  - id: kinderdetail-krank-melden
    titel: Ein Kind krank melden
    portal: tenant
    rolle: admin
    pfad: /students/search
    vorbereitung:
      - klicken: 'role=button[name=/^Noah Richter\b.*Details öffnen$/]'
      - warten_auf: 'role=tab[name="Stammdaten"]'
      - klicken: 'main button:has-text("Krank melden")'
      - warten_auf: '[role="dialog"]'
      # Ein Tag der Woche schaltet „Krankmelden“ frei; abgeschickt wird nicht.
      - klicken: '[role="dialog"] button:not([disabled]):has(span:text-is("Mi"))'
      - tippen:
          feld: '[role="dialog"] textarea'
          text: 'Mutter hat angerufen: Noah hat Fieber.'
  # Hilfe meine-gruppen; PostHog: Platz 3 (3933 Aufrufe), meist Betreuer am
  # Handy. Als Betreuerin: Julia Klein leitet die Sternengruppe; der Admin hat
  # keine eigene Gruppe, die Seitenleiste zeigte „Keine eigenen Gruppen“.
  - id: meine-gruppen
    titel: Meine Gruppe mit allen Kindern
    portal: tenant
    rolle: betreuer
    pfad: /ogs-groups
    geraete: [iphone, ipad, macbook]
  # Hilfe gruppe-uebergeben
  - id: gruppe-uebergeben
    titel: Gruppe vorübergehend übergeben
    portal: tenant
    rolle: admin
    pfad: /ogs-groups
    vorbereitung:
      - klicken: 'role=button[name="Weitere Aktionen"]'
      - klicken: 'text=Gruppe übergeben'
      - warten_auf: '[role="dialog"]'
      # Die offene Auswahl zeigt, an wen die Gruppe gehen kann.
      - klicken: '#transfer-user-select'
      - warten_auf: 'role=listbox'
  # Hilfe aktuelle-aufsicht; PostHog: 3061 Aufrufe, im Median 54 min offen
  - id: aktuelle-aufsicht
    titel: Laufende Aufsicht im Raum
    portal: tenant
    rolle: betreuer
    pfad: /active-supervisions
  # Hilfe aktuelle-aufsicht (Spontane Aktivität starten)
  - id: spontane-aktivitaet
    titel: Spontane Aktivität starten
    portal: tenant
    rolle: admin
    pfad: /active-supervisions
    vorbereitung:
      - klicken: 'main button:has-text("Spontane Aktivität starten")'
      - warten_auf: '[role="dialog"]'
  # Hilfe tagesplan-ansehen; PostHog: 2224 Aufrufe
  - id: tagesplan
    titel: Tagesplan mit laufenden Blöcken
    portal: tenant
    rolle: betreuer
    pfad: /tagesplan
  # Hilfe raeume-und-belegung
  - id: raeume
    titel: Räume und ihre Belegung
    portal: tenant
    rolle: admin
    pfad: /rooms

  # --- Eltern ---------------------------------------------------------------
  # Hilfe eltern-nachricht-schreiben; PostHog: 997 Aufrufe
  - id: nachrichten
    titel: Nachrichten von Eltern
    portal: tenant
    rolle: admin
    pfad: /messages
  # Hilfe eltern-nachricht-schreiben; PostHog: 606 Aufrufe der Verläufe
  - id: nachrichten-verlauf
    titel: Gespräch mit einer Familie
    portal: tenant
    rolle: admin
    pfad: /messages
    vorbereitung:
      - klicken: 'text=Sabine Schneider'
      - warten_auf: 'main textarea'
  # Hilfe elternanfragen-bearbeiten; PostHog: 607 Aufrufe, 82 Abholentscheidungen
  - id: offene-anfragen
    titel: Offene Anfragen von Eltern
    portal: tenant
    rolle: admin
    pfad: /anfragen
  # Hilfe elternmitteilung-veroeffentlichen, elternbrief-versenden
  - id: elternbriefe
    titel: Elternmitteilungen
    portal: tenant
    rolle: admin
    pfad: /parent-announcements
  # Hilfe essensplan-veroeffentlichen
  - id: essensplan
    titel: Speiseplan der Woche
    portal: tenant
    rolle: admin
    pfad: /meal-plan

  # --- Team -----------------------------------------------------------------
  # Hilfe arbeitszeit-und-pausen-erfassen; PostHog: 919 Aufrufe, 70 % mobil
  - id: zeiterfassung
    titel: Arbeitszeit erfassen
    portal: tenant
    rolle: betreuer
    pfad: /time-tracking
    geraete: [iphone, ipad, macbook]
  # Hilfe urlaub-beantragen
  - id: urlaub-beantragen
    titel: Urlaub beantragen
    portal: tenant
    rolle: betreuer
    pfad: /time-tracking
    vorbereitung:
      - klicken: 'role=button[name="Urlaub beantragen"]'
      - warten_auf: '[role="dialog"]'
      # Zeitraum im nächsten Monat, vom 9. bis zum 13.: Der Seed legt Urlaub
      # in diese und die nächste Woche, „Nächste Woche“ könnte sich damit
      # überschneiden. Abgeschickt wird nicht.
      - klicken: '[role="dialog"] >> role=button[name="Nächster Monat"s]'
      - klicken: '[role="dialog"] >> role=grid >> nth=0 >> text="9"'
      - klicken: '[role="dialog"] >> role=grid >> nth=0 >> text="13"'
      - tippen:
          feld: '#vacation-note'
          text: Vertretung mit dem Team abgestimmt.
  # Hilfe person-im-team-finden; PostHog: 716 Aufrufe
  - id: mitarbeiter
    titel: Das Team im Überblick
    portal: tenant
    rolle: admin
    pfad: /staff
  # Hilfe team-chat-nutzen
  - id: team-chat
    titel: Team-Chat
    portal: tenant
    rolle: admin
    pfad: /team-chat
  # Hilfe tagesinformationen-schreiben; PostHog: im Median 209 s offen
  - id: tagesinformationen
    titel: Tagesinformationen für das Team
    portal: tenant
    rolle: admin
    pfad: /tagesinformationen
  # Hilfe meine-termine-und-einsaetze; PostHog: 261 Aufrufe
  - id: kalender
    titel: Mein Kalender
    portal: tenant
    rolle: admin
    pfad: /calendar

  # --- Planung --------------------------------------------------------------
  # Hilfe betreuungsplan-erstellen; PostHog: 364 Aufrufe in 11 Schulen.
  # Darstellung „Kompakt“: Mit der Standardbreite passt nur ein Tag ins Bild,
  # und das Raster springt auf heute. Kompakt zeigt die ganze Woche; die
  # Wahl ist reiner Seitenzustand und wird nicht gespeichert.
  - id: betreuungsplan
    titel: Betreuungsplan der Woche
    portal: tenant
    rolle: admin
    pfad: /betreuungsplan
    vorbereitung:
      - klicken: 'role=button[name="Weitere Aktionen"s]'
      - klicken: 'role=menuitemradio[name="Kompakt"s]'
  # Hilfe vertretung-planen
  - id: vertretungsplan
    titel: Vertretung planen
    portal: tenant
    rolle: admin
    pfad: /vertretung

  # Website: Dienstplan des Teams
  - id: dienstplan
    titel: Dienstplan des Teams
    portal: tenant
    rolle: admin
    pfad: /dienstplan

  # --- Anmeldung ------------------------------------------------------------
  # Website: Online-Anmeldung mit freien Plätzen je Angebot
  - id: anmeldephase
    titel: Anmeldungen einer Phase mit freien Plätzen
    portal: tenant
    rolle: admin
    pfad: /admin/enrollments
    vorbereitung:
      - klicken: 'article:has-text("Anmeldung Schuljahr") >> role=link[name="Anmeldungen ansehen"]'
      - warten_auf: 'text=Freie Plätze je Angebot'
  # Website: Platzentscheidung. Emil Graf ist im Seed noch offen; der Shot
  # zeigt nur die Auswahl und speichert nichts.
  - id: anmeldung-entscheiden
    titel: Über einen Platz entscheiden
    portal: tenant
    rolle: admin
    pfad: /admin/enrollments
    vorbereitung:
      - klicken: 'article:has-text("Anmeldung Schuljahr") >> role=link[name="Anmeldungen ansehen"]'
      - warten_auf: 'text=Freie Plätze je Angebot'
      - klicken: 'tr:has-text("Emil Graf") >> role=link[name="Anmeldung ansehen"]'
      - warten_auf: 'text=Entscheidung speichern'
      - scrollen: 'role=heading[name="Angaben der Kinder"s]'

  # --- Elternkommunikation --------------------------------------------------
  # Website: Elternbrief mit Rückmeldung; Stand der Einverständnisse
  - id: einverstaendnis-stand
    titel: Stand der Antworten auf ein Einverständnis
    portal: tenant
    rolle: admin
    pfad: /parent-announcements?art=erklaerungen
    vorbereitung:
      - klicken: 'text=Einverständnis: Ausflug in den Zoo >> visible=true'
      - warten_auf: 'role=heading[name="Stand der Antworten"]'
      - warten_auf: 'text=Kinder mit Antwort'
      - scrollen: 'role=heading[name="Stand der Antworten"s]'
  # Website: Umfrage mit Auswertung. Der Seed lässt die anderen Familien
  # antworten; Sabine Schneider bleibt offen (eltern-umfrage-beantworten).
  - id: umfrage-auswertung
    titel: Auswertung einer Umfrage
    portal: tenant
    rolle: admin
    pfad: /parent-announcements?art=umfragen
    vorbereitung:
      - klicken: 'text=Termine für den Elternsprechtag >> visible=true'
      - warten_auf: 'role=heading[name="Auswertung"]'
      - scrollen: 'role=heading[name="Auswertung"]'
  # Website: Pädagogische Dokumentation; Notizen in der Kinderakte
  - id: kinderakte-notizen
    titel: Notizen und Beobachtungen zu einem Kind
    portal: tenant
    rolle: admin
    pfad: /students/search
    vorbereitung:
      - klicken: 'role=button[name=/^Felix Schneider\b.*Details öffnen$/]'
      - warten_auf: 'role=tab[name="Stammdaten"]'
      # Der Reiter steht im Adressparameter ?tab=. Im Lauf für PR #4947 ging
      # ein Klick vor dem Laden der Kinderdaten verloren, ein zweiter Klick
      # schaltet zurück. Deshalb erst die geladenen Tagesdaten abwarten, dann
      # genau einmal klicken. Ohne die Notiz aus dem Seed schlägt der Shot fehl.
      - warten_auf: 'text=Heutige Abholung'
      - klicken: '[role="tab"][data-tab-value="notizen"]'
      - warten_auf: 'text=Braucht morgens etwas Zeit >> visible=true'

  # --- Verwaltung -----------------------------------------------------------
  # Hilfe datenverwaltung; PostHog: 880 Aufrufe
  - id: datenverwaltung
    titel: Datenverwaltung
    portal: tenant
    rolle: admin
    pfad: /database
  # Website: Rollen und Zugriffsrechte
  - id: rollen-und-rechte
    titel: Rollen und ihre Berechtigungen
    portal: tenant
    rolle: admin
    pfad: /database/roles
    vorbereitung:
      - klicken: 'role=button[name=/^Betreuung Betreut/]'
      - warten_auf: 'role=tab[name="Berechtigungen"]'
      - klicken: 'role=tab[name="Berechtigungen"]'
      - warten_auf: 'text=/Berechtigungen? zugewiesen/'
  # Website: Datenübergabe an die Verwaltung
  - id: exporte
    titel: Listen und Exporte
    portal: tenant
    rolle: admin
    pfad: /database/exports
  # Hilfe kinder-anlegen; PostHog: 1189 Aufrufe
  - id: datenverwaltung-kinder
    titel: Kinder verwalten
    portal: tenant
    rolle: admin
    pfad: /database/students
  # Hilfe einstellungen-ueberblick
  - id: einstellungen
    titel: Einstellungen der Schule
    portal: tenant
    rolle: admin
    pfad: /settings

  # --- Eltern-Portal --------------------------------------------------------
  # PostHog: meistbesuchte Seite im Eltern-Portal (1013 Aufrufe)
  - id: eltern-start
    titel: Startseite im Eltern-Portal
    portal: eltern
    rolle: eltern
    pfad: /
  # Hilfe mein-kind-und-den-heutigen-tag-ansehen; PostHog: 295 Aufrufe (dazu
  # 238 für /children). Felix ist das einzige Kind des Elternkontos, die
  # Übersicht der Kinder sah genauso aus; sie hat keinen eigenen Shot.
  - id: eltern-kind-heute
    titel: Der Tag meines Kindes
    portal: eltern
    rolle: eltern
    pfad: /children
    vorbereitung:
      - klicken: 'text=Felix Schneider'
      - warten_auf: 'main button:has-text("Felix abmelden")'
  # Hilfe abwesenheit-meines-kindes-melden; PostHog: 75 Abwesenheitsanfragen
  - id: eltern-kind-abmelden
    titel: Kind abmelden
    portal: eltern
    rolle: eltern
    pfad: /children
    vorbereitung:
      - klicken: 'text=Felix Schneider'
      - warten_auf: 'role=tab'
      - klicken: 'main button:has-text("Felix abmelden")'
      - warten_auf: '[role="dialog"]'
      # Entschuldigung für morgen mit Grund; abgeschickt wird nicht.
      - klicken: '[role="dialog"] [aria-label="Grund der Abwesenheit"]'
      - klicken: 'role=listbox >> role=option[name="Entschuldigen"s]'
      - klicken: '[role="dialog"] >> role=button[name="Erster Tag"s]'
      - klicken: 'td[data-today] ~ td:not([data-disabled]) button, tr:has(td[data-today]) + tr td:not([data-disabled]) button'
      - tippen:
          feld: '[role="dialog"] textarea'
          text: Arzttermin am Nachmittag
  # Hilfe abholzeit-fuer-einen-tag-aendern; PostHog: 86 Abholänderungen
  - id: eltern-abholzeit-aendern
    titel: Abholzeit für einen Tag ändern
    portal: eltern
    rolle: eltern
    pfad: /children
    vorbereitung:
      - klicken: 'text=Felix Schneider'
      - warten_auf: 'role=tab'
      - klicken: 'main button:has-text("Abhol")'
      - warten_auf: '[role="dialog"]'
      # Morgen statt heute (für heute hat die OGS die Abholung schon
      # festgelegt), mit Uhrzeit und Grund; abgeschickt wird nicht.
      - klicken: '[role="dialog"] >> role=button[name="Tag"s]'
      - klicken: 'td[data-today] ~ td:not([data-disabled]) button, tr:has(td[data-today]) + tr td:not([data-disabled]) button'
      - tippen:
          feld: '[role="dialog"] label:has-text("Abholzeit") input'
          text: '14:30'
      - tippen:
          feld: '[role="dialog"] textarea'
          text: Felix hat nachmittags einen Zahnarzttermin.
  # Hilfe als-elternteil-nachrichten-lesen; PostHog: 323 Aufrufe, Verläufe
  # 165 Aufrufe, im Median 821 s offen. Felix ist das einzige Kind des
  # Elternkontos: Die Seite öffnet seinen Verlauf direkt, eine Liste gibt es
  # nicht. Der Verlauf hat deshalb keinen eigenen Shot.
  - id: eltern-nachrichten
    titel: Nachrichten an die OGS
    portal: eltern
    rolle: eltern
    pfad: /messages
    vorbereitung:
      - warten_auf: 'main textarea'
  # Hilfe als-elternteil-den-kalender-ansehen; PostHog: 132 Aufrufe
  - id: eltern-kalender
    titel: Termine der Schule
    portal: eltern
    rolle: eltern
    pfad: /calendar
  # Hilfe elternbriefe-lesen
  - id: eltern-elternbriefe
    titel: Elternbriefe
    portal: eltern
    rolle: eltern
    pfad: /news
  # Hilfe elternbriefe-lesen
  - id: eltern-elternbrief-lesen
    titel: Einen Elternbrief lesen
    portal: eltern
    rolle: eltern
    pfad: /news
    vorbereitung:
      - klicken: 'main button:has-text("Elternbrief: Unser Laternenfest")'
      - warten_auf: '[role="dialog"]'
  # Hilfe mittagessen-ansehen; PostHog: im Median 735 s offen. Die nächste
  # Woche zeigt die gebuchten Tage vollständig.
  - id: eltern-mittagessen
    titel: Mittagessen der Woche
    portal: eltern
    rolle: eltern
    pfad: /meal-plan
    vorbereitung:
      - klicken: 'role=button[name="Nächste Woche"s]'

  # Hilfe elternbriefe-lesen; Website: Elternbrief mit Rückmeldung (Umfrage)
  - id: eltern-umfrage-beantworten
    titel: Eine Umfrage beantworten
    portal: eltern
    rolle: eltern
    pfad: /news
    vorbereitung:
      - klicken: 'main button:has-text("Termine für den Elternsprechtag")'
      - warten_auf: '[role="dialog"]'
      # Zwei Termine ankreuzen, ohne zu speichern. Nach Position statt nach
      # Datum: Der Seed legt die Termine relativ zu heute.
      - klicken: '[role="dialog"] label:has(input[type="checkbox"]) >> nth=1'
      - klicken: '[role="dialog"] label:has(input[type="checkbox"]) >> nth=4'
  # Website: Digitale Erklärung mit Unterschrift. Sabine hat das Einverständnis
  # im Seed schon unterschrieben; der Nachweis zeigt die Unterschrift.
  - id: eltern-erklaerung-nachweis
    titel: Nachweis einer unterschriebenen Erklärung
    portal: eltern
    rolle: eltern
    pfad: /news
    vorbereitung:
      - klicken: 'main button:has-text("Einverständnis: Ausflug in den Zoo")'
      - warten_auf: '[role="dialog"]'
      - klicken: 'role=link[name="Nachweis ansehen"]'
      - warten_auf: 'img[alt^="Unterschrift von"]'
  # Website: Digitale Erklärung mit Unterschrift. Das zweite Einverständnis
  # aus dem Seed lässt die Familie offen. „Zustimmen“ öffnet nur das Fenster
  # zum Unterschreiben; der Schriftzug bleibt im Feld, bestätigt und
  # abgeschickt wird nicht.
  - id: eltern-erklaerung-unterschreiben
    titel: Eine Erklärung digital unterschreiben
    portal: eltern
    rolle: eltern
    pfad: /news
    vorbereitung:
      - klicken: 'main button:has-text("Einverständnis: Schwimmkurs im Hallenbad")'
      - warten_auf: '[role="dialog"]'
      - klicken: '[role="dialog"] >> role=button[name="Zustimmen"s]'
      - warten_auf: 'canvas[aria-label="Feld zum Unterschreiben"]'
      - zeichnen: 'canvas[aria-label="Feld zum Unterschreiben"]'
  # Website: Essenstage ändern. Nur der Dialog, ohne Speichern.
  - id: eltern-essenstage-aendern
    titel: Feste Essenstage ändern
    portal: eltern
    rolle: eltern
    pfad: /meal-plan
    vorbereitung:
      - klicken: 'role=button[name=/^Ändern$/]'
      - warten_auf: 'text=Feste Tage ändern'
      - klicken: 'fieldset:has-text("Feste Tage ändern") label:has-text("Freitag")'
  # Website: Kontakte und Abholberechtigte
  - id: eltern-kontakte-abholung
    titel: Kontakte und Abholberechtigte
    portal: eltern
    rolle: eltern
    pfad: /children
    vorbereitung:
      - klicken: 'text=Felix Schneider'
      - warten_auf: 'role=tab'
      - klicken: 'role=tab[name="Kontakte & Abholung"]'
      - warten_auf: 'text=Abholberechtigte und Kontakte'
      - scrollen: 'role=heading[name="Abholberechtigte und Kontakte"s]'
  # Website: Online-Anmeldung, auch für Geschwister
  - id: eltern-online-anmeldung
    titel: Online-Anmeldung mit mehreren Kindern
    portal: eltern
    rolle: eltern
    pfad: /anmeldung
    vorbereitung:
      - klicken: 'role=link[name^="Anmeldung öffnen"] >> nth=0'
      - warten_auf: 'role=button[name="Weiteres Kind"]'
      - klicken: 'role=button[name="Weiteres Kind"]'
      # Zwei Geschwister ausfüllen; abgeschickt wird nicht. Die Felder der
      # erziehungsberechtigten Person füllt das Profil vor; Vor- und Nachname
      # stehen hier noch einmal, falls es leer bleibt. Die Kinder tragen einen
      # Namen, den der Seed nicht vergibt.
      - tippen: { feld: 'input[name="guardian_first_name"]', text: Sabine }
      - tippen: { feld: 'input[name="guardian_last_name"]', text: Schneider }
      - tippen: { feld: 'input[name="children_0_first_name"]', text: Lotta }
      - tippen: { feld: 'input[name="children_0_last_name"]', text: Krämer }
      - klicken: '[aria-label="Tag"] >> nth=0'
      - klicken: 'role=listbox >> role=option[name="14"s]'
      - klicken: '[aria-label="Monat"] >> nth=0'
      - klicken: 'role=listbox >> role=option[name="März"s]'
      - klicken: '[aria-label="Jahr"] >> nth=0'
      - klicken: 'role=listbox >> role=option[name="2019"s]'
      - klicken: '#children-0-target-grade-level'
      - klicken: 'role=listbox >> role=option[name="2. Klasse"s]'
      - tippen: { feld: 'input[name="children_1_first_name"]', text: Jonas }
      - tippen: { feld: 'input[name="children_1_last_name"]', text: Krämer }
      - klicken: '[aria-label="Tag"] >> nth=1'
      - klicken: 'role=listbox >> role=option[name="2"s]'
      - klicken: '[aria-label="Monat"] >> nth=1'
      - klicken: 'role=listbox >> role=option[name="Juni"s]'
      - klicken: '[aria-label="Jahr"] >> nth=1'
      - klicken: 'role=listbox >> role=option[name="2020"s]'
      - klicken: '#children-1-target-grade-level'
      - klicken: 'role=listbox >> role=option[name="1. Klasse"s]'
      - scrollen: 'role=heading[name="Kind oder Kinder"s]'
  # Website: Eltern-App in vielen Sprachen. Nur die Auswahl, ohne Wechsel:
  # Die Sprache gilt für das Konto und damit für alle späteren Eltern-Shots.
  # Nachrichten selbst übersetzt moto nicht.
  - id: eltern-sprache-waehlen
    titel: Sprache der Eltern-App wählen
    portal: eltern
    rolle: eltern
    pfad: /settings
    vorbereitung:
      - klicken: '[aria-haspopup="listbox"][aria-label="Sprache"]'
      - warten_auf: 'role=listbox'

