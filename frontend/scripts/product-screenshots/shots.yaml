# Die Shot-Liste der Produkt-Screenshots (#3759). Ein Eintrag ist ein Shot;
# seine ID bleibt über Releases gleich, weil sie die Dateinamen bestimmt.
#
#   id           deutscher Kebab-Slug (a-z, 0-9, Bindestrich; Umlaute als ae/oe/ue)
#   titel        Name für Menschen, landet im Manifest
#   portal       tenant | eltern
#   rolle        admin | betreuer (tenant) | eltern
#   pfad         Pfad im Portal, so wie ihn die Person in der Adressleiste sieht
#   geraete      optional: macbook | ipad | iphone.
#                Standard: tenant = macbook + ipad, eltern = iphone + ipad
#   vorbereitung optional: Schritte vor dem Foto, jeweils genau eines von
#                klicken (Selektor), warten_auf (Selektor), scrollen (Pixel oder Selektor).
#                Ein Klick darf auf eine andere Seite führen, etwa auf ein
#                Kind, dessen ID erst der Seed vergibt; geprüft wird, dass
#                `pfad` selbst erreichbar ist.
#
# Unbekannte Felder schlagen beim Laden fehl. Die Daten kommen aus dem
# Seed-Profil `marketing` (backend/seed/api).
#
# Reihenfolge und Auswahl (#3764): die Flows der Hilfe und die Nutzung laut
# PostHog (Seitenaufrufe Produktion, Aug.–Okt. 2026). Die IDs folgen den
# Namen der Hilfe-Screenshots (frontend/public/help/screens); Shots aus dem
# Eltern-Portal beginnen mit `eltern-`.
shots:
  # --- Tagesbetrieb ---------------------------------------------------------
  - id: anwesenheit-ueberblick
    titel: Startseite mit der Anwesenheit des Tages
    portal: tenant
    rolle: admin
    pfad: /home
  - id: kindersuche
    titel: Alle Kinder mit Aufenthaltsort
    portal: tenant
    rolle: admin
    pfad: /students/search
  - id: kinder-an-und-abmelden
    titel: Kinder an- und abmelden
    portal: tenant
    rolle: admin
    pfad: /students/search
    geraete: [iphone, ipad, macbook]
    vorbereitung:
      - klicken: 'role=button[name="Kinder an- und abmelden"]'
  - id: kinderdetailansicht
    titel: Kinderakte mit dem heutigen Tag
    portal: tenant
    rolle: admin
    pfad: /students/search
    vorbereitung:
      - klicken: 'role=button[name="Finn Hartmann - Details öffnen"]'
      - warten_auf: 'role=tab[name="Stammdaten"]'
  - id: kinderdetail-betreuungszeiten
    titel: Betreuungszeiten eines Kindes
    portal: tenant
    rolle: admin
    pfad: /students/search
    vorbereitung:
      - klicken: 'role=button[name="Finn Hartmann - Details öffnen"]'
      - warten_auf: 'role=tab[name="Stammdaten"]'
      - klicken: '[role="tab"][data-tab-value="betreuungszeiten"]'
  - id: kinderdetail-krank-melden
    titel: Ein Kind krank melden
    portal: tenant
    rolle: admin
    pfad: /students/search
    vorbereitung:
      - klicken: 'role=button[name="Finn Hartmann - Details öffnen"]'
      - warten_auf: 'role=tab[name="Stammdaten"]'
      - klicken: 'main button:has-text("Krank melden")'
      - warten_auf: '[role="dialog"]'
  - id: meine-gruppen
    titel: Meine Gruppe mit allen Kindern
    portal: tenant
    rolle: admin
    pfad: /ogs-groups
    geraete: [iphone, ipad, macbook]
  - id: gruppe-uebergeben
    titel: Gruppe vorübergehend übergeben
    portal: tenant
    rolle: admin
    pfad: /ogs-groups
    vorbereitung:
      - klicken: 'role=button[name="Weitere Aktionen"]'
      - klicken: 'text=Gruppe übergeben'
      - warten_auf: '[role="dialog"]'
  - id: aktuelle-aufsicht
    titel: Laufende Aufsicht im Raum
    portal: tenant
    rolle: betreuer
    pfad: /active-supervisions
  - id: spontane-aktivitaet
    titel: Spontane Aktivität starten
    portal: tenant
    rolle: admin
    pfad: /active-supervisions
    vorbereitung:
      - klicken: 'main button:has-text("Spontane Aktivität starten")'
      - warten_auf: '[role="dialog"]'
  - id: tagesplan
    titel: Tagesplan mit laufenden Blöcken
    portal: tenant
    rolle: betreuer
    pfad: /tagesplan
  - id: raeume
    titel: Räume und ihre Belegung
    portal: tenant
    rolle: admin
    pfad: /rooms
  - id: notfall
    titel: Notfallliste
    portal: tenant
    rolle: admin
    pfad: /emergency

